<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Aprendiendo Optimización Lineal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <div class="logo">AO</div>
        <div>
          <h1>Aprendiendo Optimización Lineal</h1>
          <p>Curso interactivo: teoría, desarrollo paso a paso, práctica guiada y ejercicios libres.</p>
          <div class="progress-shell"><div id="globalProgress" class="progress-bar"></div></div>
        </div>
      </div>
      <div class="top-actions">
        <span id="progressText" class="pill">0% avance</span>
        <button id="themeBtn" class="btn small outline" type="button">🌙</button>
        <button id="readBtn" class="btn small outline" type="button">Lectura</button>
      </div>
    </div>
  </header>
  <nav class="mainnav">
    <div class="nav-inner">
      <button class="nav-btn active" data-view="home">Inicio</button>
      <button class="nav-btn" data-view="course">Curso</button>
      <button class="nav-btn" data-view="practice">Práctica</button>
      <button class="nav-btn" data-view="quiz">Quiz</button>
      <button class="nav-btn" data-view="formula">Formulario</button>
    </div>
  </nav>
  <main id="app" class="container"></main>
  <footer class="footer">Aplicación offline. Tu avance y desarrollos se guardan en este navegador.</footer>
  <script src="app.js"></script>
</body>
</html>
