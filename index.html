<script>
const MODULES = [{"id": "formulacion", "icon": "🧩", "title": "1. Formulación de modelos", "subtitle": "Desde un problema escrito hasta variables, objetivo y restricciones.", "goal": "Que puedas leer un enunciado y transformarlo en un modelo de programación lineal.", "theory": "\n<h3>Qué es formular</h3>\n<p>Formular es traducir un problema real a matemáticas. En optimización lineal siempre debes ordenar la información en cuatro partes: <b>variables de decisión</b>, <b>función objetivo</b>, <b>restricciones</b> y <b>no negatividad</b>.</p>\n<div class=\"formula\">Variable: x<sub>i</sub> = decisión que quiero calcular<br>Objetivo: Max/Min Z = suma de ganancias, costos o tiempos<br>Restricciones: recursos, demanda, capacidad, equilibrio, lógica<br>No negatividad: x<sub>i</sub> ≥ 0</div>\n<h3>Orden recomendado para formular</h3>\n<ol>\n<li><b>Detecta qué se decide:</b> producir, comprar, transportar, asignar, contratar, guardar inventario, etc.</li>\n<li><b>Define variables con unidad:</b> x<sub>1</sub> = unidades del producto A a fabricar por semana.</li>\n<li><b>Identifica si se maximiza o minimiza:</b> utilidad/beneficio normalmente se maximiza; costo/tiempo se minimiza.</li>\n<li><b>Escribe restricciones:</b> recursos disponibles, demandas mínimas, capacidades máximas, balances.</li>\n<li><b>Agrega no negatividad:</b> salvo que el enunciado diga variable libre o con cota inferior distinta.</li>\n</ol>\n<h3>Patrones que se repiten en el curso</h3>\n<ul>\n<li><b>Producción:</b> recursos consumidos ≤ disponibilidad.</li>\n<li><b>Demanda:</b> producción + inventario + compra ≥ demanda, o balance exacto.</li>\n<li><b>Inventario multiperíodo:</b> inventario inicial + producción + compras = demanda + inventario final.</li>\n<li><b>Transporte:</b> salidas de cada origen = oferta; entradas a cada destino = demanda.</li>\n<li><b>Asignación:</b> cada persona realiza una tarea y cada tarea recibe una persona.</li>\n</ul>\n<div class=\"note warn\"><b>Error típico:</b> escribir x<sub>1</sub> y x<sub>2</sub> sin decir qué significan. En una prueba, eso puede costar puntos aunque las ecuaciones estén bien.</div>\n", "examples": [{"title": "Producción con dos productos", "body": "Una fábrica produce mesas x1 y sillas x2. Gana 30 por mesa y 20 por silla. Cada mesa usa 4 horas y cada silla 2 horas; hay 100 horas. Modelo: Max Z = 30x1 + 20x2; 4x1 + 2x2 ≤ 100; x1,x2 ≥ 0."}, {"title": "Minimización de costo", "body": "Se compran alimentos A y B. A cuesta 5, B cuesta 8. Se requiere al menos 40 unidades de nutriente: A aporta 2 y B aporta 4. Modelo: Min Z = 5x1 + 8x2; 2x1 + 4x2 ≥ 40; x1,x2 ≥ 0."}, {"title": "Inventario multiperíodo", "body": "Si I0=15, producción x1, demanda 35 e inventario final I1, el balance del período es: 15 + x1 = 35 + I1. La lógica es: lo que tengo + lo que hago = lo que vendo + lo que guardo."}, {"title": "Compra externa para un período futuro", "body": "Si y son unidades compradas hoy pero disponibles en invierno, no aparecen en la demanda de verano. En invierno se escribe: I2 + x3 + y = demanda de invierno + I3."}, {"title": "Asignación uno a uno", "body": "Si xij=1 cuando trabajador i realiza tarea j, entonces para cada trabajador: suma_j xij = 1; para cada tarea: suma_i xij = 1; xij binaria."}], "guided": [{"title": "Guía 1: arma un modelo básico", "steps": [{"q": "Una empresa fabrica A y B. Utilidades: A=12, B=20. Define las variables usando x1 y x2. Escribe algo como: x1=A,x2=B", "answers": ["x1=a,x2=b", "x1 producto a x2 producto b", "x1=producto a,x2=producto b"], "mode": "loose", "hint": "La variable debe representar cantidad producida de cada producto.", "explain": "Correcto: x1 puede ser cantidad de A y x2 cantidad de B."}, {"q": "Escribe la función objetivo sin espacios: Max Z = ?", "answers": ["12x1+20x2", "z=12x1+20x2", "maxz=12x1+20x2"], "mode": "expr", "hint": "Se multiplican utilidades por cantidades.", "explain": "La utilidad total es 12x1 + 20x2."}, {"q": "Si A usa 2 horas, B usa 4 horas y hay 80 horas, escribe la restricción.", "answers": ["2x1+4x2<=80", "2x1+4x2≤80"], "mode": "expr", "hint": "Es una restricción de capacidad máxima.", "explain": "La restricción es 2x1 + 4x2 ≤ 80."}, {"q": "Escribe la condición de no negatividad.", "answers": ["x1,x2>=0", "x1>=0,x2>=0", "x1≥0,x2≥0"], "mode": "expr", "hint": "Las cantidades no pueden ser negativas.", "explain": "x1 ≥ 0, x2 ≥ 0."}]}, {"title": "Guía 2: inventario", "steps": [{"q": "Inventario inicial 15, producción x1, demanda 35, inventario final I1. Escribe el balance.", "answers": ["15+x1=35+i1", "x1+15=35+i1"], "mode": "expr", "hint": "Lo disponible = lo usado para demanda + lo guardado.", "explain": "Balance: 15 + x1 = 35 + I1."}, {"q": "Si producción máxima por período es 40, escribe la restricción para x1.", "answers": ["x1<=40", "x1≤40"], "mode": "expr", "hint": "Es capacidad máxima.", "explain": "x1 ≤ 40."}, {"q": "Si el inventario máximo es 18, escribe la restricción para I1.", "answers": ["i1<=18", "i1≤18"], "mode": "expr", "hint": "El inventario no puede superar 18.", "explain": "I1 ≤ 18."}]}], "solo": [{"q": "Formule un modelo para producir 3 productos con utilidades 5, 8 y 9, usando dos recursos: recurso 1 disponible 100 con consumos 2,3,1; recurso 2 disponible 80 con consumos 1,2,4.", "solution": "Max Z=5x1+8x2+9x3; 2x1+3x2+x3≤100; x1+2x2+4x3≤80; x≥0."}, {"q": "Formule un modelo de minimización para comprar A y B, costos 4 y 7, donde 3A+2B≥60 y A+4B≥40.", "solution": "Min Z=4x1+7x2; 3x1+2x2≥60; x1+4x2≥40; x≥0."}, {"q": "Escriba el balance de inventario para 3 períodos con I0=10, demandas d1,d2,d3 y producción xt.", "solution": "10+x1=d1+I1; I1+x2=d2+I2; I2+x3=d3+I3."}, {"q": "Defina variables y restricciones para asignar 4 trabajadores a 4 tareas.", "solution": "xij=1 si trabajador i hace tarea j; suma_j xij=1 para cada trabajador; suma_i xij=1 para cada tarea; xij∈{0,1}."}, {"q": "Formule un transporte con 2 orígenes y 3 destinos.", "solution": "xij=cantidad enviada de origen i a destino j; minimizar suma cijxij; restricciones de oferta por fila y demanda por columna; xij≥0."}]}, {"id": "grafico", "icon": "📈", "title": "2. Método gráfico", "subtitle": "Solución de modelos con dos variables mediante región factible.", "goal": "Que puedas dibujar restricciones, encontrar vértices y elegir el óptimo.", "theory": "\n<p>El método gráfico se usa cuando el modelo tiene <b>dos variables</b>. La idea es dibujar todas las restricciones y quedarse con la zona que las cumple al mismo tiempo.</p>\n<h3>Pasos</h3>\n<ol>\n<li>Transforma cada desigualdad en igualdad para dibujar la recta.</li>\n<li>Encuentra dos puntos de cada recta, normalmente usando x<sub>1</sub>=0 y x<sub>2</sub>=0.</li>\n<li>Determina el lado correcto probando un punto, normalmente (0,0), si no está sobre la recta.</li>\n<li>Marca la región factible.</li>\n<li>Encuentra los vértices de la región.</li>\n<li>Evalúa Z en cada vértice.</li>\n<li>El mejor valor es el óptimo.</li>\n</ol>\n<div class=\"formula\">Recta: ax<sub>1</sub> + bx<sub>2</sub> = c<br>Si x<sub>1</sub>=0 → x<sub>2</sub>=c/b<br>Si x<sub>2</sub>=0 → x<sub>1</sub>=c/a</div>\n<h3>Casos especiales</h3>\n<ul>\n<li><b>Múltiples soluciones:</b> la recta objetivo queda paralela a una arista óptima.</li>\n<li><b>Infactible:</b> no existe zona común.</li>\n<li><b>No acotado:</b> la región permite mejorar Z indefinidamente.</li>\n</ul>\n<div class=\"note\"><b>Clave de prueba:</b> si te preguntan “¿existen múltiples soluciones?”, compara la pendiente de la función objetivo con las pendientes de las restricciones activas.</div>\n", "examples": [{"title": "Máximo por vértices", "body": "Max Z=3x1+2x2; x1+x2≤4; x1≤3; x2≤2. Vértices: (0,0),(3,0),(3,1),(2,2),(0,2). Z: 0,9,11,10,4. Óptimo: (3,1), Z=11."}, {"title": "Mínimo con cotas inferiores", "body": "Min Z=2x1+x2; x1+x2≥5; x1≥1; x2≥1. La región está hacia arriba de x1+x2=5. Vértices relevantes: (1,4),(4,1). Z=6 y 9. Óptimo: (1,4)."}, {"title": "Múltiples óptimos", "body": "Max Z=2x1+2x2; x1+x2≤5. La función objetivo es paralela a x1+x2=5, por eso todos los puntos del segmento factible sobre esa recta son óptimos."}, {"title": "Restricción con variable libre", "body": "Si x1 es sin restricción de signo, el gráfico puede extenderse hacia x1 negativo. No debes forzar x1≥0 si el enunciado dice s.r.s."}, {"title": "No factible", "body": "x1+x2≤2 y x1+x2≥5 no tienen intersección común. No hay solución factible."}], "guided": [{"title": "Guía 1: interceptos", "steps": [{"q": "Para la recta 2x1+3x2=12, si x1=0, ¿cuánto vale x2?", "answers": ["4"], "mode": "exact", "hint": "3x2=12.", "explain": "x2=4."}, {"q": "Para la misma recta, si x2=0, ¿cuánto vale x1?", "answers": ["6"], "mode": "exact", "hint": "2x1=12.", "explain": "x1=6."}, {"q": "Con restricción 2x1+3x2≤12, ¿el punto (0,0) cumple? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "Evalúa: 0≤12.", "explain": "Sí cumple, por lo tanto se sombrea el lado que contiene al origen."}]}, {"title": "Guía 2: evaluar vértices", "steps": [{"q": "Max Z=5x1+4x2. En el vértice (2,3), ¿cuánto vale Z?", "answers": ["22"], "mode": "exact", "hint": "5(2)+4(3).", "explain": "Z=10+12=22."}, {"q": "En el vértice (4,1), ¿cuánto vale Z?", "answers": ["24"], "mode": "exact", "hint": "5(4)+4(1).", "explain": "Z=20+4=24."}, {"q": "Entre (2,3) y (4,1), ¿cuál es mejor para maximizar? Escribe el punto.", "answers": ["(4,1)", "4,1"], "mode": "expr", "hint": "El mayor Z gana.", "explain": "(4,1) porque Z=24 es mayor."}]}], "solo": [{"q": "Resuelve gráficamente: Max Z=4x1+3x2; x1+x2≤6; 2x1+x2≤8; x1,x2≥0.", "solution": "Vértices: (0,0),(4,0),(2,4),(0,6). Z:0,16,20,18. Óptimo (2,4), Z=20."}, {"q": "Determine si hay múltiples óptimos: Max Z=3x1+6x2; x1+2x2≤10; x1≤8; x≥0.", "solution": "Z=3(x1+2x2), paralelo a la restricción x1+2x2=10. Hay múltiples soluciones sobre el segmento factible de esa recta."}, {"q": "Encuentra interceptos de 3x1+2x2=18.", "solution": "Si x1=0, x2=9. Si x2=0, x1=6."}, {"q": "Evalúa Z=7x1+2x2 en (0,5),(3,2),(4,0).", "solution": "10,25,28. Mejor para max: (4,0). Mejor para min: (0,5)."}, {"q": "Explica cuándo un problema gráfico es no acotado.", "solution": "Cuando la región factible se extiende en la dirección en que la función objetivo mejora sin límite."}]}, {"id": "estandar", "icon": "🧱", "title": "3. Forma estándar", "subtitle": "Cómo preparar un modelo para simplex, Big M y dual.", "goal": "Convertir cualquier PL a la forma estándar usada en el curso.", "theory": "\n<p>En el material del curso, la forma estándar se presenta como un modelo de <b>minimización</b>, con restricciones de igualdad y variables no negativas.</p>\n<div class=\"formula\">Min Z = c<sup>t</sup>x<br>Ax = b<br>x ≥ 0</div>\n<h3>Reglas de transformación</h3>\n<ul>\n<li>Restricción ≤: se suma una <b>variable de holgura</b> h ≥ 0.</li>\n<li>Restricción ≥: se resta una <b>variable de exceso</b> e ≥ 0. Si necesitas base inicial, agrega artificial.</li>\n<li>Restricción =: queda igual, pero puede necesitar artificial para iniciar simplex.</li>\n<li>Variable libre o s.r.s.: se escribe como diferencia de dos variables no negativas: x = x⁺ − x⁻.</li>\n<li>Cota inferior distinta de cero: se hace cambio de variable. Ejemplo: x ≥ -1 → x' = x + 1 → x = x' − 1.</li>\n<li>Si b es negativo: multiplica toda la restricción por −1.</li>\n</ul>\n<div class=\"note warn\"><b>No confundas:</b> holgura se suma en ≤; exceso se resta en ≥.</div>\n", "examples": [{"title": "Restricción ≤", "body": "2x1+3x2≤12 se transforma en 2x1+3x2+h1=12, h1≥0."}, {"title": "Restricción ≥", "body": "4x1+x2≥20 se transforma en 4x1+x2−e1=20, e1≥0. Para simplex con base inicial se agrega artificial a1."}, {"title": "Variable libre", "body": "Si x1 s.r.s., se reemplaza por x1=x1⁺−x1⁻ con x1⁺,x1⁻≥0."}, {"title": "Cota inferior", "body": "Si x2≥3, define x2’=x2−3, entonces x2=x2’+3 y x2’≥0. Luego reemplazas en todo el modelo."}, {"title": "Cambiar máximo a mínimo", "body": "Max Z=5x1+2x2 puede transformarse en Min W=−5x1−2x2, donde W=−Z."}], "guided": [{"title": "Guía 1: holgura y exceso", "steps": [{"q": "Convierte 3x1+2x2≤18 a igualdad con holgura h1.", "answers": ["3x1+2x2+h1=18"], "mode": "expr", "hint": "En ≤ se suma holgura.", "explain": "3x1+2x2+h1=18."}, {"q": "Convierte 5x1+x2≥10 a igualdad con exceso e1.", "answers": ["5x1+x2-e1=10"], "mode": "expr", "hint": "En ≥ se resta exceso.", "explain": "5x1+x2−e1=10."}, {"q": "Si b=-6 en una restricción, ¿qué debes hacer? Escribe: multiplicar por -1", "answers": ["multiplicar por -1", "multiplicar por menos 1"], "mode": "loose", "hint": "En forma estándar se prefiere b≥0.", "explain": "Se multiplica toda la restricción por −1."}]}, {"title": "Guía 2: cambio de variable", "steps": [{"q": "Si x1≥-1, una opción es x1’=x1+1. Entonces x1 = ?", "answers": ["x1prima-1", "x1'-1", "x1p-1"], "mode": "expr", "hint": "Despeja x1.", "explain": "x1 = x1’ − 1."}, {"q": "Si x2≥1, define x2’=x2−1. Entonces x2 = ?", "answers": ["x2prima+1", "x2'+1", "x2p+1"], "mode": "expr", "hint": "Despeja x2.", "explain": "x2 = x2’ + 1."}, {"q": "Si x es libre, escribe la transformación general.", "answers": ["x=x+-x-", "x=xmas-xmenos", "x=xpositiva-xnegativa"], "mode": "loose", "hint": "Diferencia de dos variables no negativas.", "explain": "x = x⁺ − x⁻, con x⁺,x⁻≥0."}]}], "solo": [{"q": "Pase a forma estándar: Max Z=3x1+2x2; x1+x2≤5; 2x1+x2≥8; x≥0.", "solution": "Una forma: Min W=−3x1−2x2; x1+x2+h1=5; 2x1+x2−e2=8; variables ≥0. Para Big M, agregar artificial en la segunda restricción."}, {"q": "Transforme x1 s.r.s. en variables no negativas.", "solution": "x1=x1⁺−x1⁻, x1⁺≥0, x1⁻≥0."}, {"q": "Transforme x2≥4.", "solution": "x2’=x2−4, x2=x2’+4, x2’≥0."}, {"q": "¿Qué variable se agrega en una restricción = para iniciar con Big M?", "solution": "Una variable artificial."}, {"q": "Convierte −2x1+x2≤−10 con b positivo.", "solution": "Multiplicar por −1: 2x1−x2≥10. Luego 2x1−x2−e1=10."}]}, {"id": "simplex", "icon": "🧮", "title": "4. Simplex, Big M y Simplex Dual", "subtitle": "Tablas, base, variable entrante/saliente y soluciones múltiples.", "goal": "Entender cómo avanza simplex y cómo detectar óptimo, infactibilidad y múltiples soluciones.", "theory": "\n<p>Simplex recorre vértices de la región factible. En tabla, cada iteración cambia una variable de la base por otra hasta que ya no se puede mejorar.</p>\n<h3>Elementos</h3>\n<ul>\n<li><b>Base:</b> variables que actualmente tienen valor.</li>\n<li><b>No básicas:</b> variables en cero.</li>\n<li><b>Columna pivote:</b> variable que entra.</li>\n<li><b>Fila pivote:</b> variable que sale.</li>\n<li><b>Pivote:</b> número donde se cruza columna entrante y fila saliente.</li>\n</ul>\n<h3>Big M</h3>\n<p>Se usa cuando no tienes una base inicial evidente, normalmente por restricciones ≥ o =. Se agregan variables artificiales penalizadas con M en la función objetivo.</p>\n<div class=\"formula\">Min: artificial con +M<br>Max: artificial con −M o transformar adecuadamente</div>\n<h3>Simplex dual</h3>\n<p>Se usa cuando la tabla es óptima en costos reducidos pero tiene términos independientes negativos. Trabaja recuperando factibilidad.</p>\n<h3>Múltiples óptimos</h3>\n<p>Si en una tabla óptima hay una variable no básica con costo reducido cero, puede existir otra solución óptima.</p>\n<div class=\"note warn\"><b>Error típico:</b> terminar una tabla con variable artificial positiva. Eso indica problema infactible o formulación mal hecha.</div>\n", "examples": [{"title": "Base inicial con holguras", "body": "Si todas las restricciones son ≤ y b≥0, las holguras forman una base inicial natural."}, {"title": "Restricción ≥ con Big M", "body": "2x1+x2≥10 se escribe 2x1+x2−e1+a1=10. La artificial a1 permite partir con base, pero debe salir al final."}, {"title": "Criterio de salida", "body": "Para una columna entrante positiva, se calcula b/aij con aij>0. Sale la menor razón no negativa."}, {"title": "Solución múltiple", "body": "En una tabla óptima, si x2 es no básica y tiene costo reducido 0, al hacerla entrar se obtiene otra solución con el mismo Z."}, {"title": "Infactibilidad", "body": "Si al final de Big M queda una artificial en la base con valor positivo, no hay solución factible para el modelo original."}], "guided": [{"title": "Guía 1: pivote", "steps": [{"q": "En una columna entrante, los coeficientes positivos son 2 y 4, con b=10 y b=12. Razones: 10/2 y 12/4. ¿Cuál es la menor?", "answers": ["3"], "mode": "exact", "hint": "10/2=5; 12/4=3.", "explain": "La menor razón es 3, por lo tanto sale la segunda fila."}, {"q": "Si una restricción es ≥, ¿qué dos variables suelen aparecer para Big M? Responde: exceso y artificial.", "answers": ["exceso y artificial", "artificial y exceso"], "mode": "loose", "hint": "Se resta una y se suma otra.", "explain": "Se resta exceso y se suma artificial."}, {"q": "Si una artificial queda positiva al final, ¿el problema original es factible? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "La artificial no representa una variable real.", "explain": "No. Indica infactibilidad del modelo original."}]}, {"title": "Guía 2: óptimo múltiple", "steps": [{"q": "En una tabla óptima, una variable no básica tiene costo reducido 0. ¿Puede existir otra solución óptima? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "Costo reducido cero significa que puede entrar sin cambiar Z.", "explain": "Sí, puede existir solución óptima alternativa."}, {"q": "Si no hay variable no básica con costo reducido 0, ¿se asegura óptimo único? Responde normalmente si.", "answers": ["si", "sí"], "mode": "exact", "hint": "En el contexto simplex, esa señal de múltiple ya no aparece.", "explain": "Sí, bajo la tabla óptima no degenerada se interpreta como óptimo único."}]}], "solo": [{"q": "Explique cuándo usar Big M.", "solution": "Cuando no existe base inicial evidente, usualmente con restricciones ≥ o =, agregando variables artificiales penalizadas."}, {"q": "Dada una columna entrante con b=[20,18,30] y columna=[4,3,-2], ¿qué fila sale?", "solution": "Razones positivas: 20/4=5, 18/3=6. La menor es 5, sale la primera fila. Se ignora −2."}, {"q": "¿Qué indica una variable no básica con costo reducido cero en una tabla óptima?", "solution": "Posible solución óptima múltiple."}, {"q": "¿Qué pasa si todas las razones son negativas o cero no válido en simplex primal?", "solution": "Puede indicar problema no acotado en la dirección de mejora."}, {"q": "¿Por qué una variable artificial debe desaparecer de la base?", "solution": "Porque no representa una decisión real; solo fue una ayuda para iniciar el método."}]}, {"id": "sensibilidad", "icon": "🔎", "title": "5. Análisis de sensibilidad", "subtitle": "Interpretar cambios sin resolver todo de nuevo.", "goal": "Responder cambios de recursos, costos, utilidades y variables nuevas usando la solución óptima.", "theory": "\n<p>El análisis de sensibilidad responde: <b>¿qué ocurre si cambia un dato del modelo?</b> No siempre hay que resolver de nuevo; mientras el cambio esté dentro del rango válido, se usa la información de la solución óptima.</p>\n<h3>Conceptos principales</h3>\n<div class=\"grid2\">\n<div class=\"mini\"><b>Precio sombra</b><br>Variación de Z si aumenta una unidad el lado derecho de una restricción, dentro de su rango.</div>\n<div class=\"mini\"><b>Rango de factibilidad</b><br>Intervalo en que puede cambiar b sin cambiar la base óptima.</div>\n<div class=\"mini\"><b>Rango de optimalidad</b><br>Intervalo en que puede cambiar un coeficiente de Z sin cambiar la solución óptima.</div>\n<div class=\"mini\"><b>Costo reducido</b><br>Mejora necesaria para que una variable actualmente en cero entre a la solución.</div>\n</div>\n<h3>Interpretaciones rápidas</h3>\n<ul>\n<li>Si una restricción tiene holgura, normalmente su precio sombra es 0.</li>\n<li>Si el cambio de b está dentro del rango, nuevo Z = Z original + precio sombra × cambio.</li>\n<li>Si un coeficiente de la función objetivo cambia dentro de su rango, la solución x* se mantiene, aunque Z puede cambiar.</li>\n<li>Si sale del rango, normalmente debes reoptimizar.</li>\n</ul>\n<div class=\"note warn\"><b>Error típico:</b> usar precio sombra fuera del rango permitido. El precio sombra no es eterno.</div>\n", "examples": [{"title": "Precio sombra directo", "body": "Si Z*=500 y el precio sombra de horas es 4, al aumentar 3 horas dentro del rango: nuevo Z=500+4(3)=512."}, {"title": "Disminución de recurso", "body": "Si el precio sombra es 7 y el recurso baja 2 unidades dentro del rango: Z cambia en 7(−2)=−14."}, {"title": "Holgura positiva", "body": "Si sobran 10 kg de material, una unidad extra de material no mejora la solución; precio sombra suele ser 0."}, {"title": "Coeficiente de variable básica", "body": "Si la utilidad de x1 puede variar entre 8 y 15 y cambia de 10 a 13, la base óptima se mantiene."}, {"title": "Costo reducido", "body": "En maximización, si una variable no usada tiene costo reducido −5, su utilidad debe mejorar al menos 5 para entrar, según convención de tabla."}], "guided": [{"title": "Guía 1: precio sombra", "steps": [{"q": "Z*=1000. Precio sombra=6. El recurso aumenta 5 unidades dentro del rango. ¿Nuevo Z?", "answers": ["1030"], "mode": "exact", "hint": "1000+6×5.", "explain": "Nuevo Z=1030."}, {"q": "Z*=800. Precio sombra=4. El recurso disminuye 10 unidades dentro del rango. ¿Nuevo Z?", "answers": ["760"], "mode": "exact", "hint": "800+4×(−10).", "explain": "Nuevo Z=760."}, {"q": "Si el cambio está fuera del rango, ¿puedes usar directamente el precio sombra? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "El rango limita la validez.", "explain": "No, debes reoptimizar o hacer análisis adicional."}]}, {"title": "Guía 2: rangos", "steps": [{"q": "El rango de optimalidad de c1 es [20,35]. Si c1 pasa de 25 a 30, ¿la base cambia? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "30 está dentro del intervalo.", "explain": "No cambia la base óptima."}, {"q": "El rango de factibilidad de b2 es [40,70]. Si b2 pasa a 75, ¿está dentro del rango? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "75 es mayor que 70.", "explain": "No está dentro del rango."}]}], "solo": [{"q": "Z*=250, precio sombra=3, aumento de recurso=12 dentro del rango. Calcule nuevo Z.", "solution": "250+3(12)=286."}, {"q": "Explique qué significa costo reducido de una variable no básica.", "solution": "Indica cuánto tendría que mejorar su coeficiente objetivo para que sea conveniente usarla, según la convención de la tabla."}, {"q": "Si una restricción tiene holgura positiva, ¿qué esperas del precio sombra?", "solution": "Normalmente precio sombra 0, porque el recurso no está limitando."}, {"q": "Si el coeficiente de una variable básica sale de su rango de optimalidad, ¿qué se hace?", "solution": "Se debe reoptimizar o continuar simplex con los nuevos datos."}, {"q": "Diferencia entre rango de optimalidad y factibilidad.", "solution": "Optimalidad: cambios en coeficientes de Z. Factibilidad: cambios en lados derechos b."}]}, {"id": "entera", "icon": "🌳", "title": "6. Optimización entera y Branch and Bound", "subtitle": "Cuando las variables deben ser números enteros.", "goal": "Resolver problemas enteros pequeños ramificando y podando.", "theory": "\n<p>Un problema entero aparece cuando no tiene sentido aceptar decimales: camiones, personas, turnos, máquinas, proyectos completos, etc.</p>\n<h3>Tipos</h3>\n<ul>\n<li><b>Entera pura:</b> todas las variables son enteras.</li>\n<li><b>Mixta:</b> algunas variables son enteras y otras continuas.</li>\n<li><b>Binaria:</b> variables 0/1, por ejemplo tomar o no tomar una decisión.</li>\n</ul>\n<h3>Branch and Bound</h3>\n<ol>\n<li>Resolver la <b>relajación lineal</b>: ignorar temporalmente que las variables sean enteras.</li>\n<li>Si la solución es entera, queda como candidata.</li>\n<li>Si alguna variable es decimal, ramificar.</li>\n<li>Si x=4,6: rama izquierda x≤4; rama derecha x≥5.</li>\n<li>Resolver cada rama.</li>\n<li>Podar por infactibilidad, por peor valor que la mejor solución entera o por solución entera.</li>\n</ol>\n<div class=\"formula\">Decimal 4,6 → piso 4 y techo 5<br>Rama 1: x ≤ 4<br>Rama 2: x ≥ 5</div>\n<div class=\"note warn\"><b>Error típico:</b> redondear directamente la solución relajada. No se redondea; se ramifica.</div>\n", "examples": [{"title": "Variable decimal", "body": "Si la relajación da x1=2,3 y x2=5, se ramifica en x1≤2 y x1≥3."}, {"title": "Poda por cota en maximización", "body": "Si ya tienes solución entera Z=80 y una rama relajada da máximo posible Z=75, esa rama no puede mejorar y se poda."}, {"title": "Poda por infactibilidad", "body": "Si al agregar x1≥5 el modelo no tiene solución, se corta esa rama."}, {"title": "Solución entera candidata", "body": "Si una rama da x1=3, x2=4 y cumple todo, se guarda como incumbente."}, {"title": "Binaria", "body": "Si y∈{0,1}, representa decisiones sí/no. Por ejemplo y=1 si se abre una bodega."}], "guided": [{"title": "Guía 1: ramificación", "steps": [{"q": "La relajación da x1=4,6. Escribe la rama izquierda.", "answers": ["x1<=4", "x1≤4"], "mode": "expr", "hint": "Usa piso del decimal.", "explain": "Rama izquierda: x1≤4."}, {"q": "Ahora escribe la rama derecha.", "answers": ["x1>=5", "x1≥5"], "mode": "expr", "hint": "Usa techo del decimal.", "explain": "Rama derecha: x1≥5."}, {"q": "¿Se redondea directamente x1=4,6 a 5 como respuesta final? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "Branch and Bound no redondea sin justificar.", "explain": "No, se debe explorar o podar ramas."}]}, {"title": "Guía 2: poda", "steps": [{"q": "Maximización. Mejor solución entera actual Z=50. Una rama relajada da Z=46. ¿Se poda? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "La rama no puede superar 46.", "explain": "Sí, se poda por cota."}, {"q": "Maximización. Mejor entera Z=50. Una rama relajada da Z=60 pero decimal. ¿Se poda por cota? Responde si o no.", "answers": ["no"], "mode": "exact", "hint": "Podría contener una solución entera mejor.", "explain": "No se poda por cota; se sigue ramificando si corresponde."}]}], "solo": [{"q": "Relajación: x1=3,2, x2=1. ¿Qué ramas se crean si eliges x1?", "solution": "x1≤3 y x1≥4."}, {"q": "En minimización, tienes mejor entera Z=120. Una rama relajada da Z=150. ¿Se poda?", "solution": "Sí. En minimización, si el mejor posible de la rama ya es mayor que 120, no mejora."}, {"q": "Explique tres motivos de poda.", "solution": "Infactible; solución entera; cota peor que la mejor solución entera actual."}, {"q": "¿Qué es la relajación lineal?", "solution": "El mismo modelo, pero sin exigir integralidad de variables."}, {"q": "Dé un ejemplo de variable binaria.", "solution": "y=1 si se instala una planta; y=0 si no se instala."}]}, {"id": "transporte", "icon": "🚚", "title": "7. Transporte: Vogel y MODI", "subtitle": "Oferta, demanda, solución inicial y mejora óptima.", "goal": "Resolver tablas de transporte de minimización y maximización.", "theory": "\n<p>Transporte se usa cuando hay <b>orígenes</b> con oferta y <b>destinos</b> con demanda. La decisión x<sub>ij</sub> indica cuánto enviar desde i hasta j.</p>\n<div class=\"formula\">Min Z = Σ c<sub>ij</sub>x<sub>ij</sub><br>Σ<sub>j</sub>x<sub>ij</sub> = oferta<sub>i</sub><br>Σ<sub>i</sub>x<sub>ij</sub> = demanda<sub>j</sub><br>x<sub>ij</sub> ≥ 0</div>\n<h3>Antes de resolver</h3>\n<p>Verifica si está balanceado: oferta total = demanda total. Si no, agrega origen o destino ficticio.</p>\n<h3>Vogel</h3>\n<ol>\n<li>Penalidad por fila/columna = diferencia entre los dos costos menores.</li>\n<li>Escoge la mayor penalidad.</li>\n<li>En esa fila/columna, asigna en el menor costo.</li>\n<li>Asigna el máximo posible.</li>\n<li>Tacha fila o columna y repite.</li>\n</ol>\n<h3>MODI / Simplex de transporte</h3>\n<ol>\n<li>Con las casillas ocupadas, calcula u<sub>i</sub> y v<sub>j</sub> usando c<sub>ij</sub>=u<sub>i</sub>+v<sub>j</sub>.</li>\n<li>En casillas vacías calcula Δ<sub>ij</sub>=c<sub>ij</sub>−u<sub>i</sub>−v<sub>j</sub>.</li>\n<li>Minimización: si todos Δ≥0, óptimo.</li>\n<li>Si hay Δ negativo, entra el más negativo y se arma ciclo + − + −.</li>\n</ol>\n<h3>Maximización en transporte</h3>\n<p>Puedes transformar beneficios a costos usando <b>−beneficio</b> o restando desde el mayor beneficio. Al final, evalúa con beneficios originales.</p>\n<div class=\"note warn\"><b>Error típico:</b> calcular Z con costos transformados en vez de la tabla original al final.</div>\n", "examples": [{"title": "Balance", "body": "Oferta 20+30=50; demanda 25+25=50. Está balanceado. Si demanda fuera 60, agregas origen ficticio con oferta 10."}, {"title": "Penalidad Vogel", "body": "Fila con costos 8,6,10. Dos menores: 6 y 8. Penalidad: 8−6=2."}, {"title": "Asignación Vogel", "body": "Si eliges una columna con menor costo en O2-D3, oferta O2=30 y demanda D3=20, asignas min(30,20)=20."}, {"title": "MODI mínimo", "body": "Si para una casilla vacía Δ=-4, mover por esa ruta reduce el costo. Entra la casilla más negativa."}, {"title": "Transporte máximo", "body": "Con beneficios, se puede usar costo transformado = mayor beneficio − beneficio. Luego se aplica algoritmo de minimización."}], "guided": [{"title": "Guía 1: Vogel 2x2", "steps": [{"q": "Ofertas: 20 y 30. Demandas: 25 y 25. ¿Está balanceado? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "Oferta total=50, demanda total=50.", "explain": "Sí, ambas suman 50."}, {"q": "Costos O1: 4 y 6. ¿Penalidad de la fila O1?", "answers": ["2"], "mode": "exact", "hint": "6−4.", "explain": "Penalidad O1=2."}, {"q": "Costos O2: 5 y 3. ¿Penalidad de la fila O2?", "answers": ["2"], "mode": "exact", "hint": "5−3.", "explain": "Penalidad O2=2."}, {"q": "Columna D2 tiene costos 6 y 3. ¿Penalidad de D2?", "answers": ["3"], "mode": "exact", "hint": "6−3.", "explain": "Penalidad D2=3, la mayor."}, {"q": "En D2 el menor costo está en O2-D2. Oferta O2=30, demanda D2=25. ¿Cuánto asignas?", "answers": ["25"], "mode": "exact", "hint": "mínimo entre 30 y 25.", "explain": "Asignas 25."}]}, {"title": "Guía 2: MODI", "steps": [{"q": "En minimización, si todos los Δij son positivos o cero, ¿la solución es óptima? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "Esa es la condición de optimalidad.", "explain": "Sí, ya es óptima."}, {"q": "Si una casilla vacía tiene Δ=-7, ¿conviene mejorar? Responde si o no.", "answers": ["si", "sí"], "mode": "exact", "hint": "En minimización, negativo baja el costo.", "explain": "Sí, entra la casilla con Δ más negativo."}, {"q": "En el ciclo, si los valores en posiciones negativas son 8 y 15, ¿cuánto ajustas?", "answers": ["8"], "mode": "exact", "hint": "Se elige el menor de los signos negativos.", "explain": "Se ajusta 8."}]}], "solo": [{"q": "Calcula las penalidades de la fila [9,4,7].", "solution": "Dos menores: 4 y 7. Penalidad=3."}, {"q": "Oferta total 120, demanda total 100. ¿Qué agregas?", "solution": "Destino ficticio con demanda 20."}, {"q": "Demanda total 90, oferta total 70. ¿Qué agregas?", "solution": "Origen ficticio con oferta 20."}, {"q": "En MODI, u1=0, v2=5, c12=5. ¿Está bien para una casilla ocupada?", "solution": "Sí, porque c12=u1+v2=0+5=5."}, {"q": "Para máximo con beneficios matriz [10,6;8,4], transforma con mayor beneficio.", "solution": "Mayor=10. Costos transformados: [0,4;2,6]."}]}, {"id": "transbordo", "icon": "🔁", "title": "8. Transbordo", "subtitle": "Flujos con nodos intermedios.", "goal": "Formular y resolver redes con puntos que reciben y envían.", "theory": "\n<p>El transbordo es una extensión del transporte. Hay nodos que no son solo origen ni solo destino: <b>reciben y envían</b>.</p>\n<h3>Balance general</h3>\n<div class=\"formula\">Flujo que entra + oferta propia = flujo que sale + demanda propia</div>\n<p>Si el nodo es solo origen, tiene oferta y no demanda. Si es solo destino, tiene demanda y no oferta. Si es intermedio puro, oferta=0 y demanda=0, por lo que entrada = salida.</p>\n<h3>Pasos para formular</h3>\n<ol>\n<li>Dibuja la red o lista los arcos permitidos.</li>\n<li>Define x<sub>ij</sub> = cantidad enviada desde nodo i a nodo j.</li>\n<li>Escribe la función objetivo con los costos de cada arco.</li>\n<li>Escribe una ecuación de balance por nodo.</li>\n<li>Agrega no negatividad.</li>\n</ol>\n<div class=\"note\"><b>Idea simple:</b> nadie puede enviar algo que no tiene. Por eso cada nodo debe cuadrar entradas y salidas.</div>\n", "examples": [{"title": "Nodo intermedio puro", "body": "Bodega B recibe desde planta y envía a clientes. Si no consume ni produce: xPB = xBC1 + xBC2."}, {"title": "Nodo con demanda propia", "body": "Si una ciudad recibe, envía y además demanda 10: entradas = salidas + 10."}, {"title": "Nodo con oferta propia", "body": "Si un centro también produce 20: entradas + 20 = salidas."}, {"title": "Función objetivo", "body": "Si arcos permitidos son A-B costo 4, B-C costo 2 y A-C costo 8: Min Z=4xAB+2xBC+8xAC."}, {"title": "Restricción de capacidad de arco", "body": "Si por A-B se pueden enviar máximo 50: xAB≤50."}], "guided": [{"title": "Guía 1: balance", "steps": [{"q": "Un nodo B recibe xAB y envía xBC y xBD. No produce ni demanda. Escribe el balance.", "answers": ["xab=xbc+xbd"], "mode": "expr", "hint": "Entrada = salida.", "explain": "xAB = xBC + xBD."}, {"q": "Si B además demanda 10, escribe el balance.", "answers": ["xab=xbc+xbd+10"], "mode": "expr", "hint": "Entrada = salida + demanda.", "explain": "xAB = xBC + xBD + 10."}, {"q": "Si B produce 5 y no demanda, escribe el balance.", "answers": ["xab+5=xbc+xbd"], "mode": "expr", "hint": "Entrada + oferta = salida.", "explain": "xAB + 5 = xBC + xBD."}]}, {"title": "Guía 2: objetivo", "steps": [{"q": "Arcos AB costo 3, AC costo 5, BC costo 2. Escribe Min Z.", "answers": ["3xab+5xac+2xbc", "z=3xab+5xac+2xbc"], "mode": "expr", "hint": "Costo por cantidad en cada arco.", "explain": "Min Z=3xAB+5xAC+2xBC."}, {"q": "Si el arco AC tiene capacidad 40, escribe la restricción.", "answers": ["xac<=40", "xac≤40"], "mode": "expr", "hint": "Máximo permitido.", "explain": "xAC≤40."}]}], "solo": [{"q": "Planta P oferta 100; bodega B intermedia; clientes C1 demanda 40 y C2 demanda 60. Arcos P-B, B-C1, B-C2. Formule balances.", "solution": "P: xPB=100. B: xPB=xBC1+xBC2. C1: xBC1=40. C2: xBC2=60."}, {"q": "Nodo N recibe xAN y xBN, envía xNC y demanda 20. Balance.", "solution": "xAN+xBN = xNC + 20."}, {"q": "Nodo N produce 15, recibe xAN, envía xNB y xNC. Balance.", "solution": "xAN+15=xNB+xNC."}, {"q": "Explique diferencia entre transporte y transbordo.", "solution": "Transporte conecta orígenes a destinos; transbordo permite nodos intermedios que reciben y envían."}, {"q": "Agregue restricción de no negatividad para todos los arcos.", "solution": "xij≥0 para cada arco permitido."}]}, {"id": "hungaro", "icon": "🎯", "title": "9. Método Húngaro: minimizar y maximizar", "subtitle": "Problemas de asignación uno a uno.", "goal": "Resolver asignaciones cuadradas y no cuadradas, con costos o beneficios.", "theory": "\n<p>El método húngaro resuelve problemas de <b>asignación</b>: cada trabajador a una tarea, cada máquina a un trabajo, cada persona a un turno, etc.</p>\n<h3>Modelo de asignación</h3>\n<div class=\"formula\">x<sub>ij</sub> = 1 si i se asigna a j; 0 si no<br>Σ<sub>j</sub>x<sub>ij</sub> = 1 para cada i<br>Σ<sub>i</sub>x<sub>ij</sub> = 1 para cada j</div>\n<h3>Húngaro para minimizar</h3>\n<ol>\n<li>Si la matriz no es cuadrada, agrega fila/columna ficticia.</li>\n<li>Resta el menor de cada fila.</li>\n<li>Resta el menor de cada columna.</li>\n<li>Cubre ceros con el mínimo número de líneas.</li>\n<li>Si líneas = n, busca asignación con ceros independientes.</li>\n<li>Si líneas < n, toma el menor no cubierto, réstalo a no cubiertos y súmalo en intersecciones.</li>\n</ol>\n<h3>Húngaro para maximizar</h3>\n<p>Transforma beneficios a costos:</p>\n<div class=\"formula\">Costo transformado = mayor valor de la matriz − beneficio original</div>\n<p>Luego aplicas el método de minimización. La evaluación final se hace con la matriz original.</p>\n<div class=\"note warn\"><b>Error típico:</b> elegir dos ceros en la misma fila o columna. Eso no es asignación válida.</div>\n", "examples": [{"title": "Reducción por filas", "body": "Fila [9,2,7]. El menor es 2. Nueva fila: [7,0,5]."}, {"title": "Reducción por columnas", "body": "Si una columna queda [4,0,3], el menor es 0, por lo tanto no cambia."}, {"title": "Matriz no cuadrada", "body": "3 trabajadores y 4 tareas: agregas un trabajador ficticio con costos 0 para cuadrar 4x4, salvo que el enunciado indique penalización."}, {"title": "Maximización", "body": "Beneficios [10,6,8]. Mayor=10. Transformada: [0,4,2]."}, {"title": "Asignación final", "body": "Si eliges A→2, B→3, C→1, el costo total se calcula en la matriz original sumando esos tres valores."}], "guided": [{"title": "Guía 1: minimización", "steps": [{"q": "Fila [9,2,7]. Después de restar el menor, escribe la fila como 7,0,5.", "answers": ["7,0,5"], "mode": "expr", "hint": "Menor=2.", "explain": "[9−2,2−2,7−2]=[7,0,5]."}, {"q": "Fila [6,4,3]. Después de restar el menor, escribe la fila.", "answers": ["3,1,0"], "mode": "expr", "hint": "Menor=3.", "explain": "[3,1,0]."}, {"q": "Si una matriz es 3x4, ¿qué debes agregar para cuadrarla? Responde fila ficticia o columna ficticia.", "answers": ["fila ficticia"], "mode": "loose", "hint": "Faltan filas para llegar a 4x4.", "explain": "Se agrega una fila ficticia."}]}, {"title": "Guía 2: maximización", "steps": [{"q": "Matriz de beneficios con mayor valor 12. Si un beneficio es 5, ¿cuál es el costo transformado?", "answers": ["7"], "mode": "exact", "hint": "12−5.", "explain": "Costo transformado=7."}, {"q": "Beneficios [10,6,8]. Transformada usando mayor 10. Escribe 0,4,2.", "answers": ["0,4,2"], "mode": "expr", "hint": "10−cada valor.", "explain": "[0,4,2]."}, {"q": "Al final, ¿calculas el beneficio total con matriz original o transformada?", "answers": ["original", "matriz original"], "mode": "loose", "hint": "La transformada solo ayuda a resolver.", "explain": "Se evalúa con la matriz original."}]}], "solo": [{"q": "Reduzca por filas: A [8,6,7], B [5,9,6], C [7,8,5].", "solution": "A [2,0,1]; B [0,4,1]; C [2,3,0]."}, {"q": "Transforme beneficios [15,12,9; 10,14,8] usando el mayor beneficio.", "solution": "Mayor=15. Transformada: [0,3,6;5,1,7]."}, {"q": "Explique qué es un cero independiente.", "solution": "Un cero seleccionado que no comparte fila ni columna con otro cero seleccionado."}, {"q": "Si líneas mínimas para cubrir ceros son menos que n, ¿qué se hace?", "solution": "Se toma el menor no cubierto, se resta a elementos no cubiertos y se suma a intersecciones de líneas."}, {"q": "Matriz 4 trabajadores y 3 tareas. ¿Qué agregas?", "solution": "Una columna ficticia para cuadrar 4x4."}]}];

 document.getElementById('curso').innerHTML = `<div class="tabs">${MODULES.map(x=>`<button class="tab ${x.id===m.id?'active':''}" onclick="currentModule='${x.id}'; state.currentModule=currentModule; save(); renderCurso()">${x.icon} ${x.title.replace(/^\d+\. /,'')}</button>`).join('')}</div>
 <div class="card"><div class="row between"><div><h2>${m.icon} ${m.title}</h2><p class="muted">${m.subtitle}</p></div><button class="${state.done[m.id]?'good':'secondary'}" onclick="markModule('${m.id}')">${state.done[m.id]?'✓ Estudiado':'Marcar estudiado'}</button></div><div class="note"><b>Meta:</b> ${m.goal}</div>${m.theory}</div>
 <div class="card"><h2>5 ejercicios explicados</h2>${m.examples.map((ex,i)=>`<details ${i===0?'open':''}><summary>Ejercicio explicado ${i+1}: ${ex.title}</summary><div class="example">${ex.body}</div></details>`).join('')}</div>
 <div class="card"><h2>Práctica guiada de este tema</h2><p class="muted small">Aquí la app te va diciendo si está bien o mal. Puedes pedir pista.</p>${m.guided.map((g,i)=>`<div class="mini"><h3>${g.title}</h3><p class="small muted">${g.steps.length} pasos.</p><button onclick="startGuided('${m.id}',${i})">Resolver guiado</button> ${state.guided[m.id+'_'+i]?'<span class="tag doneTag">completado</span>':''}</div>`).join('')}</div>
 <div class="card"><h2>Ejercicios sin ayuda</h2><p class="muted small">Resuélvelos en tu cuaderno. La app no te guía hasta que abras la solución.</p>${m.solo.map((ex,i)=>`<details><summary>${i+1}. ${ex.q}</summary><textarea id="solo_${m.id}_${i}" placeholder="Escribe tu desarrollo aquí..."></textarea><div class="row" style="margin-top:8px"><button class="secondary" onclick="markSolo('${m.id}',${i})">Marcar como resuelto</button><button class="ghost" onclick="toggleSolution('${m.id}_${i}')">Ver solución</button>${state.solo[m.id+'_'+i]?'<span class="tag doneTag">resuelto</span>':''}</div><div id="sol_${m.id}_${i}" class="note ok" style="display:none;margin-top:10px"><b>Solución:</b> ${ex.solution}</div></details>`).join('')}</div>`;
}
function markSolo(mid,i){state.solo[mid+'_'+i]=true; save(); renderCurso();}
function toggleSolution(key){const el=document.getElementById('sol_'+key); if(el) el.style.display = el.style.display==='none'?'block':'none';}
function startGuided(mid, gi){const m=moduleById(mid), g=m.guided[gi]; state.activeGuided={mid,gi,step:0,correct:0}; save(); renderPractica(); show('practica');}
function renderPractica(){
 const ag=state.activeGuided;
 let guidedHtml='';
 if(ag){const m=moduleById(ag.mid); const g=m.guided[ag.gi]; const step=g.steps[ag.step] || null; if(step){guidedHtml = `<div class="card"><div class="row between"><div><h2>${m.icon} ${g.title}</h2><p class="muted">Paso ${ag.step+1} de ${g.steps.length}</p></div><span class="pill">${ag.correct||0} correctas</span></div><div class="guideBox"><h3>${step.q}</h3><input id="guidedAnswer" placeholder="Escribe tu respuesta" onkeydown="if(event.key==='Enter') checkGuided()"><div class="row" style="margin-top:10px"><button onclick="checkGuided()">Revisar</button><button class="secondary" onclick="showHint()">Pista</button><button class="ghost" onclick="skipGuided()">Saltar</button></div><div id="guidedFeedback" class="feedback"></div></div></div>`;} else {guidedHtml = `<div class="card"><h2>Práctica completada</h2><p>Terminaste ${g.title}.</p><div class="note ok">Buen avance. Ahora intenta los ejercicios sin ayuda del módulo.</div><button onclick="currentModule='${m.id}'; renderCurso(); show('curso')">Volver al módulo</button></div>`;}}
 else {guidedHtml = `<div class="card"><h2>Elige una práctica guiada</h2><p>Selecciona un tema. Cada práctica te corrige paso a paso.</p><div class="moduleGrid">${MODULES.map(m=>`<button class="moduleBtn" onclick="currentModule='${m.id}'; renderCurso(); show('curso')"><div class="emoji">${m.icon}</div><b>${m.title}</b><p class="small muted">${m.guided.length} prácticas guiadas</p></button>`).join('')}</div></div>`;}
 document.getElementById('practica').innerHTML = guidedHtml + `<div class="card"><h2>Selector de método</h2><p>Escribe una frase del problema y te digo qué método probablemente corresponde.</p><input id="methodText" placeholder="Ej: asignar trabajadores a tareas / oferta demanda / variables enteras"><button style="margin-top:10px" onclick="suggestMethod()">Detectar método</button><div id="methodResult" class="feedback"></div></div>`;
 setTimeout(()=>{const inp=document.getElementById('guidedAnswer'); if(inp) inp.focus();},100);
}
function showHint(){const ag=state.activeGuided; const s=moduleById(ag.mid).guided[ag.gi].steps[ag.step]; document.getElementById('guidedFeedback').innerHTML='<span class="warnText">Pista:</span> '+s.hint;}
function skipGuided(){const ag=state.activeGuided; const s=moduleById(ag.mid).guided[ag.gi].steps[ag.step]; document.getElementById('guidedFeedback').innerHTML='<span class="warnText">Respuesta:</span> '+s.explain+'<br><button style="margin-top:8px" onclick="nextGuided(false)">Continuar</button>';}
function checkStep(ans, step){const a=norm(ans); const opts=(step.answers||[]).map(norm); if(step.mode==='exact') return opts.includes(a); if(step.mode==='expr') return opts.includes(a.replace(/z=/,'')) || opts.includes(a); return opts.some(o=>a.includes(o)||o.includes(a));}
function checkGuided(){const ag=state.activeGuided; const m=moduleById(ag.mid); const g=m.guided[ag.gi]; const step=g.steps[ag.step]; const ans=document.getElementById('guidedAnswer').value; const ok=checkStep(ans,step); const fb=document.getElementById('guidedFeedback'); if(ok){fb.innerHTML='<span class="okText">Correcto.</span> '+step.explain+'<br><button style="margin-top:8px" onclick="nextGuided(true)">Siguiente</button>';} else {fb.innerHTML='<span class="badText">Revisa.</span> '+step.hint+'<br><button class="secondary" style="margin-top:8px" onclick="skipGuided()">Ver explicación</button>';}}
function nextGuided(ok){const ag=state.activeGuided; if(ok) ag.correct=(ag.correct||0)+1; const m=moduleById(ag.mid); const g=m.guided[ag.gi]; ag.step++; if(ag.step>=g.steps.length){state.guided[ag.mid+'_'+ag.gi]=true; state.activeGuided=null;} save(); renderPractica();}
function suggestMethod(){const t=norm(document.getElementById('methodText').value); let msg=''; if(/asign|trabajador|tarea|maquina|puesto/.test(t)) msg='🎯 Método Húngaro: asignación uno a uno.'; else if(/oferta|demanda|origen|destino|enviar|transporte/.test(t)) msg='🚚 Transporte: revisa balance, Vogel y MODI.'; else if(/bodega|intermedio|recibe|envia|transbordo|nodo/.test(t)) msg='🔁 Transbordo: balance entrada + oferta = salida + demanda.'; else if(/entero|decimal|binari|0o1|0\/1|branch/.test(t)) msg='🌳 Optimización entera / Branch and Bound.'; else if(/precio|sombra|rango|sensibilidad|holgura|costo reducido/.test(t)) msg='🔎 Análisis de sensibilidad.'; else if(/dosvariables|grafico|region|vertices/.test(t)) msg='📈 Método gráfico.'; else if(/forma|estandar|holgura|exceso|artificial/.test(t)) msg='🧱 Forma estándar / Big M.'; else msg='🧩 Parece formulación general. Define variables, objetivo y restricciones primero.'; document.getElementById('methodResult').innerHTML='<div class="note ok">'+msg+'</div>';}
function renderQuiz(){let html=`<div class="card"><h2>Quiz tipo certamen</h2><p>Responde y revisa la explicación. Sirve para reconocer métodos y reglas.</p></div>`; QUIZ.forEach((q,i)=>{html+=`<div class="card" id="qcard${i}"><h3>${i+1}. ${q.q}</h3>${q.a.map((x,j)=>`<button class="choice" onclick="answerQuiz(${i},${j})">${x}</button>`).join('')}<div class="feedback" id="qfb${i}"></div></div>`}); html+=`<div class="card"><h2>Flashcards</h2><div class="flash" id="flash">${FLASHCARDS[flashIndex][0]}</div><div class="row" style="margin-top:10px"><button onclick="flipFlash()">Girar</button><button class="secondary" onclick="nextFlash()">Siguiente</button></div></div>`; document.getElementById('quiz').innerHTML=html;}
function answerQuiz(i,j){const q=QUIZ[i]; const card=document.getElementById('qcard'+i); card.querySelectorAll('.choice').forEach((b,k)=>{b.classList.remove('correct','wrong'); if(k===q.ok)b.classList.add('correct'); if(k===j&&j!==q.ok)b.classList.add('wrong');}); document.getElementById('qfb'+i).innerHTML=(j===q.ok?'<span class="okText">Correcto.</span> ':'<span class="badText">Incorrecto.</span> ')+q.e;}
let flipped=false; function flipFlash(){flipped=!flipped; document.getElementById('flash').textContent=FLASHCARDS[flashIndex][flipped?1:0];} function nextFlash(){flipped=false; flashIndex=(flashIndex+1)%FLASHCARDS.length; state.flashIndex=flashIndex; save(); renderQuiz();}
function renderFormulario(){document.getElementById('formulario').innerHTML=`<div class="card"><h2>Formulario compacto</h2><p>Resumen para repasar antes de prueba.</p><div class="row"><button class="ghost" onclick="window.print()">Imprimir</button><button class="secondary" onclick="resetProgress()">Reiniciar avance</button></div></div>
<div class="card"><h2>1. Formulación</h2><div class="formula">Max/Min Z = Σ cᵢxᵢ<br>Restricciones: Σ aᵢⱼxⱼ ≤, ≥ o = bᵢ<br>xᵢ ≥ 0</div><p>Inventario: I<sub>t-1</sub> + producción + compras = demanda + I<sub>t</sub>.</p></div>
<div class="card"><h2>2. Método gráfico</h2><ol><li>Convertir restricciones en rectas.</li><li>Calcular interceptos.</li><li>Sombrear lado factible.</li><li>Encontrar vértices.</li><li>Evaluar Z.</li></ol></div>
<div class="card"><h2>3. Forma estándar</h2><div class="formula">Min Z=cᵀx; Ax=b; x≥0<br>≤: + holgura<br>≥: − exceso + artificial si aplica<br>x s.r.s.: x=x⁺−x⁻</div></div>
<div class="card"><h2>4. Simplex / Big M</h2><p>Base, variable entrante, variable saliente, pivote. Artificial positiva al final = problema infactible. No básica con costo reducido 0 en óptimo = posible solución múltiple.</p></div>
<div class="card"><h2>5. Sensibilidad</h2><div class="formula">Nuevo Z = Z* + precio sombra × cambio en b<br>Válido solo dentro del rango</div><p>Rango de optimalidad: coeficientes de Z. Rango de factibilidad: lados derechos.</p></div>
<div class="card"><h2>6. Branch and Bound</h2><div class="formula">x=4,6 → x≤4 y x≥5</div><p>Podas: infactible, peor que incumbente, o solución entera.</p></div>
<div class="card"><h2>7. Transporte</h2><div class="formula">Min Z=Σcᵢⱼxᵢⱼ<br>Oferta total = demanda total<br>Vogel: penalidad = diferencia dos costos menores<br>MODI: Δᵢⱼ=cᵢⱼ−uᵢ−vⱼ</div><p>Minimización óptima si todos Δ≥0.</p></div>
<div class="card"><h2>8. Transbordo</h2><div class="formula">Entrada + oferta = salida + demanda</div></div>
<div class="card"><h2>9. Húngaro</h2><div class="formula">Min: reducir filas, reducir columnas, cubrir ceros, asignar<br>Max: costo = mayor beneficio − beneficio</div><p>Evaluar respuesta final con la matriz original.</p></div>`;}
function resetProgress(){if(confirm('¿Reiniciar avance guardado?')){state={done:{},solo:{},guided:{}}; save(); renderAll();}}
function renderAll(){renderInicio(); renderCurso(); renderPractica(); renderQuiz(); renderFormulario(); updateProgress();}
renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
