<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprendiendo Optimización Lineal</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--purple:#7c3aed;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#172554,#5b21b6);color:white;padding:14px 18px;box-shadow:0 10px 30px #0002}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:auto}h1{margin:0;font-size:24px}.small{font-size:13px;color:#dbeafe}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:14px;background:#eaf1ff;color:#0f2b66;padding:10px 14px;font-weight:800;cursor:pointer}.nav button.active,.btn.primary{background:var(--blue);color:white}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 25px #1e293b0c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.module{cursor:pointer;transition:.2s}.module:hover{transform:translateY(-2px);box-shadow:0 14px 30px #1e293b18}.icon{font-size:28px}.badge{display:inline-block;background:#e0edff;color:#1d4ed8;border-radius:999px;padding:4px 10px;font-weight:900;font-size:12px}.muted{color:var(--muted)}.courseLayout{display:grid;grid-template-columns:280px 1fr;gap:16px}.side{position:sticky;top:98px;align-self:start}.side button{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;font-weight:800;cursor:pointer}.side button.active{border-color:#2563eb;background:#eff6ff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tabs button.active{background:#111827;color:white}.teacher h2,.teacher h3{margin-top:0}.box,.note,.answer,.math{border-radius:16px;padding:14px;margin:12px 0}.box{background:#f8fafc;border:1px solid var(--line)}.note{border-left:5px solid var(--blue);background:#eff6ff}.note.ok{border-color:var(--green);background:#ecfdf5}.note.warn{border-color:var(--yellow);background:#fffbeb}.answer{border:2px solid #bfdbfe;background:#eff6ff;font-weight:800}.math{font-family:Cambria Math,Times New Roman,serif;text-align:center;background:#f8fafc;border:1px solid var(--line);font-size:18px}table{border-collapse:collapse;width:100%;margin:14px 0;background:#fff;overflow:hidden;border-radius:14px}th,td{border:1px solid var(--line);padding:10px;text-align:center}th{background:#f1f5f9}h2,h3,h4{line-height:1.2}.stepcard{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fff}.tree{background:#050505;color:white;border-radius:18px;padding:18px;overflow:auto;font-family:Consolas,monospace;line-height:1.45}.svgwrap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;overflow:auto}.plot{width:100%;max-width:650px;display:block;margin:auto}.plot line{stroke:#334155;stroke-width:2}.practiceBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px}textarea.input{min-height:170px;font-family:inherit}.feedback{padding:10px;border-radius:12px;margin-top:10px;font-weight:800}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.hidden{display:none}.progress{height:12px;background:#dbeafe;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#22c55e,#2563eb);width:0}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.footerSpace{height:40px}@media(max-width:850px){.courseLayout{grid-template-columns:1fr}.side{position:static}.head{display:block}.nav{margin-top:12px}h1{font-size:21px}}
</style></head><body><header><div class="head"><div><h1>Aprendiendo Optimización Lineal</h1><div class="small">Curso interactivo paso a paso: teoría, tablas, gráficos, árboles, práctica guiada y ejercicios sin ayuda.</div></div><div class="nav"><button onclick="show('inicio')" id="nav-inicio">Inicio</button><button onclick="show('curso')" id="nav-curso">Curso</button><button onclick="show('practica')" id="nav-practica">Práctica</button><button onclick="show('quiz')" id="nav-quiz">Quiz</button><button onclick="show('formulario')" id="nav-formulario">Formulario</button></div></div></header><main class="wrap"><section id="inicio"></section><section id="curso" class="hidden"></section><section id="practica" class="hidden"></section><section id="quiz" class="hidden"></section><section id="formulario" class="hidden"></section><div class="footerSpace"></div></main><script>
const modules = [{"id": "formulacion", "icon": "🧩", "title": "Formulación de modelos", "subtitle": "Desde un enunciado hasta variables, objetivo, restricciones y signo.", "lecture": "\n<section class=\"teacher\"><h2>¿Qué es formular un modelo?</h2>\n<p>Formular es convertir una situación escrita en matemáticas. Antes de resolver cualquier ejercicio de optimización lineal, debes dejar claro <b>qué se decide</b>, <b>qué se quiere optimizar</b> y <b>qué condiciones limitan la decisión</b>.</p>\n<p>Un modelo lineal tiene siempre estas partes:</p>\n<div class=\"grid2\"><div class=\"box\"><b>1. Variables de decisión</b><br>Son las cantidades que no conoces y debes decidir.</div><div class=\"box\"><b>2. Función objetivo</b><br>Es lo que quieres maximizar o minimizar.</div><div class=\"box\"><b>3. Restricciones</b><br>Son las reglas, capacidades, demandas o balances.</div><div class=\"box\"><b>4. Condición de signo</b><br>Normalmente las cantidades no pueden ser negativas.</div></div>\n<h3>Cómo reconocer variables</h3><p>Busca verbos como <b>fabricar, comprar, transportar, asignar, producir, almacenar, contratar</b>. Lo que se decide después de esos verbos suele ser la variable.</p>\n<table><tr><th>Enunciado dice...</th><th>Variable correcta</th><th>Variable mala</th></tr><tr><td>Fabricar mesas y sillas</td><td>x₁ = mesas, x₂ = sillas</td><td>x = utilidad</td></tr><tr><td>Enviar desde planta a cliente</td><td>xᵢⱼ = unidades enviadas de i a j</td><td>x = costo total</td></tr><tr><td>Asignar trabajadores a tareas</td><td>xᵢⱼ = 1 si i hace j</td><td>x = número de trabajadores</td></tr></table>\n<h3>Signos que aparecen en restricciones</h3><table><tr><th>Frase</th><th>Signo</th><th>Idea</th></tr><tr><td>como máximo, no más de, capacidad</td><td>≤</td><td>no superar un recurso</td></tr><tr><td>al menos, mínimo, demanda requerida</td><td>≥</td><td>cumplir una exigencia mínima</td></tr><tr><td>exactamente, balance, satisfacer toda la demanda</td><td>=</td><td>lo que entra debe igualar lo que sale</td></tr></table>\n<div class=\"note ok\"><b>Regla de oro:</b> si no defines bien las variables, todo el ejercicio queda mal aunque sepas simplex, gráfico o transporte.</div></section>", "explained": [{"title": "Ejercicio 1: producción básica", "html": "<p><b>Enunciado:</b> Una empresa produce mesas y sillas. Cada mesa deja 40 de utilidad y cada silla 25. Una mesa usa 3 horas de madera y 2 de armado. Una silla usa 1 hora de madera y 2 de armado. Hay 90 horas de madera y 80 de armado. Formule para maximizar utilidad.</p><h4>Paso 1: variables</h4><div class=\"math\">x₁ = cantidad de mesas a fabricar<br>x₂ = cantidad de sillas a fabricar</div><h4>Paso 2: objetivo</h4><p>Como se quiere utilidad, se maximiza:</p><div class=\"math\">Max Z = 40x₁ + 25x₂</div><h4>Paso 3: restricciones</h4><table><tr><th>Recurso</th><th>Mesa</th><th>Silla</th><th>Disponible</th><th>Restricción</th></tr><tr><td>Madera</td><td>3</td><td>1</td><td>90</td><td>3x₁ + x₂ ≤ 90</td></tr><tr><td>Armado</td><td>2</td><td>2</td><td>80</td><td>2x₁ + 2x₂ ≤ 80</td></tr></table><h4>Respuesta</h4><div class=\"answer\">Max Z = 40x₁ + 25x₂<br>s.a. 3x₁+x₂≤90; 2x₁+2x₂≤80; x₁,x₂≥0</div>"}, {"title": "Ejercicio 2: inventario multiperíodo", "html": "<p><b>Enunciado:</b> Hay inventario inicial 15, producción x₁ en verano, demanda 35 e inventario final I₁. Formule el balance del período.</p><h4>Paso 1: qué entra al período</h4><div class=\"math\">Inventario inicial + producción = 15 + x₁</div><h4>Paso 2: qué sale del período</h4><div class=\"math\">Demanda + inventario final = 35 + I₁</div><h4>Paso 3: balance</h4><div class=\"math\">15 + x₁ = 35 + I₁</div><p>Este mismo patrón se repite en cada período:</p><div class=\"math\">Iᵢ₋₁ + producciónᵢ + comprasᵢ = demandaᵢ + Iᵢ</div><div class=\"answer\">Balance: 15+x₁=35+I₁, con x₁,I₁≥0</div>"}, {"title": "Ejercicio 3: comprar o producir", "html": "<p><b>Enunciado:</b> Se pueden producir x unidades a costo 50 o comprar y unidades a costo 70. Se necesitan 100 unidades. Producción máxima 60.</p><h4>Paso 1: variables</h4><div class=\"math\">x = unidades producidas<br>y = unidades compradas</div><h4>Paso 2: objetivo</h4><div class=\"math\">Min Z = 50x + 70y</div><h4>Paso 3: demanda</h4><div class=\"math\">x + y = 100</div><h4>Paso 4: capacidad</h4><div class=\"math\">x ≤ 60</div><div class=\"answer\">Min Z=50x+70y; s.a. x+y=100; x≤60; x,y≥0</div>"}, {"title": "Ejercicio 4: demanda mínima", "html": "<p><b>Enunciado:</b> Dos alimentos A y B aportan 4 y 2 unidades de proteína. Se requieren al menos 40 unidades. Costos 3 y 1.</p><h4>Paso 1: variables</h4><div class=\"math\">x₁ = unidades de A<br>x₂ = unidades de B</div><h4>Paso 2: objetivo</h4><div class=\"math\">Min Z = 3x₁ + x₂</div><h4>Paso 3: restricción de proteína</h4><p>La frase <b>al menos</b> significa ≥:</p><div class=\"math\">4x₁ + 2x₂ ≥ 40</div><div class=\"answer\">Min Z=3x₁+x₂; s.a. 4x₁+2x₂≥40; x₁,x₂≥0</div>"}, {"title": "Ejercicio 5: formulación de asignación", "html": "<p><b>Enunciado:</b> 3 trabajadores deben asignarse a 3 tareas. Cada trabajador hace exactamente una tarea y cada tarea recibe exactamente un trabajador.</p><h4>Paso 1: variable binaria</h4><div class=\"math\">xᵢⱼ = 1 si trabajador i hace tarea j; 0 si no</div><h4>Paso 2: cada trabajador una tarea</h4><div class=\"math\">Σⱼ xᵢⱼ = 1 &nbsp; para cada trabajador i</div><h4>Paso 3: cada tarea un trabajador</h4><div class=\"math\">Σᵢ xᵢⱼ = 1 &nbsp; para cada tarea j</div><h4>Paso 4: objetivo</h4><div class=\"math\">Min/Max Z = ΣᵢΣⱼ cᵢⱼxᵢⱼ</div><div class=\"answer\">Este es el modelo base del método húngaro.</div>"}], "guided": [{"title": "Variables y objetivo", "q": "A deja utilidad 30 y B utilidad 45. Define la función objetivo.", "answers": ["max z=30x1+45x2", "maxz=30x1+45x2", "z=30x1+45x2"], "explain": "Utilidad por cantidad. Respuesta: Max Z=30x₁+45x₂."}, {"title": "Restricción de recurso", "q": "A usa 2 horas y B 3 horas. Hay máximo 120 horas. Escribe la restricción.", "answers": ["2x1+3x2<=120", "2x1+3x2≤120"], "explain": "Recurso usado ≤ recurso disponible."}, {"title": "No negatividad", "q": "Escribe la condición de signo para x₁ y x₂.", "answers": ["x1,x2>=0", "x1>=0,x2>=0", "x1≥0,x2≥0"], "explain": "Las cantidades no pueden ser negativas."}], "solo": [{"title": "Formule completo", "q": "Una panadería produce pan A y B. Ganancias 20 y 15. A usa 2 kg de harina y B 1 kg. Hay 100 kg. A usa 1 hora y B 2 horas. Hay 80 horas.", "solution": "x₁=pan A, x₂=pan B. Max Z=20x₁+15x₂; 2x₁+x₂≤100; x₁+2x₂≤80; x₁,x₂≥0."}, {"title": "Balance", "q": "Inventario inicial 12, producción x, demanda 50, inventario final I.", "solution": "12+x=50+I; x,I≥0."}]}, {"id": "grafico", "icon": "📈", "title": "Método gráfico", "subtitle": "Resolver problemas de dos variables con región factible, vértices y evaluación de Z.", "lecture": "<section class=\"teacher\"><h2>Idea principal</h2><p>El método gráfico sirve cuando hay <b>dos variables</b>. Cada restricción se dibuja como una recta. La parte del plano que cumple todas las restricciones es la <b>región factible</b>. El óptimo se encuentra en un vértice de esa región.</p><ol><li>Pasar cada desigualdad a igualdad para dibujar la recta.</li><li>Calcular interceptos.</li><li>Dibujar la recta.</li><li>Decidir el lado factible usando un punto de prueba.</li><li>Encontrar los vértices.</li><li>Evaluar la función objetivo en cada vértice.</li></ol><div class=\"note ok\"><b>Clave:</b> en programación lineal el óptimo está en un vértice, salvo casos especiales de múltiples óptimos.</div></section>", "explained": [{"title": "Ejercicio 1: desarrollo gráfico completo", "html": "<p><b>Modelo:</b></p><div class=\"math\">Max Z = 3x₁ + 2x₂<br>2x₁+x₂≤8<br>x₁+2x₂≤8<br>x₁,x₂≥0</div><h4>Paso 1: rectas a graficar</h4><div class=\"math\">2x₁+x₂=8<br>x₁+2x₂=8</div><h4>Paso 2: interceptos</h4><table><tr><th>Recta</th><th>Si x₂=0</th><th>Si x₁=0</th></tr><tr><td>2x₁+x₂=8</td><td>x₁=4 → (4,0)</td><td>x₂=8 → (0,8)</td></tr><tr><td>x₁+2x₂=8</td><td>x₁=8 → (8,0)</td><td>x₂=4 → (0,4)</td></tr></table><h4>Paso 3: gráfico</h4><div class=\"svgwrap\"><svg viewBox=\"0 0 420 300\" class=\"plot\"><line x1=\"40\" y1=\"260\" x2=\"390\" y2=\"260\"/><line x1=\"40\" y1=\"260\" x2=\"40\" y2=\"20\"/><polygon points=\"40,260 200,260 146.7,153.3 40,100\" fill=\"#fde68a\" stroke=\"#f59e0b\"/><line x1=\"40\" y1=\"100\" x2=\"200\" y2=\"260\" stroke=\"#2563eb\" stroke-width=\"3\"/><line x1=\"40\" y1=\"180\" x2=\"360\" y2=\"260\" stroke=\"#7c3aed\" stroke-width=\"3\"/><circle cx=\"40\" cy=\"260\" r=\"4\"/><circle cx=\"200\" cy=\"260\" r=\"4\"/><circle cx=\"146.7\" cy=\"153.3\" r=\"4\"/><circle cx=\"40\" cy=\"100\" r=\"4\"/><text x=\"205\" y=\"275\">(4,0)</text><text x=\"150\" y=\"148\">(8/3,8/3)</text><text x=\"45\" y=\"96\">(0,4)</text><text x=\"8\" y=\"260\">0</text></svg></div><h4>Paso 4: puntos importantes</h4><table><tr><th>Vértice</th><th>Z=3x₁+2x₂</th></tr><tr><td>(0,0)</td><td>0</td></tr><tr><td>(4,0)</td><td>12</td></tr><tr><td>(8/3,8/3)</td><td>3(8/3)+2(8/3)=40/3</td></tr><tr><td>(0,4)</td><td>8</td></tr></table><h4>Respuesta</h4><div class=\"answer\">x₁*=8/3, x₂*=8/3, Z*=40/3</div>"}, {"title": "Ejercicio 2: restricción transformada", "html": "<p><b>Restricción:</b> -x₂≤-1</p><p>Multiplicamos por -1 y cambia el signo:</p><div class=\"math\">-x₂≤-1 ⇒ x₂≥1</div><p>La recta que se grafica es:</p><div class=\"math\">x₂=1</div><p>La zona válida queda sobre la recta.</p>"}, {"title": "Ejercicio 3: intersección", "html": "<p>Encontrar cruce entre:</p><div class=\"math\">x₂ = (2/3)x₁<br>2x₁+3x₂=15</div><p>Reemplazamos:</p><div class=\"math\">2x₁+3(2/3 x₁)=15<br>2x₁+2x₁=15<br>4x₁=15<br>x₁=3.75</div><p>Luego:</p><div class=\"math\">x₂=(2/3)(3.75)=2.5</div><div class=\"answer\">Punto: (3.75, 2.5)</div>"}, {"title": "Ejercicio 4: múltiples óptimos", "html": "<p>Hay múltiples óptimos cuando la recta de Z queda paralela a un lado de la región factible y el mismo valor se obtiene en dos vértices vecinos.</p><table><tr><th>Punto</th><th>Z</th></tr><tr><td>A</td><td>60</td></tr><tr><td>B</td><td>60</td></tr></table><p>Si A y B están unidos por un lado factible, entonces todos los puntos del segmento AB también son óptimos.</p>"}, {"title": "Ejercicio 5: mínimo gráfico", "html": "<p>En minimización también evalúas vértices, pero eliges el menor valor. Si la región es abierta, debes revisar si existe solución no acotada.</p><div class=\"note warn\">Si una restricción es ≥, la región queda hacia arriba o hacia afuera, no necesariamente bajo la recta.</div>"}], "guided": [{"title": "Recta 1", "q": "Para 2x₁+x₂≤8, ¿qué recta se grafica?", "answers": ["2x1+x2=8"], "explain": "Se cambia ≤ por =."}, {"title": "Intercepto eje x", "q": "En 2x₁+x₂=8, si x₂=0, ¿cuánto vale x₁?", "answers": ["4"], "explain": "2x₁=8 ⇒ x₁=4."}, {"title": "Intersección", "q": "El cruce de 2x₁+x₂=8 y x₁+2x₂=8 es (a,a). ¿Cuánto vale a?", "answers": ["8/3", "2.666", "2.67"], "explain": "Sumando/sustituyendo se obtiene x₁=x₂=8/3."}, {"title": "Evaluación", "q": "Evalúa Z=3x₁+2x₂ en (4,0).", "answers": ["12"], "explain": "Z=3(4)+2(0)=12."}], "solo": [{"title": "Resolver gráfico", "q": "Max Z=5x₁+4x₂; x₁+x₂≤6; x₁≤4; x₂≤5; x₁,x₂≥0. Desarrolla rectas, vértices y Z.", "solution": "Vértices: (0,0),(4,0),(4,2),(1,5),(0,5). Z:0,20,28,25,20. Óptimo (4,2), Z=28."}, {"title": "Transformar", "q": "Transforma -x₂≤-3 y di qué recta se grafica.", "solution": "x₂≥3; recta x₂=3."}]}, {"id": "estandar-simplex", "icon": "📊", "title": "Forma estándar y Simplex", "subtitle": "Preparar modelos para tabla simplex, Big M y simplex dual.", "lecture": "<section class=\"teacher\"><h2>Forma estándar</h2><p>La forma estándar busca dejar las variables no negativas y las restricciones listas para trabajar con tabla. Dependiendo del signo, se agregan holguras, excesos o artificiales.</p><table><tr><th>Restricción</th><th>Qué se agrega</th><th>Ejemplo</th></tr><tr><td>≤</td><td>Holgura +h</td><td>2x₁+x₂≤10 ⇒ 2x₁+x₂+h=10</td></tr><tr><td>≥</td><td>Exceso -e y artificial +a</td><td>2x₁+x₂≥10 ⇒ 2x₁+x₂-e+a=10</td></tr><tr><td>=</td><td>Artificial +a</td><td>2x₁+x₂+a=10</td></tr></table><h3>Simplex Dual</h3><p>Conviene cuando la fila de costos está en forma aceptable, pero hay RHS negativos. El método primero recupera factibilidad y luego llega al óptimo.</p><div class=\"note ok\"><b>Criterio dual básico:</b> sale la fila con RHS más negativo. En esa fila se busca una columna válida para entrar, se pivotea y se crea una nueva tabla.</div></section>", "explained": [{"title": "Ejercicio 1: Simplex Dual desarrollado paso a paso", "html": "<p><b>Problema:</b></p><div class=\"math\">Min z = 3x₁ − 2x₂ − x₃<br>5x₁ + 9x₂ − 3x₃ ≤ −12<br>3x₁ − 2x₂ − x₃ ≥ −15<br>x₁,x₂,x₃≥0</div><h4>Paso 1: pasar a forma estándar</h4><p>Primera restricción:</p><div class=\"math\">5x₁+9x₂−3x₃+h₁=-12</div><p>Segunda restricción: como es ≥, multiplicamos por −1:</p><div class=\"math\">3x₁−2x₂−x₃≥−15<br>−3x₁+2x₂+x₃≤15<br>−3x₁+2x₂+x₃+h₂=15</div><h4>Paso 2: tabla inicial</h4><table><tr><th>Base</th><th>x₁</th><th>x₂</th><th>x₃</th><th>h₁</th><th>h₂</th><th>RHS</th></tr><tr><td>z</td><td>3</td><td>-2</td><td>-1</td><td>0</td><td>0</td><td>0</td></tr><tr><td>h₁</td><td>5</td><td>9</td><td>-3</td><td>1</td><td>0</td><td>-12</td></tr><tr><td>h₂</td><td>-3</td><td>2</td><td>1</td><td>0</td><td>1</td><td>15</td></tr></table><p>Como hay un RHS negativo, se aplica simplex dual. Sale la fila con RHS más negativo:</p><div class=\"math\">Sale h₁, porque RHS=-12</div><p>En la fila de h₁, buscamos coeficientes negativos. Aparece:</p><div class=\"math\">x₃ = -3</div><p>Entonces entra x₃. El pivote es -3.</p><h4>Paso 3: primer pivote</h4><p>Dividimos la fila h₁ por -3 y hacemos ceros en la columna x₃.</p><div class=\"math\">Fₚ = Fh₁ / (-3)<br>Fz ← Fz + Fₚ<br>Fh₂ ← Fh₂ − Fₚ</div><table><tr><th>Base</th><th>x₁</th><th>x₂</th><th>x₃</th><th>h₁</th><th>h₂</th><th>RHS</th></tr><tr><td>z</td><td>4/3</td><td>-5</td><td>0</td><td>-1/3</td><td>0</td><td>4</td></tr><tr><td>x₃</td><td>-5/3</td><td>-3</td><td>1</td><td>-1/3</td><td>0</td><td>4</td></tr><tr><td>h₂</td><td>-4/3</td><td>5</td><td>0</td><td>1/3</td><td>1</td><td>11</td></tr></table><p>Ahora todos los RHS son positivos, pero en la fila z queda un negativo:</p><div class=\"math\">x₂=-5</div><p>Entonces entra x₂. Para ver quién sale miramos la columna x₂:</p><table><tr><th>Base</th><th>coeficiente x₂</th><th>RHS</th><th>sirve?</th></tr><tr><td>x₃</td><td>-3</td><td>4</td><td>No</td></tr><tr><td>h₂</td><td>5</td><td>11</td><td>Sí</td></tr></table><p>Sale h₂ y el pivote es 5.</p><h4>Paso 4: segundo pivote</h4><div class=\"math\">Fₚ = Fh₂/5<br>Fz ← Fz + 5Fₚ<br>Fx₃ ← Fx₃ + 3Fₚ</div><table><tr><th>Base</th><th>x₁</th><th>x₂</th><th>x₃</th><th>h₁</th><th>h₂</th><th>RHS</th></tr><tr><td>z</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>15</td></tr><tr><td>x₃</td><td>-37/15</td><td>0</td><td>1</td><td>-2/15</td><td>3/5</td><td>53/5</td></tr><tr><td>x₂</td><td>-4/15</td><td>1</td><td>0</td><td>1/15</td><td>1/5</td><td>11/5</td></tr></table><h4>Paso 5: lectura final</h4><div class=\"math\">x₁=0, x₂=11/5, x₃=53/5</div><p>Reemplazamos en la función objetivo original:</p><div class=\"math\">z = 3(0)-2(11/5)-53/5 = -75/5 = -15</div><div class=\"answer\">Respuesta: x₁*=0, x₂*=11/5, x₃*=53/5, z*=-15</div><h4>Base degenerada</h4><p>Una base degenerada aparece cuando una variable básica vale cero. Aquí las básicas son x₂=11/5 y x₃=53/5, ambas positivas. Por lo tanto:</p><div class=\"answer\">No hay base degenerada</div>"}, {"title": "Ejercicio 2: holgura en restricción ≤", "html": "<p>Restricción:</p><div class=\"math\">2x₁+3x₂≤12</div><p>Agregamos holgura:</p><div class=\"math\">2x₁+3x₂+h₁=12, h₁≥0</div>"}, {"title": "Ejercicio 3: restricción ≥ con Big M", "html": "<p>Restricción:</p><div class=\"math\">2x₁+x₂≥10</div><p>Restamos exceso y agregamos artificial:</p><div class=\"math\">2x₁+x₂-e₁+a₁=10</div><p>En minimización, la artificial se penaliza:</p><div class=\"math\">Min Z = ... + M a₁</div>"}, {"title": "Ejercicio 4: variable sin restricción de signo", "html": "<p>Si x es libre, se reemplaza por diferencia de dos variables no negativas:</p><div class=\"math\">x = x⁺ − x⁻<br>x⁺,x⁻≥0</div>"}, {"title": "Ejercicio 5: identificar óptimo en tabla", "html": "<p>En una tabla final, las variables básicas se leen en la columna Base y su valor está en RHS. Las no básicas valen cero.</p><table><tr><th>Base</th><th>RHS</th></tr><tr><td>x₂</td><td>5</td></tr><tr><td>x₄</td><td>3</td></tr></table><div class=\"answer\">x₂=5, x₄=3; las demás variables no básicas valen 0.</div>"}], "guided": [{"title": "Fila que sale", "q": "En simplex dual, si los RHS son -12 y 15, ¿qué fila sale?", "answers": ["h1", "h₁"], "explain": "Sale la fila con RHS más negativo: h₁."}, {"title": "Columna que entra", "q": "En la fila h₁ aparecen 5, 9, -3, 1, 0. ¿Qué variable entra si solo hay un coeficiente negativo?", "answers": ["x3", "x₃"], "explain": "Entra x₃ porque tiene coeficiente -3."}, {"title": "Pivote", "q": "Si sale h₁ y entra x₃, y la celda vale -3, ¿cuál es el pivote?", "answers": ["-3"], "explain": "El pivote es -3."}, {"title": "Lectura final", "q": "Si las básicas son x₃=53/5 y x₂=11/5, ¿cuánto vale x₁?", "answers": ["0"], "explain": "x₁ no está en la base, por lo tanto vale 0."}], "solo": [{"title": "Desarrollo simplex dual", "q": "Min z=4x₁+x₂; x₁≤5; x₂≤5; 8x₁+2x₂≥50; x₁,x₂≥0. Pasa a estándar y resuelve por dual.", "solution": "Una resolución esperada usa multiplicación de la tercera restricción por -1, pivotes y llega a x₁=5, x₂=5, z=25."}, {"title": "Forma estándar", "q": "Pasa a estándar: x₁+x₂≥6.", "solution": "x₁+x₂-e₁+a₁=6; e₁,a₁≥0."}]}, {"id": "sensibilidad", "icon": "📉", "title": "Análisis de sensibilidad", "subtitle": "Interpretar cambios en recursos, costos, precios sombra y rangos.", "lecture": "<section class=\"teacher\"><h2>Qué busca la sensibilidad</h2><p>Después de resolver un modelo, la sensibilidad responde preguntas del tipo: ¿qué pasa si cambia la utilidad de un producto?, ¿qué pasa si tengo más recurso?, ¿qué restricción conviene ampliar?, ¿hasta cuánto puedo cambiar sin resolver todo de nuevo?</p><div class=\"grid2\"><div class=\"box\"><b>Precio sombra</b><br>Mejora marginal de Z al aumentar en una unidad el RHS de una restricción.</div><div class=\"box\"><b>Costo reducido</b><br>Indica cuánto debe mejorar una variable no básica para entrar a la solución.</div><div class=\"box\"><b>Rango de optimalidad</b><br>Cambios del coeficiente de Z que mantienen la misma base óptima.</div><div class=\"box\"><b>Rango de factibilidad</b><br>Cambios del RHS que mantienen factible la base actual.</div></div><h3>Interpretación práctica</h3><p>Si una restricción tiene precio sombra 0, ese recurso no está limitando el óptimo. Si tiene precio sombra positivo en maximización, una unidad extra del recurso aumenta Z dentro de su rango permitido.</p></section>", "explained": [{"title": "Ejercicio 1: precio sombra", "html": "<p>Una restricción de horas tiene precio sombra 5 y su aumento permitido es 20. Si agregamos 8 horas:</p><div class=\"math\">ΔZ = precio sombra × cambio RHS = 5×8 = 40</div><p>Como 8 está dentro del rango permitido, el nuevo valor objetivo aumenta en 40.</p>"}, {"title": "Ejercicio 2: fuera del rango", "html": "<p>Precio sombra 5, aumento permitido 20. Si agregas 30 horas, no puedes usar 5×30 directamente.</p><div class=\"note warn\">El precio sombra solo es válido dentro del rango de factibilidad. Fuera del rango, debes resolver de nuevo.</div>"}, {"title": "Ejercicio 3: costo reducido", "html": "<p>Una variable no básica tiene costo reducido -4 en maximización. Eso indica que en el estado actual no conviene producirla. Para que entre, su utilidad debe mejorar al menos 4 unidades, según la convención de tabla usada.</p>"}, {"title": "Ejercicio 4: restricción activa", "html": "<p>Si una restricción se cumple con igualdad, se llama activa. Ejemplo:</p><div class=\"math\">2x₁+x₂≤100<br>en el óptimo: 2x₁+x₂=100</div><p>Una restricción activa puede tener precio sombra distinto de cero.</p>"}, {"title": "Ejercicio 5: holgura", "html": "<p>Si una restricción queda con holgura:</p><div class=\"math\">2x₁+x₂=80 &lt; 100</div><p>sobran 20 unidades del recurso. Normalmente su precio sombra es 0.</p>"}], "guided": [{"title": "Precio sombra", "q": "Precio sombra 6. Aumentas RHS en 4 dentro del rango. ¿Cuánto cambia Z?", "answers": ["24"], "explain": "ΔZ=6×4=24."}, {"title": "Rango", "q": "Si el aumento permitido es 10 y quieres aumentar 14, ¿puedes usar directamente el precio sombra?", "answers": ["no"], "explain": "No, porque sales del rango."}, {"title": "Holgura", "q": "Si una restricción no se usa completamente, ¿normalmente su precio sombra es 0?", "answers": ["si", "sí"], "explain": "Sí, un recurso sobrante no mejora Z al aumentar."}], "solo": [{"title": "Interpretar", "q": "Precio sombra de materia prima = 12, aumento permitido = 30. Z actual 500. Si agregas 10 unidades, calcula nuevo Z.", "solution": "Nuevo Z=500+12×10=620."}, {"title": "Decidir", "q": "Aumento pedido 40, aumento permitido 30. ¿Qué haces?", "solution": "No usar sensibilidad directa; resolver nuevamente o analizar nueva base."}]}, {"id": "branch-bound", "icon": "🌳", "title": "Branch and Bound", "subtitle": "Resolver programación lineal entera con relajaciones, ramas, cotas y podas.", "lecture": "<section class=\"teacher\"><h2>Idea central</h2><p>Branch and Bound se usa cuando una o más variables deben ser enteras. Primero se resuelve el problema relajado, es decir, ignorando temporalmente la condición de entero. Si la solución relajada ya es entera, termina. Si no, se ramifica.</p><h3>Cómo se ramifica</h3><p>Si una variable entera queda decimal, por ejemplo x₁=3.75, se crean dos ramas:</p><div class=\"math\">x₁ ≤ 3<br>x₁ ≥ 4</div><p>Es decir, se usa piso y techo del valor decimal.</p><h3>Cuándo se poda</h3><table><tr><th>Caso</th><th>Qué hacer</th></tr><tr><td>Nodo no factible</td><td>Podar</td></tr><tr><td>Solución entera</td><td>Guardar incumbente y podar</td></tr><tr><td>La cota no puede mejorar la mejor entera</td><td>Podar por cota</td></tr><tr><td>Solución decimal con posibilidad de mejorar</td><td>Ramificar</td></tr></table></section>", "explained": [{"title": "Ejercicio 1: Branch and Bound completo", "html": "<p><b>Modelo:</b></p><div class=\"math\">Max z = 2x₁ + 4x₂<br>x₂ ≥ 1<br>x₂ ≤ (2/3)x₁<br>2x₁ + 3x₂ ≤ 15<br>x₁,x₂ enteras</div><h4>Paso 1: resolver relajación lineal</h4><p>Primero ignoramos que x₁ y x₂ son enteras. Graficamos las rectas:</p><div class=\"math\">x₂=1<br>x₂=(2/3)x₁<br>2x₁+3x₂=15</div><p>Puntos importantes:</p><table><tr><th>Punto</th><th>Z=2x₁+4x₂</th></tr><tr><td>(1.5,1)</td><td>7</td></tr><tr><td>(3.75,2.5)</td><td>17.5</td></tr><tr><td>(6,1)</td><td>16</td></tr></table><p>La relajación da:</p><div class=\"math\">x₁=3.75, x₂=2.5, z=17.5</div><p>Como es decimal, se ramifica en x₁:</p><div class=\"math\">x₁≤3 &nbsp;&nbsp; y &nbsp;&nbsp; x₁≥4</div><h4>Paso 2: árbol</h4><pre class=\"tree\">P0\nx1=3.75 ; x2=2.5\nz=17.5\nRamificar en x1\n├── x1 ≤ 3\n│   └── x1=3 ; x2=2\n│       z=14\n│       Entero\n└── x1 ≥ 4\n    └── x1=4 ; x2=2.33\n        z=17.33\n        Ramificar en x2\n        ├── x2 ≤ 2\n        │   └── x1=4.5 ; x2=2\n        │       z=17\n        │       Ramificar en x1\n        │       ├── x1 ≤ 4\n        │       │   └── x1=4 ; x2=2\n        │       │       z=16\n        │       │       Entero\n        │       └── x1 ≥ 5\n        │           └── x1=5 ; x2=1.66\n        │               z=16.66\n        │               Poda por cota\n        └── x2 ≥ 3\n            └── NF\n                Poda</pre><h4>Paso 3: justificar poda final</h4><p>Ya tenemos una solución entera:</p><div class=\"math\">x₁=4, x₂=2, z=16</div><p>El último nodo relajado da:</p><div class=\"math\">z=16.66</div><p>Como z toma valores enteros en las soluciones enteras, ese nodo no puede superar 16. Por lo tanto se poda.</p><h4>Respuesta</h4><div class=\"answer\">x₁*=4, x₂*=2, z*=16</div><p>También puede existir otra solución óptima entera con el mismo valor, por ejemplo x₁=6, x₂=1, z=16.</p>"}, {"title": "Ejercicio 2: rama desde decimal", "html": "<p>Si x₂=5.4 y x₂ debe ser entera:</p><div class=\"math\">x₂≤5<br>x₂≥6</div><p>No se usa x₂=5.4 porque eso elimina soluciones enteras posibles.</p>"}, {"title": "Ejercicio 3: poda por entero", "html": "<p>Si en un nodo obtienes x₁=3, x₂=2 y ambas deben ser enteras, ese nodo entrega una solución entera. Se guarda como incumbente y se poda porque no necesitas seguir ramificando desde una solución ya entera.</p>"}, {"title": "Ejercicio 4: poda por no factible", "html": "<p>Si al agregar una rama como x₂≥3 la región queda vacía, ese nodo es no factible:</p><div class=\"answer\">NF → Poda</div>"}, {"title": "Ejercicio 5: poda por cota", "html": "<p>En maximización, si tu mejor solución entera vale 16 y un nodo relajado tiene cota 15.8, ese nodo no puede mejorar a la incumbente. Se poda.</p>"}], "guided": [{"title": "Relajación", "q": "La relajación entrega x₁=3.75. ¿Qué dos ramas creas?", "answers": ["x1<=3 y x1>=4", "x1≤3 y x1≥4"], "explain": "Se usa piso y techo."}, {"title": "Entero o decimal", "q": "Si x₁=4 y x₂=2, ¿se ramifica?", "answers": ["no"], "explain": "No, porque ambas variables son enteras."}, {"title": "Poda", "q": "Si una rama no tiene región factible, ¿qué se hace?", "answers": ["poda", "podar"], "explain": "Se poda por no factible."}, {"title": "Cota", "q": "En maximización, incumbente=16 y nodo relajado=15.5. ¿se poda?", "answers": ["si", "sí"], "explain": "Sí, porque no puede mejorar 16."}], "solo": [{"title": "Resolver árbol", "q": "Max z=3x₁+2x₂; x₁+x₂≤4.5; x₁≤3; x₂≤3; x enteras. Resuelve por B&B.", "solution": "Relajación puede dar decimal. Ramifica en variable decimal y compara enteros. Una solución óptima esperada es cercana a (3,1) o (2,2) según evaluación."}, {"title": "Crear ramas", "q": "Si en un nodo x₂=2.7, escribe las dos ramas.", "solution": "x₂≤2 y x₂≥3."}]}, {"id": "transporte", "icon": "🚚", "title": "Transporte y Transbordo", "subtitle": "Vogel, MODI/simplex de transporte y balances con nodos intermedios.", "lecture": "<section class=\"teacher\"><h2>Transporte</h2><p>El problema de transporte decide cuánto enviar desde orígenes hacia destinos al menor costo total. Cada origen tiene oferta y cada destino demanda.</p><div class=\"math\">Min Z = Σ cᵢⱼxᵢⱼ<br>Σⱼxᵢⱼ=ofertaᵢ<br>Σᵢxᵢⱼ=demandaⱼ</div><h3>Vogel</h3><p>Vogel busca una solución inicial buena. En cada fila y columna calcula una penalidad: diferencia entre los dos costos menores. Se elige la mayor penalidad y dentro de esa fila/columna se asigna en el menor costo.</p><h3>MODI o simplex de transporte</h3><p>Después de una solución inicial, MODI verifica si es óptima usando potenciales uᵢ y vⱼ. En celdas ocupadas:</p><div class=\"math\">uᵢ+vⱼ=cᵢⱼ</div><p>En celdas vacías:</p><div class=\"math\">Δᵢⱼ=cᵢⱼ-uᵢ-vⱼ</div><p>En minimización, si todos los Δ≥0, la solución es óptima.</p><h3>Transbordo</h3><p>Transbordo es transporte con nodos intermedios. La regla de un nodo intermedio puro es:</p><div class=\"math\">lo que entra = lo que sale</div></section>", "explained": [{"title": "Ejercicio 1: Vogel paso a paso con tablas", "html": "<p><b>Tabla inicial:</b></p><table><tr><th></th><th>D1</th><th>D2</th><th>D3</th><th>Oferta</th></tr><tr><td>O1</td><td>8</td><td>6</td><td>10</td><td>20</td></tr><tr><td>O2</td><td>9</td><td>7</td><td>4</td><td>30</td></tr><tr><td>O3</td><td>3</td><td>4</td><td>2</td><td>25</td></tr><tr><td>Demanda</td><td>20</td><td>30</td><td>25</td><td>75</td></tr></table><p>Oferta total = 75 y demanda total = 75, está balanceado.</p><h4>Paso 1: penalidades iniciales</h4><table><tr><th>Fila/Columna</th><th>Dos menores</th><th>Penalidad</th></tr><tr><td>O1</td><td>6 y 8</td><td>2</td></tr><tr><td>O2</td><td>4 y 7</td><td>3</td></tr><tr><td>O3</td><td>2 y 3</td><td>1</td></tr><tr><td>D1</td><td>3 y 8</td><td>5</td></tr><tr><td>D2</td><td>4 y 6</td><td>2</td></tr><tr><td>D3</td><td>2 y 4</td><td>2</td></tr></table><p>La mayor penalidad es D1=5. Dentro de D1, el menor costo es O3-D1=3. Asignamos:</p><div class=\"math\">min(oferta O3=25, demanda D1=20)=20</div><h4>Tabla después del paso 1</h4><table><tr><th></th><th>D1</th><th>D2</th><th>D3</th><th>Oferta restante</th></tr><tr><td>O1</td><td>8</td><td>6</td><td>10</td><td>20</td></tr><tr><td>O2</td><td>9</td><td>7</td><td>4</td><td>30</td></tr><tr><td>O3</td><td><b>20</b></td><td>4</td><td>2</td><td>5</td></tr><tr><td>Demanda restante</td><td>0</td><td>30</td><td>25</td><td></td></tr></table><h4>Paso 2: recalcular sin D1</h4><table><tr><th>Fila/Columna</th><th>Penalidad</th></tr><tr><td>O1 [6,10]</td><td>4</td></tr><tr><td>O2 [7,4]</td><td>3</td></tr><tr><td>O3 [4,2]</td><td>2</td></tr><tr><td>D2 [6,7,4]</td><td>2</td></tr><tr><td>D3 [10,4,2]</td><td>2</td></tr></table><p>Mayor penalidad: O1=4. En O1, menor costo es D2=6. Asignamos:</p><div class=\"math\">min(20,30)=20</div><h4>Tabla después del paso 2</h4><table><tr><th></th><th>D1</th><th>D2</th><th>D3</th><th>Oferta restante</th></tr><tr><td>O1</td><td></td><td><b>20</b></td><td></td><td>0</td></tr><tr><td>O2</td><td></td><td>7</td><td>4</td><td>30</td></tr><tr><td>O3</td><td><b>20</b></td><td>4</td><td>2</td><td>5</td></tr><tr><td>Demanda restante</td><td>0</td><td>10</td><td>25</td><td></td></tr></table><h4>Paso 3: elegir siguiente</h4><p>Quedan O2 y O3, D2 y D3. Penalidades: O2=3, O3=2, D2=3, D3=2. Se puede elegir O2 o D2. Elegimos O2. Menor costo en O2: D3=4.</p><div class=\"math\">Asignar min(30,25)=25 en O2-D3</div><h4>Paso 4: completar restante</h4><p>Queda D2 con demanda 10. O2 queda con 5 y O3 con 5:</p><div class=\"math\">x₂₂=5<br>x₃₂=5</div><h4>Solución inicial por Vogel</h4><table><tr><th></th><th>D1</th><th>D2</th><th>D3</th><th>Oferta</th></tr><tr><td>O1</td><td>0</td><td>20</td><td>0</td><td>20</td></tr><tr><td>O2</td><td>0</td><td>5</td><td>25</td><td>30</td></tr><tr><td>O3</td><td>20</td><td>5</td><td>0</td><td>25</td></tr><tr><td>Demanda</td><td>20</td><td>30</td><td>25</td><td></td></tr></table><h4>Costo total</h4><div class=\"math\">Z = 20(6)+5(7)+25(4)+20(3)+5(4)=335</div><div class=\"answer\">Solución inicial Vogel: Z=335</div>"}, {"title": "Ejercicio 2: MODI para la tabla anterior", "html": "<p>Celdas ocupadas:</p><div class=\"math\">(1,2), (2,2), (2,3), (3,1), (3,2)</div><p>Fijamos u₁=0. En celdas ocupadas se cumple uᵢ+vⱼ=cᵢⱼ:</p><table><tr><th>Celda</th><th>Ecuación</th><th>Resultado</th></tr><tr><td>(1,2)</td><td>u₁+v₂=6</td><td>v₂=6</td></tr><tr><td>(2,2)</td><td>u₂+v₂=7</td><td>u₂=1</td></tr><tr><td>(2,3)</td><td>u₂+v₃=4</td><td>v₃=3</td></tr><tr><td>(3,2)</td><td>u₃+v₂=4</td><td>u₃=-2</td></tr><tr><td>(3,1)</td><td>u₃+v₁=3</td><td>v₁=5</td></tr></table><p>Ahora calculamos Δ en celdas vacías:</p><table><tr><th>Celda vacía</th><th>Δ=c-u-v</th></tr><tr><td>(1,1)</td><td>8-0-5=3</td></tr><tr><td>(1,3)</td><td>10-0-3=7</td></tr><tr><td>(2,1)</td><td>9-1-5=3</td></tr><tr><td>(3,3)</td><td>2-(-2)-3=1</td></tr></table><p>Como todos los Δ son mayores o iguales a cero, la solución es óptima.</p><div class=\"answer\">Óptimo de transporte: Z=335</div>"}, {"title": "Ejercicio 3: balancear oferta y demanda", "html": "<p>Oferta total 100 y demanda total 85. Sobra oferta:</p><div class=\"math\">100-85=15</div><p>Se agrega un destino ficticio con demanda 15 y costos 0.</p>"}, {"title": "Ejercicio 4: transbordo puro", "html": "<p>Nodo B recibe de A y envía a C y D. No produce ni consume.</p><div class=\"math\">xAB = xBC + xBD</div><p>Eso es la regla de transbordo: entrada = salida.</p>"}, {"title": "Ejercicio 5: transbordo con demanda propia", "html": "<p>Nodo C recibe xAC y xBC, envía xCD y además consume 20.</p><div class=\"math\">xAC + xBC = xCD + 20</div>"}], "guided": [{"title": "Balance", "q": "Ofertas 20,30,25 y demandas 20,30,25. ¿Está balanceado?", "answers": ["si", "sí"], "explain": "Sí, ambos suman 75."}, {"title": "Penalidad", "q": "En fila con costos 8,6,10, ¿cuál es la penalidad?", "answers": ["2"], "explain": "Los dos menores son 6 y 8; 8-6=2."}, {"title": "Asignación", "q": "Si eliges D1 y la celda menor tiene oferta 25 y demanda 20, ¿cuánto asignas?", "answers": ["20"], "explain": "Se asigna el mínimo entre oferta y demanda."}, {"title": "MODI", "q": "Si u₁=0 y c₁₂=6 en celda ocupada, ¿cuánto vale v₂?", "answers": ["6"], "explain": "u₁+v₂=c₁₂ ⇒ v₂=6."}], "solo": [{"title": "Vogel completo", "q": "Resuelve por Vogel: costos [[4,8,5],[6,4,3],[5,7,6]], ofertas 30,40,20, demandas 20,50,20.", "solution": "Desarrolla penalidades por tabla. Luego calcula costo total. Verifica m+n-1 asignaciones."}, {"title": "Transbordo", "q": "Nodo P oferta 100; bodega B; clientes C1=40, C2=60. Arcos P-B, B-C1, B-C2. Formula balances.", "solution": "xPB=100; xPB=xBC1+xBC2; xBC1=40; xBC2=60."}]}, {"id": "hungaro", "icon": "🎯", "title": "Método Húngaro", "subtitle": "Asignación uno a uno para minimizar costos o maximizar beneficios.", "lecture": "<section class=\"teacher\"><h2>Cuándo se usa</h2><p>Se usa cuando cada fila debe asignarse a una columna y cada columna debe recibir exactamente una fila. Ejemplos: trabajadores-tareas, máquinas-trabajos, vendedores-zonas.</p><h3>Minimización</h3><ol><li>Si la matriz no es cuadrada, agregar fila/columna ficticia.</li><li>Restar el menor de cada fila.</li><li>Restar el menor de cada columna.</li><li>Cubrir los ceros con el mínimo número de líneas.</li><li>Si líneas = tamaño de matriz, hacer asignación.</li><li>Si no, ajustar con el menor no cubierto.</li></ol><h3>Maximización</h3><p>Convertir beneficios a costos:</p><div class=\"math\">costo transformado = mayor valor de la matriz − beneficio original</div><p>Luego aplicar el método de minimización. El valor final siempre se calcula con la matriz original.</p></section>", "explained": [{"title": "Ejercicio 1: minimización paso a paso", "html": "<p><b>Matriz de costos:</b></p><table><tr><th></th><th>T1</th><th>T2</th><th>T3</th></tr><tr><td>A</td><td>9</td><td>2</td><td>7</td></tr><tr><td>B</td><td>6</td><td>4</td><td>3</td></tr><tr><td>C</td><td>5</td><td>8</td><td>1</td></tr></table><h4>Paso 1: reducir filas</h4><table><tr><th>Fila</th><th>Menor</th><th>Fila reducida</th></tr><tr><td>A [9,2,7]</td><td>2</td><td>[7,0,5]</td></tr><tr><td>B [6,4,3]</td><td>3</td><td>[3,1,0]</td></tr><tr><td>C [5,8,1]</td><td>1</td><td>[4,7,0]</td></tr></table><h4>Paso 2: reducir columnas</h4><p>Matriz después de filas:</p><table><tr><td>7</td><td>0</td><td>5</td></tr><tr><td>3</td><td>1</td><td>0</td></tr><tr><td>4</td><td>7</td><td>0</td></tr></table><p>La columna 1 tiene menor 3. Restamos 3 a la columna 1:</p><table><tr><td>4</td><td>0</td><td>5</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>7</td><td>0</td></tr></table><h4>Paso 3: asignar ceros independientes</h4><p>Primero C solo puede tomar T3 si queremos evitar conflicto. Luego B toma T1 y A toma T2.</p><table><tr><th>Trabajador</th><th>Tarea asignada</th><th>Costo original</th></tr><tr><td>A</td><td>T2</td><td>2</td></tr><tr><td>B</td><td>T1</td><td>6</td></tr><tr><td>C</td><td>T3</td><td>1</td></tr></table><div class=\"math\">Costo total = 2+6+1=9</div><div class=\"answer\">Asignación óptima: A-T2, B-T1, C-T3. Costo mínimo 9.</div>"}, {"title": "Ejercicio 2: maximización", "html": "<p><b>Matriz de beneficios:</b></p><table><tr><td>8</td><td>6</td><td>7</td></tr><tr><td>5</td><td>9</td><td>6</td></tr><tr><td>7</td><td>8</td><td>5</td></tr></table><p>Mayor valor = 9. Transformamos:</p><table><tr><td>1</td><td>3</td><td>2</td></tr><tr><td>4</td><td>0</td><td>3</td></tr><tr><td>2</td><td>1</td><td>4</td></tr></table><p>Aplicando húngaro a la matriz transformada se obtiene una asignación óptima:</p><div class=\"math\">A→T3, B→T2, C→T1</div><p>Valor real usando la matriz original:</p><div class=\"math\">7+9+7=23</div><div class=\"answer\">Beneficio máximo 23</div>"}, {"title": "Ejercicio 3: matriz no cuadrada", "html": "<p>Si hay 3 trabajadores y 4 tareas, se agrega una fila ficticia de costo 0 para cuadrar la matriz. La asignación de la fila ficticia indica tarea no realizada o recurso sobrante, según el contexto.</p>"}, {"title": "Ejercicio 4: cubrir ceros", "html": "<p>Si una matriz 4x4 tiene ceros cubiertos con solo 3 líneas, todavía no puedes asignar óptimamente. Debes ajustar con el menor número no cubierto.</p>"}, {"title": "Ejercicio 5: total final", "html": "<p>En maximización, nunca calcules el beneficio con la matriz transformada. La transformada solo sirve para encontrar asignaciones. El valor final sale de la matriz original.</p>"}], "guided": [{"title": "Fila", "q": "Reduce la fila [8,6,7].", "answers": ["2,0,1", "[2,0,1]"], "explain": "El menor es 6; resta 6 a todos."}, {"title": "Max a min", "q": "Si el mayor beneficio es 10 y una celda vale 7, ¿cuál es el costo transformado?", "answers": ["3"], "explain": "10-7=3."}, {"title": "Total final", "q": "En maximización, ¿el valor final se calcula con matriz original o transformada?", "answers": ["original", "matriz original"], "explain": "Siempre con la matriz original."}], "solo": [{"title": "Minimización", "q": "Aplica húngaro a [[4,1,3],[2,0,5],[3,2,2]].", "solution": "Una asignación óptima es A-T2, B-T1, C-T3 con costo 1+2+2=5."}, {"title": "Maximización", "q": "Transforma matriz de beneficios [[6,8],[7,5]].", "solution": "Mayor 8; transformada [[2,0],[1,3]]."}]}];
const quizData = [["¿Qué significa “al menos” en una restricción?", "≥"], ["¿Qué método entrega una solución inicial de transporte usando penalidades?", "Vogel"], ["En Branch and Bound, si x=4.6, ¿qué ramas se crean?", "x≤4 y x≥5"], ["En método húngaro para maximizar, ¿con qué matriz se calcula el valor final?", "original"], ["En simplex dual, ¿qué fila sale primero?", "la de RHS más negativo"]];
let currentModule=modules[0].id, currentPage='lecture';
function norm(s){return (s||'').toLowerCase().replace(/\s+/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3').replace(/₄/g,'4').replace(/−/g,'-').replace(/\*/g,'');}
function show(id){['inicio','curso','practica','quiz','formulario'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==id);document.getElementById('nav-'+x).classList.toggle('active',x===id)}); if(id==='curso') renderCourse(); if(id==='practica') renderPractice(); if(id==='quiz') renderQuiz(); if(id==='formulario') renderFormula();}
function renderInicio(){document.getElementById('inicio').innerHTML=`<div class="hero"><span class="badge">Ruta lineal</span><h2>Aprende desde formulación hasta método húngaro</h2><p>La app está separada como un curso real. Cada unidad tiene cuatro páginas: <b>explicación</b>, <b>ejercicios explicados</b>, <b>práctica guiada</b> y <b>ejercicios sin ayuda</b>.</p><div class="progress"><div class="bar" id="pbar"></div></div><p class="muted">Consejo: estudia en orden. No pases a ejercicios sin ayuda hasta entender los ejercicios explicados.</p><button class="btn primary" onclick="show('curso')">Empezar curso</button> <button class="btn" onclick="show('practica')">Practicar</button> <button class="btn" onclick="show('formulario')">Ver formulario</button></div><h2>Unidades</h2><div class="grid">${modules.map(m=>`<div class="card module" onclick="currentModule='${m.id}';currentPage='lecture';show('curso')"><div class="icon">${m.icon}</div><h3>${m.title}</h3><p class="muted">${m.subtitle}</p><span class="badge">4 páginas</span></div>`).join('')}</div>`; updateProgress();}
function renderCourse(){const m=modules.find(x=>x.id===currentModule)||modules[0];document.getElementById('curso').innerHTML=`<div class="courseLayout"><aside class="side card"><h3>Curso</h3>${modules.map(mm=>`<button class="${mm.id===m.id?'active':''}" onclick="currentModule='${mm.id}';currentPage='lecture';renderCourse()">${mm.icon} ${mm.title}</button>`).join('')}</aside><section class="card"><div class="tabs"><button class="${currentPage==='lecture'?'active':''}" onclick="currentPage='lecture';renderCourse()">1. Explicación</button><button class="${currentPage==='explained'?'active':''}" onclick="currentPage='explained';renderCourse()">2. Ejercicios explicados</button><button class="${currentPage==='guided'?'active':''}" onclick="currentPage='guided';renderCourse()">3. Práctica guiada</button><button class="${currentPage==='solo'?'active':''}" onclick="currentPage='solo';renderCourse()">4. Sin ayuda</button></div><h2>${m.icon} ${m.title}</h2><p class="muted">${m.subtitle}</p><div id="pageContent"></div></section></div>`; const el=document.getElementById('pageContent'); if(currentPage==='lecture') el.innerHTML=m.lecture; if(currentPage==='explained') el.innerHTML=m.explained.map((e,i)=>`<div class="stepcard"><span class="badge">Ejercicio ${i+1}</span><h3>${e.title}</h3>${e.html}</div>`).join(''); if(currentPage==='guided') el.innerHTML=renderGuided(m); if(currentPage==='solo') el.innerHTML=renderSolo(m); markDone(m.id+'-'+currentPage);}
function renderGuided(m){return `<div class="practiceBox"><h3>Práctica guiada paso a paso</h3><p>Responde cada paso. La app corrige y explica. No se trata de adivinar el resultado: se trata de seguir el procedimiento.</p>${m.guided.map((g,i)=>`<div class="stepcard"><b>Paso ${i+1}: ${g.title}</b><p>${g.q}</p><input class="input" id="g-${i}" placeholder="Escribe tu respuesta"><button class="btn" onclick="checkGuided('${m.id}',${i})">Revisar paso</button><div id="fb-${i}"></div></div>`).join('')}</div>`}
function checkGuided(mid,i){const m=modules.find(x=>x.id===mid); const g=m.guided[i]; const val=norm(document.getElementById('g-'+i).value); const ok=g.answers.some(a=>val===norm(a)||val.includes(norm(a))); const fb=document.getElementById('fb-'+i); fb.className='feedback '+(ok?'good':'bad'); fb.innerHTML= ok?'Bien. '+g.explain:'Revisa. '+g.explain;}
function renderSolo(m){return `<h3>Ejercicios sin ayuda</h3><p>Desarrolla aquí mismo. Primero intenta sin mirar la pauta. Luego usa pista o solución.</p>${m.solo.map((s,i)=>`<div class="stepcard"><h3>${i+1}. ${s.title}</h3><p>${s.q}</p><textarea class="input" id="solo-${m.id}-${i}" placeholder="Desarrolla aquí: variables, tablas, gráficos, operaciones, conclusión..."></textarea><br><button class="btn" onclick="saveSolo('${m.id}',${i})">Guardar avance</button> <button class="btn" onclick="toggleSol('${m.id}',${i})">Ver solución paso a paso</button><div class="answer hidden" id="sol-${m.id}-${i}">${s.solution}</div></div>`).join('')}`}
function saveSolo(mid,i){localStorage.setItem('solo-'+mid+'-'+i,document.getElementById(`solo-${mid}-${i}`).value); alert('Avance guardado en este navegador.');}
function toggleSol(mid,i){document.getElementById(`sol-${mid}-${i}`).classList.toggle('hidden')}
function renderPractice(){document.getElementById('practica').innerHTML=`<div class="card"><h2>Práctica rápida</h2><p>Elige una unidad y resuelve pasos guiados. Esta sección usa las mismas preguntas, pero separadas del curso.</p><div class="grid">${modules.map(m=>`<div class="module box" onclick="currentModule='${m.id}';currentPage='guided';show('curso')"><div class="icon">${m.icon}</div><b>${m.title}</b><p class="muted">Práctica guiada</p></div>`).join('')}</div><h3>Laboratorio gráfico interactivo</h3><p>Haz clic aproximado en los vértices (0,0), (4,0), (8/3,8/3), (0,4). La app te dirá si marcaste cerca.</p><div class="svgwrap"><svg id="clickPlot" viewBox="0 0 420 300" class="plot" onclick="plotClick(event)"><line x1="40" y1="260" x2="390" y2="260"/><line x1="40" y1="260" x2="40" y2="20"/><line x1="40" y1="100" x2="200" y2="260" stroke="#2563eb" stroke-width="3"/><line x1="40" y1="180" x2="360" y2="260" stroke="#7c3aed" stroke-width="3"/><text x="50" y="30">Clic en los vértices</text></svg></div><div id="plotFb" class="feedback"></div></div>`}
function plotClick(evt){const svg=evt.currentTarget; const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); const targets=[[40,260,'(0,0)'],[200,260,'(4,0)'],[146.7,153.3,'(8/3,8/3)'],[40,100,'(0,4)']]; let near=targets.find(t=>Math.hypot(p.x-t[0],p.y-t[1])<18); const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',5); c.setAttribute('fill',near?'#22c55e':'#ef4444'); svg.appendChild(c); const fb=document.getElementById('plotFb'); fb.className='feedback '+(near?'good':'bad'); fb.innerText=near?'Correcto, marcaste cerca de '+near[2]:'Ese punto no corresponde a un vértice esperado.';}
function renderQuiz(){document.getElementById('quiz').innerHTML=`<div class="card"><h2>Quiz</h2>${quizData.map((q,i)=>`<div class="stepcard"><b>${i+1}. ${q[0]}</b><input class="input" id="quiz-${i}"><button class="btn" onclick="checkQuiz(${i})">Revisar</button><div id="qfb-${i}"></div></div>`).join('')}</div>`}
function checkQuiz(i){const ok=norm(document.getElementById('quiz-'+i).value).includes(norm(quizData[i][1])); const fb=document.getElementById('qfb-'+i); fb.className='feedback '+(ok?'good':'bad'); fb.innerText=ok?'Correcto.':'Respuesta esperada: '+quizData[i][1];}
function renderFormula(){document.getElementById('formulario').innerHTML=`<div class="card"><h2>Formulario compacto</h2><div class="grid2"><div class="box"><h3>Formulación</h3><div class="math">Max/Min Z=Σcᵢxᵢ<br>restricciones<br>xᵢ≥0</div></div><div class="box"><h3>Gráfico</h3><p>Rectas → región factible → vértices → evaluar Z.</p></div><div class="box"><h3>Simplex Dual</h3><p>Sale RHS más negativo. Entra columna válida. Pivote. Repetir.</p></div><div class="box"><h3>Sensibilidad</h3><div class="math">ΔZ = precio sombra × ΔRHS</div></div><div class="box"><h3>Branch and Bound</h3><div class="math">x=3.75 ⇒ x≤3 / x≥4</div></div><div class="box"><h3>Transporte</h3><div class="math">Min Z=Σcᵢⱼxᵢⱼ<br>Vogel: penalidad = diferencia de dos menores<br>MODI: Δ=c-u-v</div></div><div class="box"><h3>Transbordo</h3><div class="math">Entrada + oferta = salida + demanda</div></div><div class="box"><h3>Húngaro</h3><p>Reducir filas, reducir columnas, cubrir ceros, asignar. Max: transformar con mayor-beneficio.</p></div></div><button class="btn" onclick="window.print()">Imprimir</button></div>`}
function markDone(k){let s=JSON.parse(localStorage.getItem('done')||'[]'); if(!s.includes(k)){s.push(k);localStorage.setItem('done',JSON.stringify(s));} updateProgress();}
function updateProgress(){let s=JSON.parse(localStorage.getItem('done')||'[]'); let total=modules.length*4; let pct=Math.min(100,Math.round(s.length/total*100)); let b=document.getElementById('pbar'); if(b)b.style.width=pct+'%';}
renderInicio();show('inicio'); if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}
</script></body></html>
