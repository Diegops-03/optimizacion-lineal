:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--blue2:#dbeafe;--green:#059669;--green2:#dcfce7;--amber:#b45309;--amber2:#fef3c7;--red:#dc2626;--red2:#fee2e2;--purple:#7c3aed;--purple2:#ede9fe;--shadow:0 10px 25px rgba(15,23,42,.08);--radius:18px;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55} a{color:var(--blue)}

.top{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:0;color:#cbd5e1;font-size:12px}.install{background:#fff;color:#0f172a;border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.install:hover{background:#e2e8f0}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:15}.navinner{max-width:1200px;margin:auto;display:flex;gap:8px;overflow:auto;padding:10px 16px}.navbtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--ink);cursor:pointer;font-weight:700}.navbtn.active{background:#0f172a;color:white;border-color:#0f172a}.navbtn:hover{border-color:#94a3b8}
main{max-width:1200px;margin:0 auto;padding:22px 16px 84px}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:17px}nav{top:72px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.hero{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe}.hero h2{font-size:32px;margin:0 0 8px}.hero p{font-size:17px;color:#334155}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--blue2);color:#1d4ed8;font-size:12px;font-weight:800;margin:3px}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#334155;font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}.big{font-size:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.section-title h2,.section-title h3{margin:0}.unit-list{display:grid;gap:10px}.unititem{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:16px;background:#fff;cursor:pointer}.unititem:hover{border-color:#93c5fd;background:#eff6ff}.unititem.active{border-color:#2563eb;background:#dbeafe}.num{min-width:34px;height:34px;border-radius:11px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}.unititem h4{margin:0}.unititem p{margin:3px 0 0;color:#475569;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
h2,h3,h4{line-height:1.2}.lesson h2{margin-top:0}.lesson h3{margin-top:22px}.callout{border-left:5px solid var(--blue);background:#eff6ff;padding:12px 14px;border-radius:12px;margin:12px 0}.warn{border-left-color:var(--amber);background:var(--amber2)}.ok{border-left-color:var(--green);background:var(--green2)}.bad{border-left-color:var(--red);background:var(--red2)}.formula{background:#0f172a;color:#e2e8f0;border-radius:14px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;margin:10px 0}.math{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 5px;border-radius:6px}.steps{counter-reset:step}.step{position:relative;margin:12px 0;padding:14px 14px 14px 48px;border:1px solid var(--line);border-radius:15px;background:#fff}.step:before{counter-increment:step;content:counter(step);position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}.step h4{margin:0 0 6px}.example{border:1px solid #bfdbfe;background:#f8fbff;border-radius:18px;padding:16px;margin:14px 0}.example h3,.example h4{margin-top:0}.tablewrap{overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:14px;background:white}table{border-collapse:collapse;width:100%;min-width:540px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle}th{background:#f1f5f9;font-weight:900}.tleft{text-align:left}.hl{background:#dbeafe!important;font-weight:900}.hl2{background:#dcfce7!important;font-weight:900}.hl3{background:#fef3c7!important;font-weight:900}.strike{opacity:.45;text-decoration:line-through}.cellcost{font-size:12px;color:#64748b;float:right}.alloc{font-weight:900;font-size:16px}.matrix td,.matrix th{min-width:70px}.svgbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;overflow:auto}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:12px;background:#0f172a;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px}.textarea{min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.checkline{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;padding:10px;border-radius:12px}.progress{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#059669);width:0}.feedback{margin-top:10px;padding:10px;border-radius:12px;display:none}.feedback.show{display:block}.feedback.good{background:var(--green2);color:#065f46}.feedback.no{background:var(--red2);color:#991b1b}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid #cbd5e1;border-bottom-width:3px;border-radius:6px;background:#fff;padding:1px 5px}.graphCanvas{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#fff;touch-action:none}.split{display:grid;grid-template-columns:290px 1fr;gap:16px}.side{position:sticky;top:132px;height:max-content}@media(max-width:900px){.split{grid-template-columns:1fr}.side{position:relative;top:0}.hero h2{font-size:25px}table{font-size:13px}.step{padding-left:42px}}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:40}.bottomnav .navinner{padding:8px}.bottomnav button{flex:1;font-size:12px;padding:8px 6px}@media(max-width:740px){header{position:relative}nav{display:none}.bottomnav{display:block}main{padding-bottom:92px}.brand p{display:none}.install{display:none}}
.confetti{position:fixed;pointer-events:none;inset:0;z-index:100}.hidden{display:none}.twoColSteps{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.twoColSteps{grid-template-columns:1fr}}

<body>
<header><div class="top"><div class="brand"><div class="logo">∑</div><div><h1>Aprendiendo Optimización Lineal</h1><p>Curso interactivo: teoría, tablas, gráficos, práctica guiada y ejercicios libres.</p></div></div><button id="installBtn" class="install hidden">Instalar app</button></div></header>
<nav><div class="navinner" id="topnav"></div></nav>
<main id="app"></main>
<div class="bottomnav"><div class="navinner" id="bottomnav"></div></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
const state={view:'inicio',unit:'formulacion',page:'explicacion'};
const navs=[['inicio','Inicio'],['curso','Curso'],['practica','Práctica'],['quiz','Quiz'],['formulario','Formulario']];
const units=[
 ['formulacion','Formulación','Traducir un enunciado a variables, objetivo y restricciones.'],
 ['grafico','Método gráfico','Resolver modelos de dos variables con región factible y vértices.'],
 ['estandar','Forma estándar','Convertir variables y restricciones para poder aplicar simplex.'],
 ['simplex','Simplex, Big M y Dual','Tablas, pivotes, variables artificiales y simplex dual.'],
 ['sensibilidad','Sensibilidad','Cambios en recursos, costos, precios sombra y rangos.'],
 ['branch','Branch and Bound','Modelos enteros, relajación, ramificación y poda.'],
 ['transporte','Transporte y Transbordo','Vogel, MODI/simplex de transporte y nodos intermedios.'],
 ['hungaro','Método húngaro','Asignación para minimizar y maximizar.']
];
function saveProgress(k){localStorage.setItem('opti_progress_'+k,'1'); renderProgress();}
function progressPct(){let n=0; units.forEach(u=>{['explicacion','ejemplos','guiada','libre'].forEach(p=>{if(localStorage.getItem('opti_progress_'+u[0]+'_'+p)) n++})}); return Math.round(100*n/(units.length*4));}
function renderNav(){for(const id of ['topnav','bottomnav']){const el=document.getElementById(id);el.innerHTML=navs.map(n=>`<button class="navbtn ${state.view==n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}}
function go(v){state.view=v; render()}
function selectUnit(u){state.unit=u;state.view='curso';state.page='explicacion';render()}
function setPage(p){state.page=p; saveProgress(state.unit+'_'+p); render()}
function render(){renderNav(); const app=$('#app'); if(state.view==='inicio') app.innerHTML=home(); if(state.view==='curso') app.innerHTML=course(); if(state.view==='practica') app.innerHTML=practice(); if(state.view==='quiz') app.innerHTML=quiz(); if(state.view==='formulario') app.innerHTML=formulario(); renderProgress(); setTimeout(()=>{drawGraphExample(); drawFreeGraph(); if(state.view==='curso' && state.page==='guiada'){initGuided(state.unit)}},50)}
function renderProgress(){const bar=$('#progressBar'); if(bar) bar.style.width=progressPct()+'%'; const pct=$('#pct'); if(pct) pct.textContent=progressPct()+'%'}
function home(){return `<section class="hero card"><span class="pill">Curso lineal</span><span class="pill">Modo offline</span><span class="pill">Práctica guiada</span><h2>Aprende optimización lineal como si estuvieras resolviendo en pizarra.</h2><p>La app está ordenada para estudiar en secuencia: primero entiendes la materia, después ves ejercicios resueltos con tablas y gráficos, luego practicas guiado paso a paso y finalmente resuelves solo.</p><div class="progress"><div id="progressBar" class="bar"></div></div><p class="small muted">Avance registrado en este dispositivo: <b id="pct">0%</b></p><div class="btnrow"><button class="btn blue" onclick="go('curso')">Comenzar curso</button><button class="btn secondary" onclick="go('practica')">Ir a práctica</button><button class="btn secondary" onclick="go('formulario')">Ver formulario</button></div></section><section class="grid grid3" style="margin-top:16px"><div class="card"><h3>1. Página de explicación</h3><p>Materia extensa, con intuición, fórmulas, cuándo usar el método y errores típicos.</p></div><div class="card"><h3>2. Ejercicios explicados</h3><p>Desarrollo paso a paso con tablas, gráficos, matrices, iteraciones y cambios entre tablas.</p></div><div class="card"><h3>3. Práctica guiada</h3><p>La app te pide avanzar como en un certamen: calcular, decidir, justificar y corregir.</p></div></section><section class="card" style="margin-top:16px"><h3>Ruta recomendada</h3><div class="unit-list">${units.map((u,i)=>`<div class="unititem" onclick="selectUnit('${u[0]}')"><div class="num">${i+1}</div><div><h4>${u[1]}</h4><p>${u[2]}</p></div></div>`).join('')}</div></section>`}
function course(){const u=units.find(x=>x[0]===state.unit);return `<div class="split"><aside class="side card"><h3>Unidades</h3><div class="unit-list">${units.map((x,i)=>`<div class="unititem ${state.unit==x[0]?'active':''}" onclick="selectUnit('${x[0]}')"><div class="num">${i+1}</div><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}</div></aside><section class="card lesson"><div class="section-title"><div><span class="badge">Unidad</span><h2>${u[1]}</h2><p class="muted">${u[2]}</p></div></div><div class="tabs"><button class="tab ${state.page==='explicacion'?'active':''}" onclick="setPage('explicacion')">1. Explicación</button><button class="tab ${state.page==='ejemplos'?'active':''}" onclick="setPage('ejemplos')">2. Ejercicios explicados</button><button class="tab ${state.page==='guiada'?'active':''}" onclick="setPage('guiada')">3. Práctica guiada</button><button class="tab ${state.page==='libre'?'active':''}" onclick="setPage('libre')">4. Ejercicios sin ayuda</button></div>${pageContent(state.unit,state.page)}</section></div>`}
function pageContent(u,p){if(p==='explicacion') return explanations[u]||''; if(p==='ejemplos') return examples[u]||''; if(p==='guiada') return guidedBlock(u); if(p==='libre') return freeBlock(u);}
function T(headers,rows,cls=''){return `<div class="tablewrap"><table class="${cls}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function transportationTable(data,alloc={},hl=[]){let h=['Origen / Destino',...data.demand.map((_,j)=>'D'+(j+1)),'Oferta'];let rows=data.costs.map((row,i)=>[`O${i+1}`,...row.map((c,j)=>{let key=i+'-'+j;let a=alloc[key]!==undefined?`<div class="alloc">${alloc[key]}</div>`:'';let cls=hl.includes(key)?'hl':'';return `<div class="${cls}"><span class="cellcost">c=${c}</span>${a||'<span class="muted">—</span>'}</div>`}),data.supply[i]]);rows.push(['Demanda',...data.demand,'']);return T(h,rows)}
function matrixTable(title,mat,hl=[]){return `<h4>${title}</h4>`+T(['',...mat[0].map((_,j)=>'T'+(j+1))],mat.map((r,i)=>['P'+(i+1),...r.map((v,j)=>`<span class="${hl.includes(i+'-'+j)?'hl2':''}">${v}</span>`)]),'matrix')}
const explanations={
formulacion:`<h2>1. Formulación de modelos</h2><p>Formular es convertir un problema escrito en un modelo matemático. Este es el paso más importante: si formulas mal, aunque uses bien simplex, Vogel o Branch and Bound, la respuesta será incorrecta.</p><div class="callout"><b>Idea central:</b> todo modelo de programación lineal tiene variables de decisión, función objetivo, restricciones y condiciones de signo.</div><h3>Qué debes identificar en el enunciado</h3>${T(['Elemento','Pregunta clave','Ejemplo'],[['Variables','¿Qué cantidades debo decidir?','x₁ = unidades a producir del producto A'],['Objetivo','¿Quiero minimizar costo o maximizar utilidad?','Max Z = 40x₁ + 30x₂'],['Restricciones','¿Qué limita la decisión?','Horas, demanda, presupuesto, capacidad'],['Signo','¿Las variables pueden ser negativas?','Normalmente xᵢ ≥ 0']])}<h3>Regla práctica</h3><div class="steps"><div class="step"><h4>Subraya decisiones</h4><p>Busca verbos como producir, comprar, enviar, contratar, asignar, almacenar.</p></div><div class="step"><h4>Define variables con unidad</h4><p>No escribas solo x₁. Escribe: <span class="math">x₁ = unidades del producto A producidas en el mes 1</span>.</p></div><div class="step"><h4>Arma la función objetivo</h4><p>Multiplica cada decisión por su costo, utilidad o tiempo.</p></div><div class="step"><h4>Traduce cada límite</h4><p>Disponibilidad suele ser ≤. Demanda mínima suele ser ≥. Balance de inventario suele ser igualdad.</p></div><div class="step"><h4>Agrega signo</h4><p>Siempre termina con <span class="math">x ≥ 0</span>, o entero si el problema lo exige.</p></div></div><h3>Restricciones típicas</h3><div class="formula">Capacidad: consumo por unidad × cantidad ≤ disponibilidad\nDemanda mínima: producción + compra + inventario ≥ demanda\nInventario: inventario inicial + producción - demanda = inventario final\nPresupuesto: costo unitario × cantidad ≤ presupuesto</div><div class="warn"><b>Error típico:</b> confundir “satisfacer demanda” con ≤. Si debes cumplir al menos una demanda, generalmente va con ≥ o con una igualdad de balance.</div>`,
grafico:`<h2>2. Método gráfico</h2><p>El método gráfico se usa cuando el modelo tiene exactamente dos variables principales. Sirve para ver la región factible, encontrar vértices y evaluar la función objetivo.</p>${T(['Paso','Qué haces','Por qué'],[['1','Dibujas cada restricción como recta','La frontera divide el plano'],['2','Identificas el lado factible','Usas un punto de prueba, normalmente (0,0)'],['3','Encuentras intersecciones','Los óptimos lineales ocurren en vértices'],['4','Evalúas Z en cada vértice','El mayor o menor valor entrega el óptimo'],['5','Revisas soluciones múltiples','Si la recta objetivo es paralela a un lado activo']])}<h3>Cómo graficar una restricción</h3><p>Para <span class="math">2x₁ + x₂ ≤ 8</span>, calcula interceptos:</p>${T(['Punto','Cálculo','Resultado'],[['Si x₁=0','x₂=8','(0,8)'],['Si x₂=0','2x₁=8','(4,0)']])}<div class="callout ok"><b>Óptimo gráfico:</b> nunca basta con mirar. Debes escribir los vértices y evaluar Z.</div><h3>Soluciones múltiples</h3><p>Hay soluciones múltiples cuando la función objetivo tiene la misma pendiente que una restricción activa y el óptimo queda en un segmento. En ese caso cualquier punto del segmento es óptimo.</p>`,
estandar:`<h2>3. Forma estándar</h2><p>La forma estándar prepara un modelo para simplex. El objetivo es que todas las variables sean no negativas y que las restricciones queden como igualdades.</p>${T(['Situación','Transformación'],[['Restricción ≤','Agregar holgura: +s'],['Restricción ≥','Restar excedente: -s y normalmente agregar artificial +a'],['Restricción =','Agregar artificial si no hay variable básica clara'],['Variable x libre','Reemplazar x = x⁺ - x⁻'],['Variable x ≥ L','Usar x = x’ + L con x’ ≥ 0'],['Variable x ≤ U','Usar x = U - x’ con x’ ≥ 0']])}<h3>Por qué aparecen variables artificiales</h3><p>Simplex necesita una base inicial. En restricciones ≥ o = muchas veces no hay una columna identidad. La variable artificial se agrega solo para iniciar el método y después debe salir de la solución.</p><div class="warn"><b>Ojo:</b> una variable artificial positiva al final significa que el modelo original es infactible.</div>`,
simplex:`<h2>4. Simplex, Big M y Simplex Dual</h2><p>Simplex se mueve de una solución básica factible a otra, mejorando la función objetivo hasta que no exista mejora posible. La versión Big M permite partir cuando aparecen artificiales. Simplex dual sirve cuando la tabla es óptima en costos, pero tiene lados derechos negativos.</p><h3>Simplex primal</h3>${T(['Pregunta','Regla común en maximización'],[['¿Quién entra?','La variable con costo reducido más negativo en la fila Z'],['¿Quién sale?','Razón mínima positiva b/a en la columna pivote'],['¿Cuándo termina?','Cuando no quedan costos reducidos negativos']])}<h3>Big M</h3><p>Se castiga cada artificial con una M muy grande. Si minimizas, se suma <span class="math">+M aᵢ</span>; si maximizas, se resta <span class="math">-M aᵢ</span>. La idea es que las artificiales salgan de la base.</p><h3>Simplex dual</h3>${T(['Pregunta','Regla en dual'],[['¿Cuándo usarlo?','Cuando hay b negativo pero la fila Z ya cumple la condición de optimalidad'],['¿Quién sale?','La fila con b más negativo'],['¿Quién entra?','Entre coeficientes negativos de esa fila, se usa el menor cociente permitido'],['¿Cuándo termina?','Cuando todos los b son ≥ 0']])}<div class="callout"><b>Traducción simple:</b> el primal arregla la función objetivo; el dual arregla la factibilidad.</div>`,
sensibilidad:`<h2>5. Análisis de sensibilidad</h2><p>La sensibilidad responde qué pasa si cambia un dato del problema después de tener la solución óptima. No siempre hay que resolver todo de nuevo: muchas veces basta con revisar rangos.</p>${T(['Concepto','Qué significa','Interpretación'],[['Precio sombra','Valor marginal de un recurso','Cuánto mejora Z si aumenta en 1 unidad el lado derecho'],['Rango de factibilidad','Cuánto puede cambiar b sin cambiar la base','La base sigue siendo válida'],['Rango de optimalidad','Cuánto puede cambiar un coeficiente de Z sin cambiar la base','Se mantiene la misma solución básica'],['Costo reducido','Mejora necesaria para que una variable no básica entre','Si es cero, puede existir solución múltiple']])}<h3>Cómo leerlo</h3><p>Si una restricción no está activa, su precio sombra suele ser 0: tener más de ese recurso no ayuda. Si una restricción está activa, el recurso está “apretando” y puede tener valor.</p><div class="warn"><b>Ojo:</b> precio sombra solo vale dentro del rango permitido. Fuera de ese rango, la base puede cambiar y se debe recalcular.</div>`,
branch:`<h2>6. Branch and Bound</h2><p>Branch and Bound se usa cuando una o más variables deben ser enteras. Primero se resuelve la relajación lineal, es decir, el mismo modelo sin la condición entera. Si la solución ya es entera, terminó. Si no, se divide el problema en ramas.</p>${T(['Paso','Acción'],[['1','Resolver relajación lineal'],['2','Si la solución es entera, guardar como incumbente'],['3','Si alguna variable es fraccionaria, ramificar: x ≤ piso y x ≥ techo'],['4','Resolver cada subproblema'],['5','Podar por infactibilidad, por cota o por integralidad'],['6','Elegir la mejor solución entera encontrada']])}<h3>Maximización vs minimización</h3><p>En maximización, una rama se poda por cota si su mejor valor relajado no puede superar al mejor entero actual. En minimización, se poda si su valor relajado no puede mejorar el mejor costo entero actual.</p><div class="formula">Si x₁ = 3,7 → ramas: x₁ ≤ 3  y  x₁ ≥ 4</div>`,
transporte:`<h2>7. Transporte y Transbordo</h2><p>Transporte decide cuánto enviar desde orígenes a destinos. Transbordo agrega nodos intermedios, por ejemplo bodegas o centros de distribución, que reciben y luego envían.</p><h3>Transporte clásico</h3>${T(['Elemento','Significado'],[['Oferta','Cantidad disponible en cada origen'],['Demanda','Cantidad requerida en cada destino'],['Costo cᵢⱼ','Costo de enviar una unidad del origen i al destino j'],['Variable xᵢⱼ','Cantidad enviada desde i hacia j']])}<div class="formula">Min Z = Σ cᵢⱼ xᵢⱼ\nΣⱼ xᵢⱼ = ofertaᵢ\nΣᵢ xᵢⱼ = demandaⱼ\nxᵢⱼ ≥ 0</div><h3>Vogel</h3><p>Vogel genera una solución inicial buena. Calcula penalidades fila/columna, elige la mayor penalidad, asigna en el menor costo de esa fila/columna y actualiza oferta/demanda.</p><h3>MODI o simplex de transporte</h3><p>Después de Vogel, MODI revisa optimalidad con potenciales <span class="math">uᵢ</span> y <span class="math">vⱼ</span>. Para celdas ocupadas: <span class="math">uᵢ + vⱼ = cᵢⱼ</span>. Para celdas vacías: <span class="math">Δᵢⱼ = cᵢⱼ - uᵢ - vⱼ</span>. En minimización, si todos los Δ son ≥ 0, la solución es óptima.</p><h3>Transbordo</h3><p>En un nodo intermedio se cumple balance:</p><div class="formula">Lo que entra + oferta propia = lo que sale + demanda propia</div><p>Por eso transbordo no es otro mundo: es transporte con más nodos y ecuaciones de conservación de flujo.</p>`,
hungaro:`<h2>8. Método húngaro</h2><p>El método húngaro resuelve problemas de asignación: una persona a una tarea, una máquina a un trabajo, un vendedor a una zona, etc. Es un caso especial de transporte donde cada origen tiene oferta 1 y cada destino demanda 1.</p><h3>Para minimizar</h3>${T(['Paso','Acción'],[['1','Restar el menor valor de cada fila a toda la fila'],['2','Restar el menor valor de cada columna a toda la columna'],['3','Cubrir todos los ceros con el menor número de líneas'],['4','Si el número de líneas es n, asignar'],['5','Si faltan líneas, ajustar la matriz y repetir']])}<h3>Para maximizar</h3><p>Primero se transforma a minimización:</p><div class="formula">costo transformado = mayor valor de la matriz - valor original</div><p>Luego se aplica el método húngaro normal. Al final se evalúa con la matriz original de beneficios.</p><div class="warn"><b>Error típico:</b> asignar ceros sin revisar que no se repitan filas ni columnas.</div>`
};
const examples={
formulacion:`<h2>Ejercicios explicados: Formulación</h2><div class="example"><h3>Ejercicio 1: producción y compra con demanda</h3><p>Una empresa debe satisfacer 400 unidades de A y 300 de B. Puede producir A y B, o comprar unidades. Producir A cuesta 8 y comprar A cuesta 11. Producir B cuesta 10 y comprar B cuesta 13. Hay 500 horas disponibles. A requiere 1 h y B 2 h.</p><div class="steps"><div class="step"><h4>Variables</h4><p><span class="math">x_A</span>: unidades A producidas. <span class="math">y_A</span>: unidades A compradas. <span class="math">x_B</span>: unidades B producidas. <span class="math">y_B</span>: unidades B compradas.</p></div><div class="step"><h4>Objetivo</h4><div class="formula">Min Z = 8x_A + 11y_A + 10x_B + 13y_B</div></div><div class="step"><h4>Demanda</h4><p>La demanda se debe satisfacer exactamente con producción más compra.</p><div class="formula">x_A + y_A = 400\nx_B + y_B = 300</div></div><div class="step"><h4>Capacidad</h4><div class="formula">1x_A + 2x_B ≤ 500</div></div><div class="step"><h4>No negatividad</h4><div class="formula">x_A,y_A,x_B,y_B ≥ 0</div></div></div></div><div class="example"><h3>Ejercicio 2: inventario multiperíodo</h3><p>Demandas por 3 meses: 80, 120, 90. Producción máxima 100 por mes. Inventario inicial 20. Costo producción 50. Costo inventario 5 al final de cada mes.</p>${T(['Mes','Entrada','Salida','Inventario final'],[['1','I₀ + x₁','80','I₁'],['2','I₁ + x₂','120','I₂'],['3','I₂ + x₃','90','I₃']])}<div class="steps"><div class="step"><h4>Variables</h4><p><span class="math">x_t</span> producción del mes t; <span class="math">I_t</span> inventario al final del mes t.</p></div><div class="step"><h4>Balance de inventario</h4><div class="formula">20 + x₁ = 80 + I₁\nI₁ + x₂ = 120 + I₂\nI₂ + x₃ = 90 + I₃</div></div><div class="step"><h4>Capacidad</h4><div class="formula">x₁,x₂,x₃ ≤ 100</div></div><div class="step"><h4>Objetivo</h4><div class="formula">Min Z = 50(x₁+x₂+x₃)+5(I₁+I₂+I₃)</div></div></div></div>`,
grafico:`<h2>Ejercicios explicados: Método gráfico</h2><div class="example"><h3>Ejercicio 1: maximización con dos restricciones</h3><p>Maximizar <span class="math">Z=3x₁+2x₂</span></p><div class="formula">2x₁+x₂ ≤ 8\nx₁+2x₂ ≤ 8\nx₁,x₂ ≥ 0</div><div class="twoColSteps"><div><div class="steps"><div class="step"><h4>Recta 1</h4><p><span class="math">2x₁+x₂=8</span>. Interceptos: si x₁=0 → x₂=8. Si x₂=0 → x₁=4.</p></div><div class="step"><h4>Recta 2</h4><p><span class="math">x₁+2x₂=8</span>. Interceptos: (0,4) y (8,0).</p></div><div class="step"><h4>Intersección</h4><p>Resolver sistema: <span class="math">2x₁+x₂=8</span> y <span class="math">x₁+2x₂=8</span>. Resultado: <span class="math">x₁=8/3, x₂=8/3</span>.</p></div><div class="step"><h4>Evaluar vértices</h4>${T(['Vértice','Z=3x₁+2x₂'],[['(0,0)','0'],['(4,0)','12'],['(8/3,8/3)','40/3 = 13,33'],['(0,4)','8']])}</div><div class="step"><h4>Conclusión</h4><p>Óptimo: <span class="math">(8/3,8/3)</span>, <span class="math">Z*=40/3</span>.</p></div></div></div><div><canvas id="graphExample" class="graphCanvas" width="520" height="420"></canvas><p class="small muted">Gráfico generado: región factible sombreada y vértice óptimo marcado.</p></div></div></div>`,
estandar:`<h2>Ejercicios explicados: Forma estándar</h2><div class="example"><h3>Ejercicio 1: variable con cota inferior</h3><p>Minimizar <span class="math">Z=6x₁+3x₂</span>, con <span class="math">x₁≥-1</span> y <span class="math">x₂≥1</span>.</p><div class="steps"><div class="step"><h4>Transformar variables</h4><p>Como x₁ puede partir en -1, define <span class="math">x₁'=x₁+1</span>, entonces <span class="math">x₁=x₁'-1</span>. Como x₂≥1, define <span class="math">x₂'=x₂-1</span>, entonces <span class="math">x₂=x₂'+1</span>.</p></div><div class="step"><h4>Reemplazar objetivo</h4><div class="formula">Z = 6(x₁'-1)+3(x₂'+1) = 6x₁'+3x₂'-3</div><p>Para resolver puedes usar <span class="math">Z'=6x₁'+3x₂'</span> y al final recordar la constante.</p></div><div class="step"><h4>Convertir restricciones</h4><p>Si queda una restricción ≥, se resta excedente y si hace falta se agrega artificial.</p></div></div></div>`,
simplex:`<h2>Ejercicios explicados: Simplex, Big M y Dual</h2><div class="example"><h3>Ejercicio 1: Simplex dual con tablas</h3><p>Resolver por simplex dual:</p><div class="formula">Min Z' = 6x₁ + 3x₂\ns.a. -2x₁ - x₂ + s₁ = -3\n      x₁ + x₂ + s₂ = 6\n      x₁,x₂,s₁,s₂ ≥ 0</div><p>La tabla parte con un lado derecho negativo en la fila de s₁, por eso usamos dual.</p><h4>Tabla inicial</h4>${T(['Base','x₁','x₂','s₁','s₂','b'],[['Z','-6','-3','0','0','0'],['s₁','-2','-1','1','0','-3'],['s₂','1','1','0','1','6']])}<div class="steps"><div class="step"><h4>Elegir fila que sale</h4><p>En dual se elige el b más negativo. Sale <span class="math">s₁</span> porque b=-3.</p></div><div class="step"><h4>Elegir columna que entra</h4><p>Miramos coeficientes negativos en la fila s₁: -2 en x₁ y -1 en x₂. Usando la regla del cociente dual, entra <span class="math">x₂</span>.</p></div><div class="step"><h4>Pivote</h4><p>Pivote = -1. Se divide la fila s₁ por -1 para que el pivote quede 1.</p></div></div><h4>Tabla después del pivote</h4>${T(['Base','x₁','x₂','s₁','s₂','b'],[['Z','0','0','-3','0','9'],['x₂','2','1','-1','0','3'],['s₂','-1','0','1','1','3']])}<div class="callout ok"><b>Conclusión:</b> todos los b son ≥ 0 y la fila Z cumple condición de optimalidad. Solución: x₂=3, x₁=0, Z'=9. Si había constante, se ajusta al final.</div></div><div class="example"><h3>Ejercicio 2: Big M explicado</h3><p>Restricción tipo ≥:</p><div class="formula">2x₁+x₂ ≥ 3</div><div class="steps"><div class="step"><h4>Restar excedente</h4><div class="formula">2x₁+x₂-s₁ = 3</div></div><div class="step"><h4>Agregar artificial</h4><div class="formula">2x₁+x₂-s₁+a₁ = 3</div></div><div class="step"><h4>Castigar artificial</h4><p>Si es minimización, se usa <span class="math">+M a₁</span> en el objetivo. La artificial debe desaparecer al final.</p></div></div></div>`,
sensibilidad:`<h2>Ejercicios explicados: Sensibilidad</h2><div class="example"><h3>Ejercicio 1: precio sombra</h3><p>Supón que la restricción de horas tiene precio sombra 4 y rango válido de disponibilidad entre 80 y 120. La disponibilidad actual es 100 y Z*=500.</p>${T(['Cambio','¿Está dentro del rango?','Nuevo Z'],[['Aumentar a 105','Sí','500 + 4(5)=520'],['Bajar a 90','Sí','500 + 4(-10)=460'],['Aumentar a 130','No','No se puede usar directamente el precio sombra']])}<div class="callout"><b>Idea:</b> el precio sombra es una pendiente local. Sirve dentro del rango, no para cualquier cambio.</div></div><div class="example"><h3>Ejercicio 2: costo reducido y solución múltiple</h3><p>Si una variable no básica tiene costo reducido 0, puede entrar a la base sin cambiar Z. Eso indica solución alternativa óptima.</p></div>`,
branch:`<h2>Ejercicios explicados: Branch and Bound</h2><div class="example"><h3>Ejercicio 1: árbol de ramificación</h3><p>Maximizar <span class="math">Z=5x₁+4x₂</span>, con solución relajada inicial <span class="math">x₁=2,5</span>, <span class="math">x₂=3</span>, <span class="math">Z=24,5</span>. Se requiere x₁ y x₂ enteras.</p><div class="steps"><div class="step"><h4>Solución relajada</h4><p>No es entera porque x₁=2,5. Entonces se ramifica en x₁≤2 y x₁≥3.</p></div><div class="step"><h4>Rama izquierda</h4><p>Con x₁≤2 se resuelve la relajación. Supón que da x₁=2, x₂=3, Z=22. Es entera, queda como incumbente.</p></div><div class="step"><h4>Rama derecha</h4><p>Con x₁≥3 supón que la relajación da Z=21. Como es maximización y 21 no supera el incumbente 22, se poda por cota.</p></div></div><div class="svgbox"><svg width="100%" height="250" viewBox="0 0 760 250"><rect x="280" y="20" width="200" height="58" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="45" text-anchor="middle" font-weight="700">Nodo 0</text><text x="380" y="66" text-anchor="middle">x₁=2,5; Z=24,5</text><line x1="350" y1="78" x2="210" y2="135" stroke="#334155"/><line x1="410" y1="78" x2="550" y2="135" stroke="#334155"/><rect x="80" y="135" width="240" height="78" rx="12" fill="#dcfce7" stroke="#059669"/><text x="200" y="160" text-anchor="middle" font-weight="700">x₁ ≤ 2</text><text x="200" y="181" text-anchor="middle">Entera: Z=22</text><text x="200" y="202" text-anchor="middle">Incumbente</text><rect x="450" y="135" width="240" height="78" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="570" y="160" text-anchor="middle" font-weight="700">x₁ ≥ 3</text><text x="570" y="181" text-anchor="middle">Z=21</text><text x="570" y="202" text-anchor="middle">Poda por cota</text></svg></div></div>`,
transporte:`<h2>Ejercicios explicados: Transporte y Transbordo</h2><div class="example"><h3>Ejercicio 1: Vogel con tablas paso a paso</h3><p>Resolver la solución inicial por Vogel.</p>${transportationTable({costs:[[8,6,10],[9,7,4],[3,4,2]],supply:[20,30,25],demand:[25,30,20]})}<div class="steps"><div class="step"><h4>Revisar balance</h4><p>Oferta total = 20+30+25=75. Demanda total = 25+30+20=75. Está balanceado.</p></div><div class="step"><h4>Calcular penalidades iniciales</h4>${T(['Fila/Columna','Dos menores','Penalidad'],[['O1','6 y 8','2'],['O2','4 y 7','3'],['O3','2 y 3','1'],['D1','3 y 8','5'],['D2','4 y 6','2'],['D3','2 y 4','2']])}<p>La mayor penalidad es D1=5. Dentro de D1, el menor costo es O3-D1 con costo 3.</p></div><div class="step"><h4>Asignar en O3-D1</h4><p>Oferta O3=25 y demanda D1=25. Asignamos 25. Se agotan simultáneamente O3 y D1.</p>${transportationTable({costs:[[8,6,10],[9,7,4],[3,4,2]],supply:[20,30,0],demand:[0,30,20]},{'2-0':25},['2-0'])}</div><div class="step"><h4>Recalcular con tabla reducida</h4>${T(['Fila/Columna restante','Dos menores','Penalidad'],[['O1','6 y 10','4'],['O2','4 y 7','3'],['D2','6 y 7','1'],['D3','4 y 10','6']])}<p>La mayor penalidad ahora es D3=6. Menor costo en D3: O2-D3, costo 4.</p></div><div class="step"><h4>Asignar en O2-D3</h4><p>Oferta O2=30, demanda D3=20. Asignamos 20. D3 se satisface y O2 queda con 10.</p>${transportationTable({costs:[[8,6,10],[9,7,4],[3,4,2]],supply:[20,10,0],demand:[0,30,0]},{'2-0':25,'1-2':20},['1-2'])}</div><div class="step"><h4>Completar lo restante</h4><p>Solo queda D2 con demanda 30. O1 ofrece 20 y O2 ofrece 10. Asignamos O1-D2=20 y O2-D2=10.</p>${transportationTable({costs:[[8,6,10],[9,7,4],[3,4,2]],supply:[0,0,0],demand:[0,0,0]},{'2-0':25,'1-2':20,'0-1':20,'1-1':10})}</div><div class="step"><h4>Calcular costo total</h4><div class="formula">Z = 25(3)+20(4)+20(6)+10(7) = 75+80+120+70 = 345</div></div></div></div><div class="example"><h3>Ejercicio 2: MODI sobre la solución</h3><p>Usamos las celdas ocupadas: O3-D1, O2-D3, O1-D2, O2-D2.</p><div class="steps"><div class="step"><h4>Asignar potenciales</h4><p>Fijamos u₁=0. Para celdas ocupadas se cumple uᵢ+vⱼ=cᵢⱼ.</p>${T(['Celda ocupada','Ecuación'],[['O1-D2','u₁+v₂=6 → v₂=6'],['O2-D2','u₂+v₂=7 → u₂=1'],['O2-D3','u₂+v₃=4 → v₃=3'],['O3-D1','u₃+v₁=3']])}</div><div class="step"><h4>Problema de degeneración</h4><p>Como hay 3 orígenes y 3 destinos, se necesitan m+n-1=5 celdas ocupadas. Solo tenemos 4 porque una fila y columna se agotaron al mismo tiempo. Se agrega una asignación ε en una celda permitida para completar la base.</p></div></div></div><div class="example"><h3>Ejercicio 3: transbordo como balance</h3><p>Fábrica F envía a bodega B y cliente C. La bodega recibe y envía.</p>${T(['Nodo','Ecuación de balance'],[['Fábrica F','salidas ≤ oferta'],['Bodega B','entradas = salidas'],['Cliente C','entradas = demanda']])}<div class="formula">x_FB = cantidad enviada F→B\nx_BC = cantidad enviada B→C\nBalance bodega: x_FB = x_BC</div></div>`,
hungaro:`<h2>Ejercicios explicados: Método húngaro</h2><div class="example"><h3>Ejercicio 1: minimizar costos</h3><p>Matriz de costos:</p>${matrixTable('Matriz original',[[9,2,7],[6,4,3],[5,8,1]])}<div class="steps"><div class="step"><h4>Restar mínimo por fila</h4><p>Mínimos: fila 1 = 2, fila 2 = 3, fila 3 = 1.</p>${matrixTable('Después de reducir filas',[[7,0,5],[3,1,0],[4,7,0]])}</div><div class="step"><h4>Restar mínimo por columna</h4><p>Mínimos de columnas: col 1=3, col 2=0, col 3=0.</p>${matrixTable('Después de reducir columnas',[[4,0,5],[0,1,0],[1,7,0]])}</div><div class="step"><h4>Asignar ceros sin repetir fila/columna</h4><p>Una asignación posible: P1→T2, P2→T1, P3→T3.</p>${matrixTable('Ceros asignados',[[4,'0 ✓',5],['0 ✓',1,0],[1,7,'0 ✓']],['0-1','1-0','2-2'])}</div><div class="step"><h4>Evaluar en matriz original</h4><div class="formula">Costo = P1T2 + P2T1 + P3T3 = 2 + 6 + 1 = 9</div></div></div></div><div class="example"><h3>Ejercicio 2: maximizar beneficios</h3><p>Beneficios:</p>${matrixTable('Matriz de beneficios',[[12,8,15],[10,9,7],[13,6,11]])}<div class="steps"><div class="step"><h4>Transformar a costos</h4><p>Máximo de la matriz = 15. Nuevo costo = 15 - beneficio.</p>${matrixTable('Matriz transformada',[[3,7,0],[5,6,8],[2,9,4]])}</div><div class="step"><h4>Aplicar húngaro como minimización</h4><p>Luego de reducir filas/columnas y asignar, se obtiene una combinación. Siempre evalúa el resultado final en la matriz original de beneficios, no en la transformada.</p></div></div></div>`
};

sensibilidad:{title:'Guía: sensibilidad',steps:[['Si precio sombra=4 y aumentas 5 unidades dentro del rango, ¿cuánto cambia Z?','20','Correcto: 4×5=20.'],['Si el cambio está fuera del rango, ¿puedo usar directo el precio sombra?','no','Correcto. Hay que recalcular o hacer nuevo análisis.']]},
branch:{title:'Guía: Branch and Bound',steps:[['Si x=4,6, la rama izquierda es x ≤ ...','4','Correcto: piso(4,6)=4.'],['La rama derecha es x ≥ ...','5','Correcto: techo(4,6)=5.'],['En maximización, si una rama tiene cota 30 y el incumbente es 35, ¿se poda?','si','Correcto. No puede mejorar al incumbente.']]},
transporte:{title:'Guía: Vogel paso a paso',steps:[['Oferta total 20+30+25. Ingresa el total.','75','Correcto.'],['Demanda total 25+30+20. Ingresa el total.','75','Correcto, está balanceado.'],['Penalidad de D1 con costos 8,9,3. Dos menores: 3 y 8. Penalidad = ...','5','Correcto.'],['Mayor penalidad inicial: ¿D1, D2, D3, O1, O2 u O3?','d1','Correcto: D1 tiene penalidad 5.'],['En D1, el menor costo está en O3-D1. ¿Cuánto asignas?','25','Correcto: min(oferta O3=25, demanda D1=25).'],['Después, D3 tiene penalidad 6. En O2-D3 asignas...','20','Correcto: min(oferta O2=30, demanda D3=20).'],['Costo final: 25(3)+20(4)+20(6)+10(7). Resultado.','345','Correcto.']]},
hungaro:{title:'Guía: método húngaro',steps:[['Fila 1 [9,2,7]. ¿Cuál es el mínimo?','2','Correcto.'],['Después de restar 2 a fila 1 queda [7,0,5]. Ingresa el segundo valor.','0','Correcto.'],['En maximización, si el mayor beneficio es 15 y una celda vale 12, el costo transformado es...','3','Correcto: 15−12=3.']]}
};
function guidedBlock(u){const g=guided[u]; return `<h2>Práctica guiada</h2><p>Resuelve como en certamen. La app te hace avanzar una decisión a la vez.</p><div class="card" style="box-shadow:none"><h3>${g.title}</h3><div id="guidedArea"></div></div>`}
function normalize(x){return String(x).trim().toLowerCase().replace(',', '.').replace(/í/g,'i').replace(/á/g,'a').replace(/é/g,'e').replace(/ó/g,'o').replace(/ú/g,'u').replace(/\s+/g,'')}
function initGuided(u){window.currentGuided={u,idx:0}; renderGuidedStep();}
function renderGuidedStep(){const g=guided[window.currentGuided.u]; const i=window.currentGuided.idx; const el=document.getElementById('guidedArea'); if(!el)return; if(i>=g.steps.length){el.innerHTML=`<div class="callout ok"><b>Completado.</b> Terminaste esta práctica guiada paso a paso.</div><button class="btn secondary" onclick="initGuided('${window.currentGuided.u}')">Reiniciar</button>`; saveProgress(window.currentGuided.u+'_guiada'); return;} const s=g.steps[i]; el.innerHTML=`<p><b>Paso ${i+1} de ${g.steps.length}:</b> ${s[0]}</p><input class="input" id="ans" placeholder="Escribe tu respuesta"><div class="btnrow"><button class="btn blue" onclick="checkGuided()">Revisar</button><button class="btn secondary" onclick="showGuidedHint()">Pista</button></div><div id="fb" class="feedback"></div><div class="progress" style="margin-top:12px"><div class="bar" style="width:${100*i/g.steps.length}%"></div></div>`;}
function checkGuided(){const g=guided[window.currentGuided.u];const i=window.currentGuided.idx;const ans=normalize(document.getElementById('ans').value);const exp=normalize(g.steps[i][1]);const fb=document.getElementById('fb');let ok=false;if(!isNaN(parseFloat(exp))&&!isNaN(parseFloat(ans))){ok=Math.abs(parseFloat(ans)-parseFloat(exp))<0.02}else ok=ans===exp||ans.includes(exp)||exp.includes(ans);fb.className='feedback show '+(ok?'good':'no');fb.innerHTML=ok?`✅ ${g.steps[i][2]}<div class="btnrow"><button class="btn green" onclick="window.currentGuided.idx++;renderGuidedStep()">Siguiente paso</button></div>`:`❌ Todavía no. Revisa el paso anterior y vuelve a calcular. No avances por memoria: escribe el cálculo en papel y luego responde.`;}
function showGuidedHint(){const fb=document.getElementById('fb');fb.className='feedback show';fb.style.background='#fef3c7';fb.style.color='#92400e';fb.innerHTML='Pista: revisa qué dato cambió en la tabla y usa la regla del método, no solo el resultado final.';}
function freeBlock(u){return `<h2>Ejercicios sin ayuda</h2><p>Desarrolla aquí mismo. Escribe tus cálculos, tablas o conclusiones. Puedes guardar tu avance y ver una pista solo si te quedas pegado.</p>${freeSpecial(u)}<div class="card" style="box-shadow:none"><h3>Tu desarrollo</h3><textarea class="input textarea" id="freeText_${u}" placeholder="Desarrolla aquí paso a paso: variables, tablas, operaciones, gráfico, iteraciones, conclusión..."></textarea><div class="btnrow"><button class="btn blue" onclick="saveFree('${u}')">Guardar avance</button><button class="btn secondary" onclick="loadFree('${u}')">Cargar avance</button><button class="btn amber" onclick="toggleHint('${u}')">Ver pista</button><button class="btn red" onclick="toggleSolution('${u}')">Ver solución</button></div><div id="hint_${u}" class="callout warn hidden">${freeHints[u]||'Parte por identificar variables, restricciones y regla de decisión del método.'}</div><div id="sol_${u}" class="callout ok hidden">${freeSolutions[u]||'Compara tu desarrollo con los pasos explicados de la unidad.'}</div></div>`}
function saveFree(u){localStorage.setItem('free_'+u,document.getElementById('freeText_'+u).value);saveProgress(u+'_libre');alert('Avance guardado en este dispositivo.');}
function loadFree(u){document.getElementById('freeText_'+u).value=localStorage.getItem('free_'+u)||'';}
function toggleHint(u){document.getElementById('hint_'+u).classList.toggle('hidden')}
function toggleSolution(u){document.getElementById('sol_'+u).classList.toggle('hidden')}
function freeSpecial(u){if(u==='grafico')return `<div class="example"><h3>Ejercicio gráfico interactivo</h3><p>Grafica y resuelve: Max Z=4x₁+3x₂, sujeto a x₁+x₂≤6, 2x₁+x₂≤8, x₁,x₂≥0. Haz clic en el gráfico para marcar vértices que quieras evaluar.</p><canvas id="freeGraph" class="graphCanvas" width="560" height="420"></canvas><div id="pointsBox" class="small muted">Puntos marcados: ninguno.</div></div>`; if(u==='transporte')return `<div class="example"><h3>Tabla editable: practica Vogel</h3><p>Usa esta tabla como borrador. Marca penalidades y asignaciones en tu desarrollo.</p>${transportationTable({costs:[[4,8,8],[16,24,16],[8,16,24]],supply:[76,82,77],demand:[72,102,61]})}</div>`; if(u==='simplex')return `<div class="example"><h3>Tabla editable conceptual</h3><p>Copia la tabla inicial, decide fila/columna pivote y escribe cada iteración en tu desarrollo.</p>${T(['Base','x₁','x₂','s₁','s₂','b'],[['Z','-6','-3','0','0','0'],['s₁','-2','-1','1','0','-3'],['s₂','1','1','0','1','6']])}</div>`; if(u==='hungaro')return `<div class="example"><h3>Matriz editable conceptual</h3><p>Reduce filas y columnas. Luego escribe la asignación sin repetir filas ni columnas.</p>${matrixTable('Matriz',[[7,5,9],[8,7,6],[6,4,8]])}</div>`; return `<div class="example"><h3>Enunciado</h3><p>${freeStatements[u]||'Resuelve un ejercicio similar a los explicados en esta unidad.'}</p></div>`}
const freeStatements={formulacion:'Una empresa produce A y B. A deja utilidad 30 y B deja 40. A usa 2 horas de máquina y B usa 1. Hay 100 horas. A usa 1 kg y B usa 3 kg. Hay 90 kg. Formula el modelo para maximizar utilidad.',estandar:'Convierte a forma estándar: Min Z=2x₁+5x₂, s.a. x₁+x₂≥10, 2x₁+x₂≤18, x₁ libre, x₂≥0.',sensibilidad:'Una restricción tiene precio sombra 7 y rango de b entre 40 y 60. Actualmente b=50 y Z=300. Calcula Z si b=56, b=45 y explica qué pasa si b=70.',branch:'Una relajación de maximización da x₁=3,4, x₂=2, Z=28. x₁ debe ser entera. Dibuja las ramas, indica restricciones nuevas y explica cuándo podarías.',};
const freeHints={formulacion:'Define x_A y x_B. La utilidad va en Max Z. Las disponibilidades son ≤.',grafico:'Calcula interceptos, luego intersecciones. Evalúa Z en cada vértice marcado.',estandar:'Para x₁ libre usa x₁=x₁⁺−x₁⁻. Para ≥ resta excedente y agrega artificial si vas a simplex.',simplex:'En dual parte por la fila con b negativo. Revisa coeficientes negativos en esa fila.',sensibilidad:'Nuevo Z = Z actual + precio sombra × cambio, solo dentro del rango.',branch:'Para x₁=3,4: ramas x₁≤3 y x₁≥4.',transporte:'Primero verifica oferta=demanda. Luego penalidades: diferencia entre los dos costos menores.',hungaro:'Resta mínimos por filas, luego por columnas. Asigna ceros sin repetir filas/columnas.'};
const freeSolutions={formulacion:'Max Z=30x_A+40x_B; 2x_A+x_B≤100; x_A+3x_B≤90; x_A,x_B≥0.',grafico:'Vértices principales: (0,0), (0,6), (2,4), (4,0). Z: 0,18,20,16. Óptimo (2,4), Z=20.',estandar:'x₁=x₁⁺−x₁⁻. x₁⁺−x₁⁻+x₂−s₁+a₁=10; 2x₁⁺−2x₁⁻+x₂+s₂=18; variables ≥0.',simplex:'La fila que sale es s₁ por b=-3. Entra x₂ en el ejemplo guiado. Pivotear entrega x₂=3 y b no negativos.',sensibilidad:'b=56: Z=342. b=45: Z=265. b=70 está fuera de rango, no se usa directo.',branch:'Ramas: x₁≤3 y x₁≥4. Se resuelven relajaciones. Podas por infactible, entero o cota.',transporte:'En Vogel, calcula penalidades cada vez que taches una fila/columna. No mantengas penalidades viejas.',hungaro:'La solución depende de las reducciones; evalúa siempre con la matriz original.'};
function drawGraphExample(){const c=document.getElementById('graphExample'); if(!c)return; const ctx=c.getContext('2d'),W=c.width,H=c.height; ctx.clearRect(0,0,W,H); drawAxes(ctx,W,H,10); function P(x,y){return [50+x*45,H-50-y*35]} ctx.strokeStyle='#2563eb';ctx.lineWidth=3; drawLine(ctx,P(0,8),P(4,0)); ctx.strokeStyle='#059669'; drawLine(ctx,P(0,4),P(8,0)); ctx.fillStyle='rgba(37,99,235,.15)'; let pts=[[0,0],[4,0],[8/3,8/3],[0,4]].map(p=>P(p[0],p[1])); ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill(); ctx.fillStyle='#dc2626'; circle(ctx,...P(8/3,8/3),7); ctx.fillStyle='#0f172a'; ctx.font='14px Arial'; ctx.fillText('Óptimo (8/3,8/3)',P(8/3,8/3)[0]+10,P(8/3,8/3)[1]-10);}
function drawAxes(ctx,W,H,max){ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.font='12px Arial';ctx.fillStyle='#64748b'; for(let i=0;i<=max;i++){let x=50+i*45,y=H-50-i*35;ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,H-50);ctx.stroke();ctx.fillText(i,x-3,H-30);ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-20,y);ctx.stroke();ctx.fillText(i,28,y+4)}ctx.strokeStyle='#0f172a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(50,20);ctx.lineTo(50,H-50);ctx.lineTo(W-20,H-50);ctx.stroke();}
function drawLine(ctx,a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
let freePts=[];function drawFreeGraph(){const c=document.getElementById('freeGraph'); if(!c)return; const ctx=c.getContext('2d'),W=c.width,H=c.height; ctx.clearRect(0,0,W,H); drawAxes(ctx,W,H,9); function P(x,y){return [50+x*50,H-50-y*45]} ctx.strokeStyle='#2563eb';ctx.lineWidth=3; drawLine(ctx,P(0,6),P(6,0)); ctx.strokeStyle='#059669'; drawLine(ctx,P(0,8),P(4,0)); ctx.fillStyle='rgba(5,150,105,.13)'; let verts=[[0,0],[0,6],[2,4],[4,0]].map(p=>P(p[0],p[1])); ctx.beginPath();verts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill(); ctx.fillStyle='#dc2626'; freePts.forEach(p=>circle(ctx,p.x,p.y,6)); c.onclick=e=>{const rect=c.getBoundingClientRect(); freePts.push({x:(e.clientX-rect.left)*(c.width/rect.width),y:(e.clientY-rect.top)*(c.height/rect.height)}); document.getElementById('pointsBox').textContent='Puntos marcados: '+freePts.length+' (usa el área de desarrollo para escribir sus coordenadas aproximadas y evaluar Z).'; drawFreeGraph();};}
function quiz(){const qs=[['¿Cuándo se usa método gráfico?','Cuando hay dos variables principales','Cuando hay muchas variables','Solo para enteros'],['En Vogel, la penalidad es...','Diferencia entre los dos menores costos','El costo más alto','La suma de ofertas'],['En Branch and Bound, si x=2,7 se ramifica en...','x≤2 y x≥3','x≤3 y x≥2','x=2 y x=3'],['En húngaro de maximización primero se...','Transforma a minimización','Suman todas las filas','Eliminan los ceros'],['En sensibilidad, el precio sombra vale...','Solo dentro de su rango','Para cualquier cambio','Solo si la variable es entera']]; return `<section class="card"><h2>Quiz rápido</h2><p>Marca respuestas y revisa. Sirve para comprobar si entendiste la lógica de cada método.</p>${qs.map((q,i)=>`<div class="example"><h3>${i+1}. ${q[0]}</h3>${q.slice(1).map((a,j)=>`<label class="checkline"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('')}<button class="btn blue" onclick="gradeQuiz()">Revisar quiz</button><div id="quizFb" class="feedback"></div></section>`}
function gradeQuiz(){let ans=[0,0,0,0,0],score=0;ans.forEach((a,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`); if(v&&+v.value===a)score++}); const fb=document.getElementById('quizFb');fb.className='feedback show '+(score>=4?'good':'no');fb.innerHTML=`Resultado: ${score}/5. ${score>=4?'Vas bien.':'Repasa las unidades donde dudaste.'}`;}
function practice(){return `<section class="card"><h2>Práctica por método</h2><p>Elige un tema y la app te llevará a la práctica guiada correspondiente.</p><div class="grid grid4">${units.map(u=>`<button class="btn secondary" onclick="state.unit='${u[0]}';state.view='curso';state.page='guiada';render()">${u[1]}</button>`).join('')}</div></section>`}
function formulario(){return `<section class="card"><h2>Formulario compacto</h2><div class="grid grid2"><div class="card" style="box-shadow:none"><h3>Modelo lineal</h3><div class="formula">Max/Min Z = Σ cⱼxⱼ\nΣ aᵢⱼxⱼ ≤,=,≥ bᵢ\nxⱼ ≥ 0</div></div><div class="card" style="box-shadow:none"><h3>Transporte</h3><div class="formula">Min Z=Σcᵢⱼxᵢⱼ\nΣⱼxᵢⱼ=Ofertaᵢ\nΣᵢxᵢⱼ=Demandaⱼ</div></div><div class="card" style="box-shadow:none"><h3>MODI</h3><div class="formula">uᵢ+vⱼ=cᵢⱼ en celdas ocupadas\nΔᵢⱼ=cᵢⱼ-uᵢ-vⱼ\nMin: óptimo si Δᵢⱼ≥0</div></div><div class="card" style="box-shadow:none"><h3>Branch and Bound</h3><div class="formula">x*=k.f\nRamas: x≤⌊x*⌋ y x≥⌈x*⌉\nPodar: infactible, cota, entera</div></div><div class="card" style="box-shadow:none"><h3>Húngaro Max</h3><div class="formula">Costo transformado = max(matriz)-valor</div></div><div class="card" style="box-shadow:none"><h3>Sensibilidad</h3><div class="formula">Nuevo Z = Z* + precio sombra × Δb\nSolo dentro del rango válido</div></div></div></section>`}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))}let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn')?.classList.remove('hidden')});$('#installBtn')?.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}});
render();
</script>
