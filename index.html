<script>
const MODULES = [{"id": "formulacion", "icon": "🧩", "title": "Formulación de modelos", "subtitle": "Convertir un enunciado en variables, objetivo y restricciones.", "goal": "Aprender a leer un problema y escribir el modelo lineal completo.", "lecture": "\n<h3>1. Qué significa formular</h3>\n<p>Formular es transformar un problema escrito en un modelo matemático. En optimización lineal no basta con “sacar cuentas”; primero hay que ordenar la situación real. Un modelo bien formulado dice exactamente qué se decide, qué se quiere mejorar y qué límites existen.</p>\n<p>Todo modelo lineal tiene cuatro partes: <b>variables de decisión</b>, <b>función objetivo</b>, <b>restricciones</b> y <b>condiciones de signo</b>.</p>\n<div class=\"formula\">Variables: x<sub>i</sub> = decisión que se debe calcular<br>Objetivo: Max/Min Z = combinación lineal de las variables<br>Restricciones: recursos, demandas, capacidades, balances o condiciones del problema<br>Signo: x<sub>i</sub> ≥ 0, salvo que el enunciado indique otra cosa</div>\n<h3>2. Cómo reconocer las variables</h3>\n<p>La variable responde a la pregunta: <b>¿qué cantidad necesito decidir?</b> Si el enunciado habla de fabricar, comprar, transportar, contratar, almacenar, asignar o mezclar, ahí casi siempre está la variable.</p>\n<p>Una mala variable sería “ganancia” porque normalmente la ganancia se calcula. Una buena variable sería: <i>x<sub>1</sub> = unidades del producto A a fabricar durante la semana</i>.</p>\n<h3>3. Cómo elegir maximizar o minimizar</h3>\n<p>Se maximiza cuando el objetivo es utilidad, ingreso, beneficio, rendimiento o producción. Se minimiza cuando el objetivo es costo, tiempo, pérdida, distancia, desperdicio o riesgo.</p>\n<h3>4. Cómo escribir restricciones</h3>\n<p>Las restricciones se construyen con la lógica del enunciado. Si un recurso se consume y tiene disponibilidad máxima, se usa ≤. Si se debe cumplir una demanda mínima, se usa ≥. Si debe calzar exactamente, como inventario o balance, se usa =.</p>\n<table><tr><th>Frase del enunciado</th><th>Forma típica</th></tr><tr><td>“A lo más”, “no más de”, “capacidad máxima”</td><td>≤</td></tr><tr><td>“Al menos”, “mínimo”, “demanda requerida”</td><td>≥</td></tr><tr><td>“Debe ser igual”, “se satisface exactamente”, “balance”</td><td>=</td></tr></table>\n<h3>5. Plantilla universal</h3>\n<div class=\"formula\">Definir variables<br>Max/Min Z = c<sub>1</sub>x<sub>1</sub> + c<sub>2</sub>x<sub>2</sub> + ... + c<sub>n</sub>x<sub>n</sub><br>s.a.<br>a<sub>11</sub>x<sub>1</sub> + a<sub>12</sub>x<sub>2</sub> + ... ≤/≥/= b<sub>1</sub><br>...<br>x<sub>1</sub>, x<sub>2</sub>, ..., x<sub>n</sub> ≥ 0</div>\n<div class=\"note ok\"><b>Consejo de profesor:</b> antes de hacer fórmulas, subraya en el enunciado las palabras: producir, comprar, vender, demanda, máximo, mínimo, capacidad y costo.</div>\n", "explained": [{"title": "Ejercicio 1: producción con dos productos", "statement": "Una empresa fabrica mesas y sillas. Cada mesa deja $40 y cada silla $25. Una mesa usa 3 horas de madera y 2 horas de armado. Una silla usa 1 hora de madera y 2 horas de armado. Hay 90 horas de madera y 80 de armado. Formule el modelo para maximizar utilidad.", "steps": ["Definimos variables: x1 = mesas a fabricar; x2 = sillas a fabricar.", "Como se quiere utilidad, el objetivo es maximizar. Cada mesa aporta 40 y cada silla 25: Max Z = 40x1 + 25x2.", "Restricción de madera: 3x1 + 1x2 ≤ 90.", "Restricción de armado: 2x1 + 2x2 ≤ 80.", "No negatividad: x1, x2 ≥ 0."], "answer": "Max Z=40x1+25x2; s.a. 3x1+x2≤90, 2x1+2x2≤80, x1,x2≥0."}, {"title": "Ejercicio 2: demanda mínima", "statement": "Se producen dos alimentos A y B. Cada unidad de A aporta 4 proteínas y cuesta 3. Cada unidad de B aporta 2 proteínas y cuesta 1. Se requieren al menos 40 proteínas. Formule para minimizar costo.", "steps": ["Variables: x1 = unidades de A; x2 = unidades de B.", "Objetivo: minimizar costo, Min Z = 3x1 + x2.", "Demanda mínima de proteínas: 4x1 + 2x2 ≥ 40.", "Como son cantidades: x1,x2≥0.", "La clave es que “al menos” genera ≥."], "answer": "Min Z=3x1+x2; s.a. 4x1+2x2≥40; x1,x2≥0."}, {"title": "Ejercicio 3: mezcla", "statement": "Una mezcla debe tener al menos 60 kg. Se mezclan material A y B. A cuesta 8 por kg y B cuesta 5 por kg. Por calidad, B no puede superar 30 kg. Formule para minimizar costo.", "steps": ["Variables: xA = kg de material A; xB = kg de material B.", "Objetivo: Min Z = 8xA + 5xB.", "Peso mínimo de mezcla: xA + xB ≥ 60.", "Límite de B: xB ≤ 30.", "No negatividad: xA,xB≥0."], "answer": "Min Z=8xA+5xB; s.a. xA+xB≥60, xB≤30, xA,xB≥0."}, {"title": "Ejercicio 4: inventario básico", "statement": "Una empresa tiene 10 unidades iniciales, produce x unidades y debe satisfacer demanda de 35. Puede quedar inventario final I. Formule el balance.", "steps": ["Lo disponible es inventario inicial + producción = 10 + x.", "Lo que se usa o queda es demanda + inventario final = 35 + I.", "Balance: 10 + x = 35 + I.", "Si x e I son cantidades, x,I≥0.", "Este tipo de igualdad se repite en modelos por períodos."], "answer": "10+x=35+I, con x,I≥0."}, {"title": "Ejercicio 5: comprar o producir", "statement": "Se puede producir x unidades a costo 50 o comprar y unidades a costo 70. Se necesita satisfacer 100 unidades. Producción máxima 60. Formule para minimizar costo.", "steps": ["Variables: x = unidades producidas; y = unidades compradas.", "Objetivo: Min Z = 50x + 70y.", "Demanda exacta: x + y = 100.", "Producción máxima: x ≤ 60.", "No negatividad: x,y≥0."], "answer": "Min Z=50x+70y; s.a. x+y=100, x≤60, x,y≥0."}], "guided": [{"title": "Guía tipo certamen: formular producción", "intro": "Resuelve paso a paso. No escribas todo de una; la app te irá corrigiendo cada parte.", "steps": [{"q": "El enunciado dice: fabricar A y B. ¿Qué variable usarías para el producto A? Escribe algo como x1=A o x1=unidades de A.", "answers": ["x1=a", "x1=unidadesdea", "x1=unidadesproducto a", "x1=producto a"], "mode": "expr", "hint": "La variable debe representar la cantidad de A a fabricar.", "explain": "Correcto: x1 representa las unidades del producto A."}, {"q": "A deja utilidad 30 y B utilidad 45. ¿Cuál es la función objetivo de maximización?", "answers": ["maxz=30x1+45x2", "z=30x1+45x2", "30x1+45x2"], "mode": "expr", "hint": "Utilidad por producto multiplicada por cantidad.", "explain": "La función objetivo es Max Z = 30x1 + 45x2."}, {"q": "A usa 2 horas y B usa 3 horas. Hay máximo 120 horas. Escribe la restricción.", "answers": ["2x1+3x2<=120", "2x1+3x2≤120"], "mode": "expr", "hint": "Recurso consumido ≤ disponibilidad.", "explain": "2x1 + 3x2 ≤ 120."}, {"q": "A usa 4 kg y B usa 2 kg de material. Hay máximo 160 kg. Escribe la restricción.", "answers": ["4x1+2x2<=160", "4x1+2x2≤160"], "mode": "expr", "hint": "Material total usado por A y B no puede superar 160.", "explain": "4x1 + 2x2 ≤ 160."}, {"q": "Escribe la condición de no negatividad.", "answers": ["x1,x2>=0", "x1>=0,x2>=0", "x1≥0,x2≥0"], "mode": "expr", "hint": "Las cantidades no pueden ser negativas.", "explain": "x1, x2 ≥ 0."}]}], "solo": [{"q": "Una panadería produce pan A y B. Ganancias 20 y 15. A usa 2 kg harina y B 1 kg. Hay 100 kg. A usa 1 h y B 2 h. Hay 80 h. Formule.", "hint": "Variables primero; objetivo de ganancia; dos restricciones de recursos.", "solution": "x1=pan A, x2=pan B. Max Z=20x1+15x2; 2x1+x2≤100; x1+2x2≤80; x1,x2≥0."}, {"q": "Un proyecto requiere al menos 40 horas técnicas. Técnico A aporta 4 h/unidad y cuesta 30. Técnico B aporta 5 h/unidad y cuesta 35. Formule para minimizar costo.", "hint": "La frase “al menos” genera ≥.", "solution": "Min Z=30x1+35x2; 4x1+5x2≥40; x1,x2≥0."}, {"q": "Modelo de inventario: inventario inicial 12, producción x, demanda 50, inventario final I. Escriba balance.", "hint": "Disponible = demanda + inventario final.", "solution": "12+x=50+I; x,I≥0."}]}, {"id": "grafico", "icon": "📈", "title": "Método gráfico", "subtitle": "Resolver modelos de dos variables dibujando la región factible.", "goal": "Aprender a dibujar restricciones, encontrar vértices y evaluar Z.", "lecture": "\n<h3>1. Cuándo se usa</h3>\n<p>El método gráfico se usa cuando el problema tiene <b>dos variables</b>, normalmente x<sub>1</sub> y x<sub>2</sub>. La idea es dibujar todas las restricciones en un plano y encontrar la zona donde todas se cumplen al mismo tiempo.</p>\n<h3>2. Pasos del método gráfico</h3>\n<ol><li>Transforma cada restricción en igualdad para dibujar la recta.</li><li>Calcula interceptos: si x<sub>2</sub>=0 obtienes el corte con eje x; si x<sub>1</sub>=0 obtienes el corte con eje y.</li><li>Dibuja la recta.</li><li>Decide qué lado de la recta sirve usando un punto de prueba, normalmente (0,0).</li><li>La intersección de todos los lados válidos es la región factible.</li><li>Encuentra los vértices de la región factible.</li><li>Evalúa la función objetivo en cada vértice.</li><li>El mayor valor da el máximo; el menor valor da el mínimo.</li></ol>\n<h3>3. Intersección entre dos rectas</h3>\n<p>Cuando dos restricciones se cruzan, resuelves el sistema de ecuaciones. Ese punto puede ser un vértice si además cumple todas las restricciones.</p>\n<div class=\"formula\">a<sub>1</sub>x<sub>1</sub> + b<sub>1</sub>x<sub>2</sub> = c<sub>1</sub><br>a<sub>2</sub>x<sub>1</sub> + b<sub>2</sub>x<sub>2</sub> = c<sub>2</sub></div>\n<h3>4. Soluciones múltiples</h3><p>Hay soluciones múltiples cuando la recta de la función objetivo queda paralela a un lado completo de la región factible y el mismo valor óptimo se obtiene en más de un punto.</p>\n<div class=\"note warn\"><b>Error típico:</b> evaluar solo el cruce de restricciones y olvidar los puntos sobre los ejes.</div>\n", "explained": [{"title": "Ejercicio 1: máximo con dos restricciones", "statement": "Max Z=3x1+2x2; s.a. 2x1+x2≤8, x1+2x2≤8, x1,x2≥0.", "steps": ["Recta 1: 2x1+x2=8. Interceptos: x1=4 cuando x2=0; x2=8 cuando x1=0.", "Recta 2: x1+2x2=8. Interceptos: x1=8; x2=4.", "Región factible: bajo ambas rectas y en el primer cuadrante.", "Vértices: (0,0), (4,0), (8/3,8/3), (0,4). El cruce se obtiene resolviendo ambas ecuaciones.", "Evaluar Z: 0, 12, 40/3≈13,33, 8. Óptimo: (8/3,8/3) con Z=40/3."], "answer": "x1*=8/3, x2*=8/3, Z*=40/3."}, {"title": "Ejercicio 2: mínimo con cota inferior", "statement": "Min Z=4x1+x2; s.a. x1+x2≥6, x1≥2, x2≥0.", "steps": ["Dibuja x1+x2=6. Como es ≥, se toma el lado sobre la recta.", "La restricción x1≥2 deja el lado derecho de la recta vertical x1=2.", "Vértices candidatos: (2,4) y (6,0), considerando x2≥0.", "Evaluar: Z(2,4)=12; Z(6,0)=24.", "Como se minimiza, el óptimo es (2,4)."], "answer": "x1*=2, x2*=4, Z*=12."}, {"title": "Ejercicio 3: solución múltiple", "statement": "Max Z=2x1+2x2; s.a. x1+x2≤6, x1≤4, x2≤4, x≥0.", "steps": ["La función objetivo Z=2(x1+x2) es paralela a x1+x2=6.", "La región factible incluye el segmento entre (2,4) y (4,2) sobre x1+x2=6.", "En (2,4), Z=12. En (4,2), Z=12.", "Todo punto del segmento también da Z=12.", "Por lo tanto existen múltiples soluciones óptimas."], "answer": "Soluciones óptimas en el segmento x1+x2=6 entre (2,4) y (4,2)."}, {"title": "Ejercicio 4: región no acotada", "statement": "Max Z=x1+x2; s.a. x1−x2≤2, x1,x2≥0.", "steps": ["La restricción x1−x2≤2 equivale a x2≥x1−2.", "La región factible se extiende hacia arriba sin límite.", "Como Z=x1+x2 aumenta al subir x2, no existe máximo finito.", "El problema es no acotado.", "No se debe inventar un punto óptimo."], "answer": "Problema no acotado para maximización."}, {"title": "Ejercicio 5: infactibilidad", "statement": "x1+x2≤3 y x1+x2≥5, con x≥0.", "steps": ["La primera restricción exige estar bajo o sobre la recta x1+x2=3.", "La segunda exige estar sobre x1+x2=5.", "No existe punto que cumpla simultáneamente suma ≤3 y suma ≥5.", "La región factible es vacía.", "No hay solución factible."], "answer": "Problema infactible."}], "guided": [{"title": "Guía gráfica interactiva", "intro": "Usa el gráfico y responde paso a paso. Modelo: Max Z=3x1+2x2; 2x1+x2≤8; x1+2x2≤8; x≥0.", "graph": true, "steps": [{"q": "Para la recta 2x1+x2=8, ¿cuál es el intercepto con eje x1?", "answers": ["4"], "mode": "number", "hint": "Pon x2=0: 2x1=8.", "explain": "El intercepto con eje x1 es 4."}, {"q": "Para la misma recta, ¿cuál es el intercepto con eje x2?", "answers": ["8"], "mode": "number", "hint": "Pon x1=0: x2=8.", "explain": "El intercepto con eje x2 es 8."}, {"q": "Para x1+2x2=8, ¿cuál es el intercepto con eje x1?", "answers": ["8"], "mode": "number", "hint": "Pon x2=0.", "explain": "El intercepto con eje x1 es 8."}, {"q": "Para x1+2x2=8, ¿cuál es el intercepto con eje x2?", "answers": ["4"], "mode": "number", "hint": "Pon x1=0.", "explain": "El intercepto con eje x2 es 4."}, {"q": "El cruce de ambas rectas es (8/3,8/3). Escribe el valor aproximado de x1 con dos decimales.", "answers": ["2.67", "2,67"], "mode": "number", "hint": "8/3 = 2,666...", "explain": "x1=2,67 aproximadamente."}, {"q": "Evalúa Z=3x1+2x2 en (8/3,8/3). Escribe el valor aproximado.", "answers": ["13.33", "13,33", "40/3"], "mode": "number", "hint": "3·8/3 + 2·8/3 = 8 + 16/3 = 40/3.", "explain": "Z=40/3≈13,33."}]}], "solo": [{"q": "Grafica y resuelve: Max Z=5x1+4x2; x1+x2≤10; 2x1+x2≤16; x1,x2≥0.", "hint": "Vértices: ejes y cruce de las dos rectas.", "solution": "Vértices: (0,0),(8,0),(6,4),(0,10). Z:0,40,46,40. Óptimo (6,4), Z=46.", "graphFree": true}, {"q": "Resuelve: Min Z=2x1+3x2; x1+x2≥8; x1≥2; x2≥0.", "hint": "Para mínimo, revisa los vértices inferiores de la región factible.", "solution": "Vértices relevantes: (2,6),(8,0). Z=22 y 16. Óptimo (8,0), Z=16."}, {"q": "Indica si hay múltiples óptimos: Max Z=4x1+4x2; x1+x2≤5; x≥0.", "hint": "La función objetivo es paralela a la restricción.", "solution": "Sí. Todo el segmento entre (5,0) y (0,5) tiene Z=20."}]}, {"id": "estandar", "icon": "🧱", "title": "Forma estándar", "subtitle": "Preparar modelos para simplex, Big M y simplex dual.", "goal": "Convertir cualquier PL a igualdades con variables no negativas.", "lecture": "\n<h3>1. Forma estándar</h3><p>Una forma estándar habitual para trabajar con simplex es escribir el modelo con restricciones en igualdad y variables no negativas. Muchos cursos la escriben como minimización, pero lo importante es entender la conversión.</p><div class=\"formula\">Min Z = c<sup>T</sup>x<br>s.a. Ax=b<br>x≥0</div>\n<h3>2. Variables de holgura, exceso y artificial</h3><table><tr><th>Restricción</th><th>Conversión</th><th>Variable</th></tr><tr><td>≤</td><td>sumar h</td><td>holgura</td></tr><tr><td>≥</td><td>restar e</td><td>exceso</td></tr><tr><td>= o ≥ sin base clara</td><td>agregar A</td><td>artificial</td></tr></table>\n<p>La holgura representa recurso sobrante. El exceso representa cuánto se supera un mínimo. La artificial no tiene significado real; se agrega para poder iniciar simplex y después debe salir de la base.</p>\n<h3>3. Variables con cotas distintas</h3><p>Si una variable no parte desde cero, se hace un cambio de variable. Por ejemplo, si x≥−1, entonces x'=x+1, por lo que x=x'−1 y x'≥0.</p>\n<h3>4. Variable libre</h3><p>Si una variable no tiene restricción de signo, se reemplaza por diferencia de dos variables no negativas:</p><div class=\"formula\">x libre ⇒ x = x<sup>+</sup> − x<sup>−</sup>, con x<sup>+</sup>,x<sup>−</sup>≥0</div>\n<div class=\"note warn\"><b>Error típico:</b> en una restricción ≥ no se suma holgura; se resta exceso.</div>\n", "explained": [{"title": "Ejercicio 1: restricción ≤", "statement": "2x1+3x2≤12. Convertir a igualdad.", "steps": ["Como es ≤, hay capacidad sobrante.", "Se suma holgura h1≥0.", "Queda 2x1+3x2+h1=12.", "La holgura mide cuánto recurso queda sin usar.", "Todas las variables deben ser no negativas."], "answer": "2x1+3x2+h1=12, h1≥0."}, {"title": "Ejercicio 2: restricción ≥", "statement": "x1+2x2≥10. Convertir a igualdad.", "steps": ["Como es ≥, la expresión del lado izquierdo supera un mínimo.", "Se resta variable de exceso e1≥0.", "Queda x1+2x2−e1=10.", "Si luego se necesita base inicial, puede agregarse artificial.", "La variable de exceso no es holgura."], "answer": "x1+2x2−e1=10."}, {"title": "Ejercicio 3: restricción =", "statement": "3x1+x2=15 para simplex con base inicial.", "steps": ["Ya está en igualdad.", "Pero puede no tener variable básica evidente.", "Se agrega artificial A1 para iniciar Big M o dos fases.", "Queda 3x1+x2+A1=15.", "La artificial debe valer 0 al final si el problema original es factible."], "answer": "3x1+x2+A1=15 para Big M."}, {"title": "Ejercicio 4: x≥−2", "statement": "Convertir x≥−2 a variable no negativa.", "steps": ["Queremos una variable nueva que sea ≥0.", "Sumamos 2: x+2≥0.", "Definimos x’=x+2.", "Entonces x=x’−2.", "Usamos x’≥0 en el modelo."], "answer": "x’=x+2; x=x’−2; x’≥0."}, {"title": "Ejercicio 5: variable libre", "statement": "x2 sin restricción de signo.", "steps": ["Una variable libre puede ser positiva o negativa.", "Se representa como diferencia de dos no negativas.", "x2=x2+−x2−.", "x2+≥0 y x2−≥0.", "Se reemplaza x2 en todo el modelo."], "answer": "x2=x2+−x2−, ambas no negativas."}], "guided": [{"title": "Guía: pasar a forma estándar", "intro": "Modelo: Min Z=6x1+3x2; s.a. 2x1+x2≥8; x1+x2≤10; x1≥−1; x2≥0.", "steps": [{"q": "Para x1≥−1, define la nueva variable. Escribe x1p=x1+1.", "answers": ["x1p=x1+1", "x1′=x1+1", "x1prima=x1+1"], "mode": "expr", "hint": "Suma 1 para dejarla no negativa.", "explain": "Definimos x1p=x1+1, por lo tanto x1=x1p−1."}, {"q": "Reemplaza x1 en la restricción 2x1+x2≥8 y simplifica.", "answers": ["2x1p+x2>=10", "2x1p+x2≥10"], "mode": "expr", "hint": "2(x1p−1)+x2≥8 ⇒ 2x1p+x2≥10.", "explain": "La restricción queda 2x1p+x2≥10."}, {"q": "Convierte 2x1p+x2≥10 a igualdad usando exceso e1.", "answers": ["2x1p+x2-e1=10", "2x1p+x2−e1=10"], "mode": "expr", "hint": "En ≥ se resta exceso.", "explain": "2x1p+x2−e1=10."}, {"q": "Convierte x1+x2≤10 ya reemplazando x1=x1p−1.", "answers": ["x1p+x2+h2=11", "x1p+x2+h1=11"], "mode": "expr", "hint": "x1p−1+x2≤10 ⇒ x1p+x2≤11; luego suma holgura.", "explain": "x1p+x2+h2=11."}, {"q": "Si usas Big M para la primera restricción, ¿qué variable adicional agregas?", "answers": ["artificial", "variable artificial", "a1"], "mode": "loose", "hint": "Una restricción ≥ con exceso no entrega base identidad.", "explain": "Se agrega una variable artificial A1."}]}], "solo": [{"q": "Pase a estándar: Max Z=5x1+2x2; 3x1+x2≤18; x1+4x2≥20; x≥0.", "hint": "Para ≤ suma holgura; para ≥ resta exceso y agrega artificial si vas a Big M.", "solution": "3x1+x2+h1=18; x1+4x2−e2+A2=20; x,h,e,A≥0."}, {"q": "Transforme x2≥3.", "hint": "Resta 3 para definir una variable nueva no negativa.", "solution": "x2p=x2−3; x2=x2p+3; x2p≥0."}, {"q": "Transforme x libre en forma estándar.", "hint": "Diferencia de dos no negativas.", "solution": "x=x+−x−, con x+,x−≥0."}]}, {"id": "simplex", "icon": "📊", "title": "Simplex, Big M y dual", "subtitle": "Tablas, pivotes, costos reducidos y artificiales.", "goal": "Entender cómo se mueve una tabla simplex hasta llegar al óptimo.", "lecture": "\n<h3>1. Idea del simplex</h3><p>Simplex no revisa todos los puntos de la región factible. Se mueve de vértice en vértice buscando mejorar la función objetivo. Cada tabla representa una solución básica.</p>\n<h3>2. Tabla simplex</h3><p>La fila Z muestra los costos reducidos. En una maximización escrita con fila Z − c, si queda un número negativo, todavía puede mejorar. En una minimización depende de la convención del curso, por eso siempre mira la regla que está usando la tabla.</p>\n<h3>3. Pivoteo</h3><ol><li>Elegir variable que entra: columna que mejora más Z.</li><li>Elegir variable que sale: razón b/a positiva más pequeña.</li><li>Convertir el pivote en 1.</li><li>Hacer ceros en la columna pivote.</li></ol>\n<h3>4. Big M</h3><p>Big M se usa cuando se agregan variables artificiales. La idea es penalizar mucho que una artificial quede positiva. En maximización se resta M·A; en minimización se suma M·A. Al final, si una artificial queda positiva, el problema original no era factible.</p>\n<h3>5. Simplex dual</h3><p>Se usa cuando la tabla es óptima en costos reducidos, pero no factible porque hay lados derechos negativos. El dual simplex corrige factibilidad manteniendo optimalidad.</p>\n<div class=\"note\"><b>Lectura rápida:</b> primal corrige costos reducidos; dual corrige lados derechos negativos.</div>\n", "explained": [{"title": "Ejercicio 1: elegir columna entrante", "statement": "En una tabla de maximización la fila Z tiene x1=-5, x2=-2, h1=0.", "steps": ["En maximización con fila Z−c, un negativo indica mejora posible.", "El más negativo es -5.", "Entra x1.", "Luego se hace prueba de razón con la columna x1.", "No se elige por intuición, se elige por regla."], "answer": "Entra x1."}, {"title": "Ejercicio 2: elegir fila saliente", "statement": "Columna pivote x1 tiene coeficientes 2, 4, -1 y RHS 10, 12, 8.", "steps": ["Solo se usan coeficientes positivos.", "Razones: 10/2=5; 12/4=3; -1 se descarta.", "La menor razón positiva es 3.", "Sale la variable de la segunda fila.", "El pivote está en esa fila y columna."], "answer": "Sale la segunda fila."}, {"title": "Ejercicio 3: Big M en minimización", "statement": "Min Z=4x1+2x2 con una restricción ≥ que requiere artificial A1.", "steps": ["En minimización, la artificial se penaliza sumando M·A1.", "Objetivo auxiliar: Min Z=4x1+2x2+M A1.", "La artificial permite formar base inicial.", "Durante simplex debe salir si el problema original es factible.", "Si queda positiva al final, no hay solución factible original."], "answer": "Min Z=4x1+2x2+M A1."}, {"title": "Ejercicio 4: reconocer solución múltiple", "statement": "En tabla final, una variable no básica tiene costo reducido cero.", "steps": ["Una variable no básica vale 0 actualmente.", "Si su costo reducido es 0, puede entrar sin cambiar Z.", "Eso genera otro vértice óptimo.", "Por tanto existen múltiples soluciones óptimas.", "Se puede pivotear para encontrar otra solución."], "answer": "Hay múltiples soluciones óptimas si puede entrar sin perder factibilidad."}, {"title": "Ejercicio 5: dual simplex", "statement": "Fila Z ya cumple condición de optimalidad, pero una fila tiene RHS=-4.", "steps": ["La solución no es factible porque RHS negativo implica variable básica negativa.", "No conviene usar primal si los costos ya están correctos.", "Se usa simplex dual.", "Primero sale la fila con RHS más negativo.", "Luego entra una columna usando la regla dual."], "answer": "Aplicar simplex dual."}], "guided": [{"title": "Guía: primera iteración simplex", "intro": "Tabla inicial para Max Z=5x1+4x2; s.a. 2x1+x2≤8; x1+2x2≤8. Fila Z: x1=-5, x2=-4, h1=0, h2=0.", "steps": [{"q": "¿Qué variable entra?", "answers": ["x1"], "mode": "loose", "hint": "En maximización con fila Z−c entra el más negativo.", "explain": "Entra x1 porque -5 es más negativo que -4."}, {"q": "Columna x1: 2 y 1. RHS: 8 y 8. Calcula las razones y escribe la menor.", "answers": ["4"], "mode": "number", "hint": "8/2=4 y 8/1=8.", "explain": "La menor razón positiva es 4, sale la fila 1."}, {"q": "¿Cuál es el elemento pivote?", "answers": ["2"], "mode": "number", "hint": "Cruce columna x1 y fila que sale.", "explain": "El pivote es 2."}, {"q": "Después de dividir la fila pivote por 2, ¿cuánto queda el coeficiente de x2 en esa fila?", "answers": ["0.5", "0,5", "1/2"], "mode": "number", "hint": "Era 1, dividido por 2.", "explain": "Queda 1/2."}, {"q": "¿Por qué se hacen ceros en la columna pivote?", "answers": ["para que x1 sea basica", "para formar identidad", "para que x1 quede en la base"], "mode": "loose", "hint": "Una variable básica debe tener columna tipo identidad.", "explain": "Se hacen ceros para que x1 quede como variable básica."}]}], "solo": [{"q": "En fila Z de max: x1=-3, x2=-7, x3=0. ¿Quién entra?", "hint": "Más negativo.", "solution": "Entra x2."}, {"q": "Columna pivote: 5, 2, -3. RHS: 20, 9, 30. ¿Qué fila sale?", "hint": "Solo razones positivas.", "solution": "20/5=4; 9/2=4,5; -3 se descarta. Sale la primera fila."}, {"q": "Explique qué significa una artificial positiva al final de Big M.", "hint": "La artificial no pertenece al problema original.", "solution": "Indica que el problema original no tiene solución factible."}]}, {"id": "sensibilidad", "icon": "🧠", "title": "Análisis de sensibilidad", "subtitle": "Qué cambia si cambian coeficientes, recursos o costos.", "goal": "Interpretar rangos, precio sombra y cambios sin resolver todo de nuevo.", "lecture": "\n<h3>1. Para qué sirve</h3><p>El análisis de sensibilidad responde: “si cambia un dato, ¿debo resolver todo de nuevo o la solución sigue siendo válida?”. Es útil porque en problemas reales los costos, demandas y disponibilidades cambian.</p>\n<h3>2. Cambios en coeficientes de la función objetivo</h3><p>Si cambia una utilidad o costo c<sub>j</sub>, puede cambiar la pendiente de la función objetivo. Mientras el cambio esté dentro del rango permitido, la base óptima se mantiene. Eso significa que las mismas variables básicas siguen siendo óptimas, aunque el valor de Z puede cambiar.</p>\n<h3>3. Cambios en el lado derecho</h3><p>El lado derecho b representa recursos, demanda o requerimientos. Si cambia b, puede cambiar la cantidad producida. El <b>precio sombra</b> indica cuánto cambia Z por una unidad adicional de recurso, dentro del rango válido.</p>\n<div class=\"formula\">Nuevo Z = Z actual + precio sombra · variación del recurso</div>\n<h3>4. Precio sombra</h3><p>Si el precio sombra de una restricción es 5, una unidad adicional del recurso mejora Z en 5 unidades. Si el recurso tiene holgura, su precio sombra normalmente es 0, porque sobra y tener más no ayuda.</p>\n<h3>5. Interpretación correcta</h3><p>El precio sombra no vale para cualquier cambio. Solo es válido dentro del rango de factibilidad. Si sales del rango, puede cambiar la base y debes resolver de nuevo.</p>\n<div class=\"note warn\"><b>Error típico:</b> usar precio sombra para cambios enormes sin verificar el rango permitido.</div>\n", "explained": [{"title": "Ejercicio 1: precio sombra", "statement": "Z actual=1000. El precio sombra de horas es 8. Se agregan 10 horas dentro del rango.", "steps": ["Identificamos variación: +10 horas.", "Aplicamos Nuevo Z = Z + precio sombra·variación.", "Nuevo Z = 1000 + 8·10.", "Nuevo Z = 1080.", "La condición clave es que el cambio esté dentro del rango."], "answer": "Nuevo Z=1080."}, {"title": "Ejercicio 2: recurso con holgura", "statement": "Una restricción tiene holgura 15 en el óptimo. ¿Qué precio sombra se espera?", "steps": ["Holgura positiva significa que el recurso no se usa completo.", "Si sobra recurso, una unidad adicional no mejora el objetivo.", "Por complementariedad, el precio sombra es 0.", "Interpretación: el recurso no es escaso.", "No conviene pagar por más de ese recurso."], "answer": "Precio sombra 0."}, {"title": "Ejercicio 3: disminución de recurso", "statement": "Z=500, precio sombra=6, recurso disminuye en 20 dentro del rango.", "steps": ["Variación del recurso: -20.", "Cambio en Z = 6·(-20)=-120.", "Nuevo Z=500-120=380.", "Disminuir recurso escaso empeora el objetivo.", "Solo válido dentro del rango."], "answer": "Nuevo Z=380."}, {"title": "Ejercicio 4: cambio fuera de rango", "statement": "Rango permitido para RHS: 40 a 70. El RHS cambia de 60 a 90.", "steps": ["El valor inicial 60 está en rango.", "El nuevo valor 90 supera 70.", "No se puede usar directamente el precio sombra.", "La base puede cambiar.", "Se debe reoptimizar o continuar simplex desde la nueva tabla."], "answer": "Debe resolverse nuevamente o actualizar la tabla."}, {"title": "Ejercicio 5: coeficiente objetivo", "statement": "Si c1 cambia pero sigue dentro de su rango de optimalidad.", "steps": ["La base óptima no cambia.", "Las variables básicas siguen siendo las mismas.", "El valor de Z sí puede cambiar si x1 tiene valor positivo.", "No se requiere resolver desde cero.", "Si sale del rango, puede entrar otra variable."], "answer": "Misma solución básica; Z puede cambiar."}], "guided": [{"title": "Guía: interpretar sensibilidad", "intro": "Situación: Z*=2400. Restricción de horas tiene precio sombra 12 y RHS actual 100. Rango válido del RHS: [80,130].", "steps": [{"q": "Si se agregan 15 horas, ¿el nuevo RHS queda dentro del rango? Responde sí o no.", "answers": ["si", "sí"], "mode": "loose", "hint": "100+15=115 y el rango llega hasta 130.", "explain": "Sí, 115 está dentro de [80,130]."}, {"q": "Calcula el aumento de Z.", "answers": ["180"], "mode": "number", "hint": "12·15.", "explain": "El aumento es 180."}, {"q": "Calcula el nuevo valor de Z.", "answers": ["2580"], "mode": "number", "hint": "2400+180.", "explain": "Nuevo Z=2580."}, {"q": "Si se agregan 50 horas, el RHS sería 150. ¿Puedes usar el precio sombra directamente?", "answers": ["no"], "mode": "loose", "hint": "150 está fuera del rango.", "explain": "No, porque 150 supera 130."}, {"q": "Si una restricción tiene holgura positiva, ¿qué precio sombra esperas?", "answers": ["0", "cero"], "mode": "loose", "hint": "Si sobra, una unidad más no mejora.", "explain": "Precio sombra 0."}]}], "solo": [{"q": "Z=300, precio sombra=4, aumenta recurso en 12 dentro del rango. Calcule nuevo Z.", "hint": "Z nuevo = Z + ps·Δ.", "solution": "300+4·12=348."}, {"q": "Rango RHS [50,90], actual 70. Baja a 45. ¿Se usa precio sombra directo?", "hint": "Compara 45 con el rango.", "solution": "No, 45 está fuera del rango."}, {"q": "Explique diferencia entre rango de optimalidad y rango de factibilidad.", "hint": "Uno se relaciona con c; otro con b.", "solution": "Optimalidad: cambios en coeficientes de objetivo sin cambiar base. Factibilidad: cambios en RHS sin cambiar base."}]}, {"id": "bb", "icon": "🌳", "title": "Programación entera y Branch and Bound", "subtitle": "Variables enteras, relajación lineal, ramas y podas.", "goal": "Resolver problemas enteros pequeños paso a paso.", "lecture": "\n<h3>1. Por qué no basta con redondear</h3><p>En programación entera algunas variables deben ser enteras. Ejemplo: número de camiones, personas, máquinas o proyectos. Resolver el problema como continuo y redondear puede violar restricciones o perder optimalidad.</p>\n<h3>2. Relajación lineal</h3><p>Branch and Bound parte eliminando temporalmente la condición de entero. Ese problema relajado se resuelve como programación lineal. Si la solución ya es entera, termina. Si no, se ramifica.</p>\n<h3>3. Ramificación</h3><p>Si una variable entera sale fraccionaria, por ejemplo x=4,6, ninguna solución entera puede tener x entre 4 y 5. Se crean dos ramas:</p><div class=\"formula\">x ≤ 4<br>x ≥ 5</div>\n<h3>4. Cotas y poda</h3><p>En maximización, la relajación entrega una cota superior de esa rama. Si esa cota no puede superar la mejor solución entera encontrada, se poda. También se poda si la rama es infactible o si la solución relajada ya es entera.</p>\n<h3>5. Regla práctica</h3><ol><li>Resolver relajado.</li><li>Si es entero, guardar incumbente.</li><li>Si no es entero, elegir una variable fraccionaria.</li><li>Crear ramas piso y techo.</li><li>Resolver cada rama.</li><li>Podar por infactibilidad, integralidad o cota.</li></ol>\n", "explained": [{"title": "Ejercicio 1: ramas básicas", "statement": "En una relajación se obtiene x1=3,7 y x1 debe ser entero.", "steps": ["x1=3,7 no es entero.", "El piso es 3.", "El techo es 4.", "Ramas: x1≤3 y x1≥4.", "No se usa x1=4 directamente porque podrían existir enteros mayores."], "answer": "x1≤3 y x1≥4."}, {"title": "Ejercicio 2: poda por cota", "statement": "Maximización. Mejor solución entera Z=80. Una rama relajada da Z=75.", "steps": ["En maximización, la relajación es una cota superior.", "Si ni siquiera relajada llega a 80, ninguna entera dentro de esa rama superará 80.", "Se poda por cota.", "No se ramifica esa rama.", "Se ahorra trabajo."], "answer": "Se poda por cota."}, {"title": "Ejercicio 3: poda por integralidad", "statement": "Una rama relajada da x=(4,2) y Z=90, con variables enteras.", "steps": ["La solución ya es entera.", "Es factible para el problema entero.", "Se compara con la mejor solución entera actual.", "Si mejora, se actualiza incumbente.", "La rama se poda porque ya no necesita ramificarse."], "answer": "Guardar incumbente Z=90 y podar."}, {"title": "Ejercicio 4: poda por infactibilidad", "statement": "Una rama con x1≥5 no tiene solución factible.", "steps": ["Si la relajación es infactible, con más razón no hay solución entera.", "Se descarta la rama.", "No se calcula Z.", "La poda es por infactibilidad.", "Se continúa con otras ramas."], "answer": "Poda por infactibilidad."}, {"title": "Ejercicio 5: no redondear", "statement": "Relajado x=(2,8; 3,1).", "steps": ["Redondear a (3,3) puede violar restricciones.", "Redondear a (2,3) puede no ser óptimo.", "Branch and Bound explora ramas con garantía.", "La idea es comparar cotas.", "Por eso no basta con aproximar."], "answer": "Se debe ramificar, no redondear directamente."}], "guided": [{"title": "Guía: árbol Branch and Bound", "intro": "Maximización entera. Nodo 0 relajado: x1=2,4; x2=3; Z=31. x1 y x2 enteras.", "tree": true, "steps": [{"q": "¿La solución del nodo 0 es entera?", "answers": ["no"], "mode": "loose", "hint": "x1=2,4 es fraccionario.", "explain": "No, porque x1 no es entero."}, {"q": "Escribe la rama izquierda para x1=2,4.", "answers": ["x1<=2", "x1≤2"], "mode": "expr", "hint": "Usa el piso de 2,4.", "explain": "Rama izquierda: x1≤2."}, {"q": "Escribe la rama derecha.", "answers": ["x1>=3", "x1≥3"], "mode": "expr", "hint": "Usa el techo de 2,4.", "explain": "Rama derecha: x1≥3."}, {"q": "Nodo izquierdo da solución entera Z=29. ¿Qué haces con el incumbente?", "answers": ["actualizar", "guardar", "guardar incumbente"], "mode": "loose", "hint": "Es la primera solución entera encontrada.", "explain": "Se guarda como mejor solución entera actual: Z=29."}, {"q": "Nodo derecho relajado da Z=28,5 en maximización. ¿Se poda si el incumbente es 29?", "answers": ["si", "sí"], "mode": "loose", "hint": "La cota superior 28,5 no supera 29.", "explain": "Se poda por cota."}]}], "solo": [{"q": "Relajado: x2=5,25. Escriba las dos ramas.", "hint": "Piso y techo.", "solution": "x2≤5 y x2≥6."}, {"q": "Max. Incumbente Z=120. Rama relajada Z=125 pero fraccionaria. ¿Se poda?", "hint": "Puede superar al incumbente.", "solution": "No se poda por cota; se debe ramificar o seguir resolviendo."}, {"q": "Max. Rama relajada Z=118, incumbente 120. ¿Qué se hace?", "hint": "Cota superior menor que incumbente.", "solution": "Se poda por cota."}]}, {"id": "transporte", "icon": "🚚", "title": "Transporte", "subtitle": "Oferta, demanda, Vogel y MODI.", "goal": "Construir solución inicial y verificar optimalidad.", "lecture": "\n<h3>1. Cuándo se usa</h3><p>Un problema de transporte aparece cuando hay <b>orígenes</b> con oferta y <b>destinos</b> con demanda. Cada ruta tiene un costo, utilidad o tiempo por unidad.</p>\n<h3>2. Balance</h3><p>Antes de resolver se revisa:</p><div class=\"formula\">Oferta total = Demanda total</div><p>Si no se cumple, se agrega origen o destino ficticio.</p>\n<h3>3. Modelo</h3><div class=\"formula\">x<sub>ij</sub> = cantidad enviada desde origen i a destino j<br>Min Z = Σ c<sub>ij</sub>x<sub>ij</sub><br>Σ<sub>j</sub>x<sub>ij</sub> = oferta i<br>Σ<sub>i</sub>x<sub>ij</sub> = demanda j<br>x<sub>ij</sub>≥0</div>\n<h3>4. Vogel</h3><p>Vogel genera una solución inicial. Calcula penalidades como diferencia entre los dos costos menores por fila y columna. Se elige la mayor penalidad y dentro de ella se asigna en el menor costo.</p>\n<h3>5. MODI o simplex de transporte</h3><p>Con una solución básica factible, calculas potenciales u<sub>i</sub> y v<sub>j</sub> en celdas ocupadas: u<sub>i</sub>+v<sub>j</sub>=c<sub>ij</sub>. Luego calculas Δ<sub>ij</sub>=c<sub>ij</sub>−u<sub>i</sub>−v<sub>j</sub> en celdas vacías. En minimización, si todos los Δ≥0, la solución es óptima.</p>\n", "explained": [{"title": "Ejercicio 1: balancear", "statement": "Oferta total 120 y demanda total 100.", "steps": ["La oferta supera la demanda por 20.", "Se agrega un destino ficticio.", "Su demanda es 20.", "Los costos suelen ser 0 si el enunciado no dice otra cosa.", "Ahora oferta=demanda."], "answer": "Agregar destino ficticio con demanda 20."}, {"title": "Ejercicio 2: penalidad Vogel", "statement": "Fila con costos 8, 3, 5.", "steps": ["Ordenamos los dos menores: 3 y 5.", "Penalidad = 5−3.", "Penalidad = 2.", "No se usa el mayor costo.", "La penalidad mide lo que se pierde si no usamos el menor costo."], "answer": "Penalidad 2."}, {"title": "Ejercicio 3: asignación Vogel", "statement": "En una fila elegida, costos 4, 7, 9. Oferta 30. Demandas 10, 50, 20.", "steps": ["Dentro de la fila elegida, tomamos el menor costo: 4.", "La demanda de esa columna es 10.", "La oferta disponible es 30.", "Asignamos min(30,10)=10.", "Se satisface esa demanda y queda oferta 20."], "answer": "Asignar 10 en la celda de costo 4."}, {"title": "Ejercicio 4: MODI potenciales", "statement": "Celda ocupada tiene costo 6. Si u1=2, calcule v2.", "steps": ["En celdas ocupadas se cumple u+v=c.", "2+v2=6.", "v2=4.", "Esto se repite hasta obtener todos los potenciales.", "Se fija un potencial, normalmente u1=0, para iniciar."], "answer": "v2=4."}, {"title": "Ejercicio 5: condición de optimalidad", "statement": "En minimización los Δ son 0, 3, 5, 1.", "steps": ["Todos los Δ son mayores o iguales que 0.", "No existe ruta vacía que reduzca el costo.", "La solución es óptima.", "Si hubiera un Δ negativo, se mejora.", "Si hay Δ=0 en celda vacía, puede haber óptimos múltiples."], "answer": "La solución es óptima."}], "guided": [{"title": "Guía: Vogel y MODI básico", "intro": "Tabla 2x2: costos O1-D1=4, O1-D2=6, O2-D1=5, O2-D2=3. Ofertas 20 y 30. Demandas 25 y 25.", "transport": true, "steps": [{"q": "¿Está balanceado? Escribe sí o no.", "answers": ["si", "sí"], "mode": "loose", "hint": "Oferta total 50 y demanda total 50.", "explain": "Sí, 20+30=25+25=50."}, {"q": "Penalidad fila O1 con costos 4 y 6.", "answers": ["2"], "mode": "number", "hint": "6−4.", "explain": "Penalidad O1=2."}, {"q": "Penalidad fila O2 con costos 5 y 3.", "answers": ["2"], "mode": "number", "hint": "5−3.", "explain": "Penalidad O2=2."}, {"q": "Si eliges la celda de menor costo global O2-D2 con costo 3, ¿cuánto asignas?", "answers": ["25"], "mode": "number", "hint": "Oferta O2=30, demanda D2=25.", "explain": "Asignas min(30,25)=25."}, {"q": "Luego O2 queda con 5 y D1 necesita 25. Si O1 tiene 20, ¿cuánto va de O1 a D1?", "answers": ["20"], "mode": "number", "hint": "O1 debe enviar toda su oferta.", "explain": "x11=20."}, {"q": "Costo total con x22=25, x11=20, x21=5.", "answers": ["180"], "mode": "number", "hint": "25·3 + 20·4 + 5·5.", "explain": "Z=75+80+25=180."}]}], "solo": [{"q": "Balancee: ofertas 40,30; demandas 20,25,15.", "hint": "Compare totales.", "solution": "Oferta=70, demanda=60. Agregar destino ficticio con demanda 10."}, {"q": "Calcule penalidades de fila [6,2,9] y columna [5,1,4].", "hint": "Diferencia entre los dos menores.", "solution": "Fila: 6−2=4. Columna: 4−1=3."}, {"q": "En MODI, c23=8, u2=3, v3=2. Calcule Δ23.", "hint": "Δ=c−u−v.", "solution": "Δ23=8−3−2=3."}]}, {"id": "transbordo", "icon": "🔀", "title": "Transbordo", "subtitle": "Redes con nodos que reciben y envían.", "goal": "Formular y resolver balances de nodos intermedios.", "lecture": "\n<h3>1. Diferencia con transporte</h3><p>En transporte, normalmente se envía directo desde orígenes a destinos. En transbordo aparecen nodos intermedios: bodegas, centros de distribución, ciudades o estaciones que reciben y luego envían.</p>\n<h3>2. Balance de nodo</h3><p>La regla central es:</p><div class=\"formula\">Entrada + oferta propia = salida + demanda propia</div><p>Si el nodo solo transborda, oferta y demanda propia son cero, por lo tanto entrada = salida.</p>\n<h3>3. Variables por arco</h3><p>Se define x<sub>ij</sub> como cantidad enviada desde nodo i al nodo j. Solo se crean variables para arcos permitidos.</p>\n<h3>4. Función objetivo</h3><p>Se suman costos de todos los arcos utilizados:</p><div class=\"formula\">Min Z = Σ c<sub>ij</sub>x<sub>ij</sub></div>\n<h3>5. Capacidades</h3><p>Si un arco tiene capacidad máxima, se agrega x<sub>ij</sub>≤capacidad. Si no existe arco, no se crea variable o se usa costo prohibitivo M si se trabaja como tabla.</p>\n", "explained": [{"title": "Ejercicio 1: nodo puro", "statement": "Bodega B recibe xAB y envía xBC y xBD. No produce ni consume.", "steps": ["Identificamos entrada: xAB.", "Identificamos salidas: xBC y xBD.", "Como no produce ni demanda, entrada=salida.", "Balance: xAB=xBC+xBD.", "Esta ecuación conserva flujo."], "answer": "xAB=xBC+xBD."}, {"title": "Ejercicio 2: nodo con demanda", "statement": "Ciudad C recibe xAC y xBC, envía xCD y además demanda 20.", "steps": ["Entradas: xAC+xBC.", "Salida: xCD.", "Demanda propia: 20.", "Entrada = salida + demanda.", "Balance: xAC+xBC=xCD+20."], "answer": "xAC+xBC=xCD+20."}, {"title": "Ejercicio 3: nodo con oferta", "statement": "Centro E produce 30, recibe xAE y envía xED.", "steps": ["Entrada externa: xAE.", "Oferta propia: 30.", "Salida: xED.", "Entrada + oferta = salida.", "Balance: xAE+30=xED."], "answer": "xAE+30=xED."}, {"title": "Ejercicio 4: función objetivo", "statement": "Arcos AB costo 4, AC costo 6, BC costo 2.", "steps": ["Variable por cada arco: xAB,xAC,xBC.", "Costo total es costo por cantidad.", "Min Z=4xAB+6xAC+2xBC.", "No se agregan arcos inexistentes.", "Luego se suman balances de nodo."], "answer": "Min Z=4xAB+6xAC+2xBC."}, {"title": "Ejercicio 5: capacidad", "statement": "Por el arco AB pasan máximo 50 unidades.", "steps": ["La variable del arco es xAB.", "La capacidad máxima usa ≤.", "Restricción: xAB≤50.", "No reemplaza el balance, lo complementa.", "También xAB≥0."], "answer": "xAB≤50."}], "guided": [{"title": "Guía: formular red de transbordo", "intro": "Nodo P oferta 100. Bodega B intermedia. Clientes C1 demanda 40 y C2 demanda 60. Arcos P-B, B-C1, B-C2. Costos 2,4,5.", "steps": [{"q": "Define la variable para enviar de P a B.", "answers": ["xpb", "x_pb", "xpb=cantidad enviada de p a b"], "mode": "expr", "hint": "Usa x con origen y destino.", "explain": "xPB representa cantidad enviada de P a B."}, {"q": "Escribe balance del nodo P.", "answers": ["xpb=100"], "mode": "expr", "hint": "P solo tiene oferta 100 y envía a B.", "explain": "xPB=100."}, {"q": "Escribe balance del nodo B.", "answers": ["xpb=xbc1+xbc2"], "mode": "expr", "hint": "B no consume ni produce.", "explain": "xPB=xBC1+xBC2."}, {"q": "Escribe demanda de C1.", "answers": ["xbc1=40"], "mode": "expr", "hint": "C1 recibe 40.", "explain": "xBC1=40."}, {"q": "Escribe la función objetivo.", "answers": ["2xpb+4xbc1+5xbc2", "minz=2xpb+4xbc1+5xbc2", "z=2xpb+4xbc1+5xbc2"], "mode": "expr", "hint": "Costo por flujo en cada arco.", "explain": "Min Z=2xPB+4xBC1+5xBC2."}]}], "solo": [{"q": "Nodo N recibe xAN y xBN, envía xNC, y demanda 15. Escriba balance.", "hint": "Entrada = salida + demanda.", "solution": "xAN+xBN=xNC+15."}, {"q": "Nodo M produce 20, recibe xAM, envía xMB y xMC. Balance.", "hint": "Entrada + oferta = salida.", "solution": "xAM+20=xMB+xMC."}, {"q": "Explique cómo usar costo M en una tabla de transbordo.", "hint": "M representa una ruta prohibida o muy indeseable.", "solution": "Se asigna un costo muy grande M para evitar que el algoritmo elija una ruta no permitida, salvo que no exista alternativa."}]}, {"id": "hungaro", "icon": "🎯", "title": "Método húngaro", "subtitle": "Asignación uno a uno para minimizar costos o maximizar beneficios.", "goal": "Resolver problemas de asignación de forma ordenada.", "lecture": "\n<h3>1. Cuándo se usa</h3><p>El método húngaro se usa cuando debes asignar elementos uno a uno: trabajadores a tareas, máquinas a trabajos, vendedores a zonas, conductores a rutas. Cada fila debe quedar asignada a una sola columna y cada columna a una sola fila.</p>\n<h3>2. Modelo</h3><div class=\"formula\">x<sub>ij</sub>=1 si fila i se asigna a columna j; 0 si no<br>Σ<sub>j</sub>x<sub>ij</sub>=1 para cada fila<br>Σ<sub>i</sub>x<sub>ij</sub>=1 para cada columna</div>\n<h3>3. Minimización</h3><ol><li>Cuadrar la matriz si no es cuadrada.</li><li>Restar el menor de cada fila.</li><li>Restar el menor de cada columna.</li><li>Cubrir todos los ceros con el mínimo número de líneas.</li><li>Si líneas=n, buscar ceros independientes.</li><li>Si líneas<n, tomar el menor no cubierto, restarlo a no cubiertos y sumarlo en intersecciones.</li></ol>\n<h3>4. Maximización</h3><p>Si la matriz contiene beneficios, primero se convierte a costos:</p><div class=\"formula\">costo transformado = mayor beneficio de la matriz − beneficio original</div><p>Luego se aplica el método de minimización. El valor final se calcula con la matriz original de beneficios.</p>\n<div class=\"note warn\"><b>Error típico:</b> calcular el total final con la matriz transformada. La transformada solo sirve para encontrar la asignación.</div>\n", "explained": [{"title": "Ejercicio 1: reducción por filas", "statement": "Fila [8,6,7].", "steps": ["El menor de la fila es 6.", "Restamos 6 a cada elemento.", "8−6=2, 6−6=0, 7−6=1.", "La fila reducida queda [2,0,1].", "Debe aparecer al menos un cero en cada fila."], "answer": "[2,0,1]."}, {"title": "Ejercicio 2: reducción por columnas", "statement": "Columna [3,0,5].", "steps": ["El menor de la columna es 0.", "Restar 0 no cambia nada.", "La columna queda [3,0,5].", "Si ya hay cero, puede mantenerse.", "Esto se hace después de reducir filas."], "answer": "[3,0,5]."}, {"title": "Ejercicio 3: matriz no cuadrada", "statement": "Hay 3 trabajadores y 4 tareas.", "steps": ["La matriz es 3x4.", "El método húngaro requiere matriz cuadrada.", "Faltan filas para llegar a 4x4.", "Se agrega un trabajador ficticio.", "Costos ficticios usualmente 0 si no hay penalización."], "answer": "Agregar una fila ficticia."}, {"title": "Ejercicio 4: maximización", "statement": "Beneficios [10,6,8].", "steps": ["Mayor beneficio de la matriz o fila dada: 10.", "Transformación: 10−beneficio.", "10−10=0, 10−6=4, 10−8=2.", "Fila transforma function clean(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').replace(/·/g,'').replace(/\*/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=');}
function checkAnswer(input, step){const val=clean(input); const ans=(step.answers||[]).map(clean); if(step.mode==='number'){let v=String(input).replace(',','.'); let n=parseFloat(v); return ans.some(a=>{if(a.includes('/')){let [p,q]=a.split('/').map(Number); return Math.abs(n-p/q)<0.03} return Math.abs(n-parseFloat(a.replace(',','.')))<0.03})} if(step.mode==='loose'){return ans.some(a=>val.includes(a)||a.includes(val));} return ans.includes(val);}

function hungarianMiniTable(){return `<div class="tableWrap"><table><tr><th></th><th>T1</th><th>T2</th><th>T3</th></tr><tr><th>A</th><td>8</td><td>6</td><td>7</td></tr><tr><th>B</th><td>5</td><td>9</td><td>6</td></tr><tr><th>C</th><td>7</td><td>8</td><td>5</td></tr></table></div>`;}
function graphSandbox(){return `<div class="canvasBox"><canvas id="freeGraph" width="620" height="420" class="graphCanvas"></canvas><div class="grid3"><label>a<input id="ga" type="number" value="1"></label><label>b<input id="gb" type="number" value="1"></label><label>c<input id="gc" type="number" value="10"></label></div><button class="ghost" onclick="drawFreeGraph()">Dibujar ax1+bx2=c</button><p class="tiny muted">Puedes usarlo para practicar interceptos: x1=c/a y x2=c/b.</p></div>`;}
function drawAxes(ctx,w,h,scale=50){ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;for(let i=0;i<=10;i++){let x=50+i*scale,y=h-40-i*scale;ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,h-40);ctx.stroke();ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(w-20,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.fillText(i,x-3,h-22);ctx.fillText(i,28,y+4);}ctx.strokeStyle='#0f172a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(50,h-40);ctx.lineTo(w-20,h-40);ctx.lineTo(w-28,h-45);ctx.moveTo(w-20,h-40);ctx.lineTo(w-28,h-35);ctx.stroke();ctx.beginPath();ctx.moveTo(50,h-40);ctx.lineTo(50,20);ctx.lineTo(45,28);ctx.moveTo(50,20);ctx.lineTo(55,28);ctx.stroke();ctx.fillStyle='#0f172a';ctx.fillText('x1',w-32,h-18);ctx.fillText('x2',22,30);}
function P(x,y,scale=50,h=420){return [50+x*scale,h-40-y*scale];}
function drawLine(ctx,a,b,c,color){let pts=[]; if(b!==0) pts.push([0,c/b]); if(a!==0) pts.push([c/a,0]); if(pts.length>=2){let p1=P(pts[0][0],pts[0][1]); let p2=P(pts[1][0],pts[1][1]); ctx.strokeStyle=color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();}}
function drawGuidedGraph(step=6){let c=$('guidedGraph'); if(!c) return; let ctx=c.getContext('2d'); drawAxes(ctx,c.width,c.height); ctx.fillStyle='rgba(37,99,235,.12)'; ctx.beginPath(); [[0,0],[4,0],[8/3,8/3],[0,4]].forEach((q,i)=>{let p=P(q[0],q[1]); if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);}); ctx.closePath(); ctx.fill(); drawLine(ctx,2,1,8,'#2563eb'); drawLine(ctx,1,2,8,'#7c3aed'); [[0,0],[4,0],[8/3,8/3],[0,4]].forEach(q=>{let p=P(q[0],q[1]);ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill();ctx.fillStyle='#0f172a';ctx.fillText(`(${q[0].toFixed(2)},${q[1].toFixed(2)})`,p[0]+7,p[1]-7);});}
function drawFreeGraph(){let c=$('freeGraph'); if(!c) return; let ctx=c.getContext('2d'); drawAxes(ctx,c.width,c.height); let a=parseFloat($('ga').value||1),b=parseFloat($('gb').value||1),cc=parseFloat($('gc').value||1); drawLine(ctx,a,b,cc,'#2563eb');}
function drawTree(step){let c=$('treeCanvas'); if(!c) return; let ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height); function node(x,y,t,fill){ctx.fillStyle=fill||'#eff6ff';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-85,y-30,170,60,16);ctx.fill();ctx.stroke();ctx.fillStyle='#0f172a';ctx.font='13px sans-serif';t.split('|').forEach((s,i)=>ctx.fillText(s,x-70,y-8+i*18));} node(310,55,'Nodo 0|x1=2,4 Z=31','#eef2ff'); if(step>=2){ctx.strokeStyle='#64748b';ctx.beginPath();ctx.moveTo(280,85);ctx.lineTo(175,145);ctx.moveTo(340,85);ctx.lineTo(445,145);ctx.stroke();node(175,170,'x1≤2|Z=29 entero','#dcfce7');node(445,170,'x1≥3|Z=28,5','#fee2e2');} if(step>=5){ctx.fillStyle='#166534';ctx.fillText('Incumbente Z=29',105,250);ctx.fillStyle='#991b1b';ctx.fillText('Poda por cota',400,250);} }
CanvasRenderingContext2D.prototype.roundRect = CanvasRenderingContext2D.prototype.roundRect || function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;};
function renderPractice(){ $('practica').innerHTML=`<div class="card"><h2>Práctica organizada</h2><p class="muted">Elige un tema y la app te llevará directamente a la práctica guiada o libre.</p><div class="moduleGrid">${MODULES.map(m=>`<div class="mini"><h3>${m.icon} ${m.title}</h3><p class="muted">${m.subtitle}</p><div class="row"><button onclick="currentModule='${m.id}';currentPage='guided';renderCourse();navTo('curso')">Guiada</button><button class="ghost" onclick="currentModule='${m.id}';currentPage='free';renderCourse();navTo('curso')">Sin ayuda</button></div></div>`).join('')}</div></div>`;}
let quizIndex=0, quizScore=0; function renderQuiz(){quizIndex=state.quizIndex||0; quizScore=state.quizScore||0; let q=QUIZ[quizIndex%QUIZ.length]; $('quiz').innerHTML=`<div class="card"><div class="row between"><h2>Quiz de comprensión</h2><span class="pill">${quizIndex+1}/${QUIZ.length}</span></div><p><b>${q.q}</b></p>${q.a.map((a,i)=>`<button class="choice" onclick="answerQuiz(${i})">${a}</button>`).join('')}<div id="quizFb" class="feedback"></div><div class="row"><button class="ghost" onclick="state.quizIndex=0;state.quizScore=0;save();renderQuiz()">Reiniciar</button><span class="tag">Puntaje: ${quizScore}</span></div></div>`;}
function answerQuiz(i){let q=QUIZ[quizIndex%QUIZ.length]; let fb=$('quizFb'); if(i===q.ok){quizScore++; fb.innerHTML=`<span class="okText">Correcto.</span> ${q.e}`;}else{fb.innerHTML=`<span class="badText">No.</span> ${q.e}`;} quizIndex++; state.quizIndex=quizIndex; state.quizScore=quizScore; save(); setTimeout(renderQuiz,1100);}
function renderFormula(){ $('formulario').innerHTML=`<div class="card"><h2>Formulario compacto</h2><p class="muted">Resumen para repasar antes de ejercicios o certamen. Puedes imprimirlo.</p><button class="ghost" onclick="window.print()">Imprimir resumen</button><div class="grid2">${FORMULAS.map(f=>`<div class="mini"><h3>${f[0]}</h3><div class="formula">${f[1]}</div></div>`).join('')}</div></div><div class="card"><h2>Selector de método</h2><table><tr><th>Si el problema dice...</th><th>Usa...</th></tr><tr><td>Dos variables y pide dibujar</td><td>Método gráfico</td></tr><tr><td>Tabla con oferta y demanda</td><td>Transporte</td></tr><tr><td>Nodos intermedios que reciben y envían</td><td>Transbordo</td></tr><tr><td>Asignar personas a tareas uno a uno</td><td>Húngaro</td></tr><tr><td>Variables enteras</td><td>Branch and Bound</td></tr><tr><td>Qué pasa si cambia recurso o utilidad</td><td>Sensibilidad</td></tr></table></div>`;}
function updateProgress(){let pct=Math.round(100*MODULES.filter(m=>state.done[m.id]).length/MODULES.length); $('pct').textContent=pct+'% avance'; $('bar').style.width=pct+'%';}
renderHome(); renderCourse(); renderPractice(); renderQuiz(); renderFormula(); updateProgress();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
